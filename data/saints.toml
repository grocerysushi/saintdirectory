[[saints]]
id = "paul-the-apostle"
name = "Saint Paul the Apostle"
aliases = ["Saint Paul", "Saul of Tarsus", "Paul of Tarsus", "Apostle to the Gentiles"]
years = "First century"
vocation = "Apostle and martyr"
place = "Tarsus and the Mediterranean world"
summary = "After an encounter with Christ, Paul became a missionary and wrote letters preserved in the New Testament."
biography = [
  "Paul was a Jew from Tarsus whose early life and education are described in Acts and in his own letters. He identifies himself as a Pharisee and recalls that he persecuted the Church. Acts gives him both the names Saul and Paul. The latter was the name used in the letters he sent to Christian communities.",
  "Acts places his encounter with the risen Jesus on the road to Damascus. Paul himself writes that he received his commission through a revelation of Christ. After this change in his life, he preached among both Jews and Gentiles. Barnabas helped introduce him to the disciples in Jerusalem and traveled with him on an early mission.",
  "Paul spent substantial periods teaching and forming communities in cities of the eastern Mediterranean. His letters show how often he remained involved after leaving a place. He answered questions about worship, relationships within the community, and moral life. The First Letter to the Corinthians also preserves his account of the proclamation of Christ’s death and resurrection.",
  "One of Paul’s recurring concerns was how Gentile believers belonged to the people of God. His Letter to the Galatians addresses the controversy over circumcision and the law. In Romans he develops a longer account of faith, sin, grace, and the relationship between Jewish and Gentile believers.",
  "Acts follows Paul to Rome as a prisoner awaiting a hearing and closes while he is still preaching there. Christian tradition places his martyrdom in Rome. The letters associated with him have remained one of the principal sources for understanding both early Christian teaching and the practical difficulties of building its first communities.",
]

[[saints.sources]]
