[[saints]]
id = "mary-mother-of-jesus"
name = "Blessed Virgin Mary"
aliases = ["Mary, Mother of Jesus", "Mary, Mother of God", "Saint Mary", "Our Lady", "Madonna", "Theotokos"]
years = "First century, dates uncertain"
vocation = "Mother of Jesus"
place = "Nazareth and Jerusalem"
summary = "The mother of Jesus, honored in Catholic tradition as the Mother of God."
biography = [
  "The Gospels provide a series of scenes from Mary’s life rather than a continuous account. Luke introduces her in Nazareth, betrothed to Joseph. The angel Gabriel announces that she will bear Jesus. Mary asks how this can take place and then gives her assent. Catholic devotion to the Annunciation centers on that exchange.",
  "Mary next visits Elizabeth, who is expecting John the Baptist. Elizabeth greets her with a blessing, and Mary responds with the song known as the Magnificat. It praises God for remembering Israel and describes a reversal in which the lowly are raised and the hungry receive good things. The song remains part of the Church’s evening prayer.",
  "Luke describes Mary and Joseph bringing Jesus to the Temple as a child. Simeon speaks of the child’s future and of suffering that will touch Mary herself. When the family returns to Jerusalem years later, Mary and Joseph look for Jesus after losing sight of him. Luke presents Mary as someone who keeps and reflects on what happens as her son grows.",
  "In John’s Gospel, Mary draws Jesus’ attention to the lack of wine at Cana. She later stands beside the cross, where Jesus entrusts her and the beloved disciple to one another. Acts places her among the disciples praying together in Jerusalem after the Ascension.",
  "The New Testament gives little information about Mary’s childhood or the circumstances of her death. The Presentation of Mary draws on the early tradition preserved in the Protoevangelium of James. Catholic teaching calls her Mother of God because the person she bore is Jesus Christ, truly divine and truly human. Other observances express different aspects of her place in the life of the Church.",
]

[[saints.sources]]
title = "USCCB — Gospel according to Luke, chapter 1"
url = "https://bible.usccb.org/bible/luke/1"

