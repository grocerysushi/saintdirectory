[[saints]]
id = "martin-de-porres"
name = "Saint Martin de Porres"
aliases = ["Martín de Porres", "Martín de Porras", "St. Martin of Lima"]
years = "1579–1639"
vocation = "Dominican lay brother"
place = "Lima, Peru"
summary = "A Dominican lay brother who cared for the sick and poor in colonial Lima."
biography = [
  "Born in Lima to a Spanish father and a formerly enslaved mother, Martin trained as a barber-surgeon before joining the Dominicans. His training gave him practical skills for treating wounds and preparing medicines.",
  "In the Dominican community he worked in the infirmary and cared for people in need. His reputation for service endured in a society where ancestry and skin color sharply limited the opportunities available to him.",
]
patronage = ["Traditionally associated with barbers and hairdressers"]

[[saints.sources]]
title = "Franciscan Media — Saint Martin de Porres"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/"

[[saints]]
id = "charles-borromeo"
name = "Saint Charles Borromeo"
aliases = ["Carlo Borromeo", "San Carlo Borromeo"]
years = "1538–1584"
vocation = "Cardinal and archbishop"
place = "Milan, Italy"
summary = "The archbishop of Milan put the reforms of the Council of Trent into practice and aided his city during a plague."
biography = [
  "Charles held senior offices in Rome under Pope Pius IV and helped bring the Council of Trent to its conclusion. As archbishop of Milan, he used seminaries, diocesan assemblies, and parish visits to improve the formation of clergy and the religious instruction available to laypeople.",
  "When disease and hunger struck Milan in the 1570s, Charles stayed and organized relief. He drew on his own resources to help feed people affected by the crisis.",
]
patronage = ["Traditionally associated with catechists"]

[[saints.sources]]
title = "Franciscan Media — Saint Charles Borromeo"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-charles-borromeo/"

[[saints]]
id = "leo-the-great"
name = "Saint Leo the Great"
aliases = ["Pope Leo I", "Leo I", "Pope Saint Leo the Great"]
years = "Died 461"
vocation = "Pope and Doctor of the Church"
place = "Rome, Italy"
summary = "A fifth-century pope whose letter on Christ's divinity and humanity helped shape the Council of Chalcedon."
biography = [
  "Leo became bishop of Rome in 440. His letter to Flavian of Constantinople, commonly called the Tome of Leo, defended the unity of Christ as one person in two natures, divine and human. The Council of Chalcedon received the letter in 451.",
  "Leo also negotiated on behalf of Rome amid threats to the city. He met Attila in 452 and later appealed to the Vandal leader Genseric for restraint when his forces entered Rome.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Leo the Great"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2008/documents/hf_ben-xvi_aud_20080305.html"

[[saints]]
id = "martin-of-tours"
name = "Saint Martin of Tours"
aliases = ["Martin the Merciful", "Martin of Pannonia"]
years = "c. 316–397"
vocation = "Monk and bishop"
place = "Tours, France"
summary = "A former Roman soldier who established monastic communities and became bishop of Tours."
biography = [
  "Martin was born in the Roman province of Pannonia and served in the army before devoting himself to religious life. He became a disciple of Hilary of Poitiers and established a monastic community at Ligugé. After becoming bishop of Tours, he kept a monastic way of life.",
  "An early account tells of Martin cutting his military cloak in two to share it with a man who had no warm clothing. The story became a familiar image of charity and is often shown in art depicting Martin.",
]
patronage = ["Traditionally associated with horses"]

[[saints.sources]]
title = "Franciscan Media — Saint Martin of Tours"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-of-tours/"

[[saints]]
