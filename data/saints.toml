[[saints]]
id = "martin-de-porres"
name = "Saint Martin de Porres"
aliases = ["Martín de Porres", "Martín de Porras", "St. Martin of Lima"]
years = "1579–1639"
vocation = "Dominican lay brother"
place = "Lima, Peru"
summary = "A Dominican lay brother who cared for the sick and poor in colonial Lima."
biography = [
  "Martín de Porres was born in Lima in 1579 to a Spanish father and a formerly enslaved woman of African descent. The family’s circumstances changed during his childhood, and he learned to earn a living as a barber-surgeon. The trade involved practical medicine as well as hair cutting. It gave him experience treating injuries and preparing remedies in a city divided by wealth, ancestry, and legal status.",
  "He sought a place with the Dominicans in Lima. He entered the community in a subordinate position and was initially assigned ordinary household work. In time he was admitted as a lay brother. His work in the infirmary brought his medical training into the daily life of the convent.",
  "People outside the convent also sought Martin’s help. Accounts describe him finding food for people in need, caring for the sick, and extending hospitality during epidemics. Caring for patients meant changing bedding, bringing meals, and attending to wounds as well as preparing medicines. Those duties gave him regular contact with people whose needs would otherwise go unnoticed.",
  "Later devotional stories attribute extraordinary healings and other miracles to Martin. These accounts express the reputation he acquired among the people of Lima. The most consistent feature of his recorded life is his ability to make use of unprestigious jobs for the benefit of others.",
  "Martin died in 1639. Pope John XXIII canonized him in 1962. He is remembered as a Black and mixed-race religious brother whose place in Dominican life developed in spite of the racial barriers of colonial Peru.",
]
patronage = ["Traditionally associated with barbers and hairdressers"]

[[saints.sources]]
title = "Franciscan Media — Saint Martin de Porres"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-de-porres/"

[[saints]]
id = "charles-borromeo"
name = "Saint Charles Borromeo"
aliases = ["Carlo Borromeo", "San Carlo Borromeo"]
years = "1538–1584"
vocation = "Cardinal and archbishop"
place = "Milan, Italy"
summary = "The archbishop of Milan put the reforms of the Council of Trent into practice and aided his city during a plague."
biography = [
  "Charles Borromeo was born into a noble family in northern Italy in 1538. He studied law before his uncle became Pope Pius IV. Pius gave him senior responsibilities in Rome in 1560, when Charles was still a young man. Those responsibilities brought him into the work of governing the Church before he had served as a parish priest.",
  "Charles helped bring the Council of Trent back into session and saw its final period through to its conclusion in 1563. His work in Rome included putting the council’s decisions into publishable form so bishops and clergy could use them. As archbishop of Milan, he faced the harder task of putting the reforms into practice across a large diocese.",
  "He called assemblies of clergy, visited parishes, and established seminaries for the education of priests. He also supported religious instruction for laypeople. The work was practical and time-consuming. It depended on inspecting conditions parish by parish and finding teachers and clergy who could sustain the reforms after a visitation ended.",
  "During the plague and shortages of the 1570s, Charles remained in Milan and helped organize food and care for the population. He drew on his household’s money and supplies as well as on the work of local clergy. This period gave Milan a familiar image of its archbishop attending to immediate needs during a public crisis.",
  "Charles died in 1584. His reputation rested on both the administration of the council’s reforms and the direct pastoral work he took on in Milan. The two parts of his life explain his enduring association with the education of priests and catechists.",
]
patronage = ["Traditionally associated with catechists"]

[[saints.sources]]
title = "Franciscan Media — Saint Charles Borromeo"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-charles-borromeo/"

[[saints]]
id = "leo-the-great"
name = "Saint Leo the Great"
aliases = ["Pope Leo I", "Leo I", "Pope Saint Leo the Great"]
years = "Died 461"
vocation = "Pope and Doctor of the Church"
place = "Rome, Italy"
summary = "A fifth-century pope whose letter on Christ's divinity and humanity helped shape the Council of Chalcedon."
biography = [
  "Leo had already served as a deacon of the Roman Church and undertaken a diplomatic mission in Gaul when he was chosen as bishop of Rome in 440. The western imperial government was under pressure, and questions about the authority of bishops and the teaching of the Church required attention alongside the welfare of the city.",
  "One of Leo’s most consequential letters went to Flavian of Constantinople during a dispute over how to describe Christ’s divinity and humanity. The letter, commonly called the Tome of Leo, argued that both belong fully to the one person of Christ. It was received at the Council of Chalcedon in 451 and became an important statement of the Church’s teaching.",
  "Leo’s sermons return to that teaching in another form. Preaching on Christmas and Easter, he connects the mystery of Christ to the dignity and conduct of Christians. His work as a theologian is preserved principally in pastoral writing, especially sermons and letters addressed to particular people and situations.",
  "In 452 he took part in the delegation that met Attila in northern Italy. When the Vandals under Genseric entered Rome three years later, Leo again negotiated directly with their leader. The city was plundered, but accounts of Leo’s intervention credit him with securing some restraint. The events show how often civil needs fell to the bishop of Rome in the declining western Empire.",
  "Leo died in 461. The title “the Great” reflects his lasting importance as a pastor, preacher, and defender of the teaching articulated at Chalcedon.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Leo the Great"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2008/documents/hf_ben-xvi_aud_20080305.html"

[[saints]]
id = "martin-of-tours"
name = "Saint Martin of Tours"
aliases = ["Martin the Merciful", "Martin of Pannonia"]
years = "c. 316–397"
vocation = "Monk and bishop"
place = "Tours, France"
summary = "A former Roman soldier who established monastic communities and became bishop of Tours."
biography = [
  "The earliest extended account of Martin is the Life written by his contemporary Sulpicius Severus. It places his birth in Pannonia, his upbringing in Italy, and his military service in Gaul. Sulpicius writes to present Martin as an example of Christian holiness, so his stories about Martin’s youth also tell us how his early followers understood him.",
  "The most familiar episode takes place at Amiens. Martin sees a man exposed to the cold and divides his military cloak to give him half. A dream reported in the same account connects the act with Christ’s identification with people in need. The image of Martin on horseback sharing the cloak became a recognizable subject in Christian art.",
  "After military service, Martin became a disciple of Hilary of Poitiers. At Ligugé he gathered companions for a life of prayer. He was later chosen as bishop of Tours and continued a form of common monastic life at Marmoutier, outside the city. His career shows how closely early monastic communities could be linked to the work of a bishop.",
  "Sulpicius describes Martin visiting rural parts of his diocese and bringing Christian preaching to communities beyond the city. Some episodes have the form of miracle stories. They are part of the early tradition about the bishop, while the communities at Ligugé and Tours are lasting evidence of his importance in the development of monastic life in Gaul.",
  "Martin died in 397. Tours became a center of devotion around his tomb. His military past, his decision to share his cloak, and his later life as monk and bishop account for the different ways he is remembered.",
]
patronage = ["Traditionally associated with horses"]

[[saints.sources]]
title = "Franciscan Media — Saint Martin of Tours"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-martin-of-tours/"

[[saints.sources]]
title = "New Advent, Sulpicius Severus — Life of Saint Martin"
url = "https://www.newadvent.org/fathers/3501.htm"

[[saints]]
id = "josaphat-kuntsevych"
name = "Saint Josaphat Kuntsevych"
aliases = ["Josaphat Kunsevich", "Josaphat Kuncewicz", "John Kunsevich", "Josaphat of Polotsk"]
years = "c. 1580–1623"
vocation = "Basilian archbishop and martyr"
place = "Polotsk and Vitebsk, present-day Belarus"
summary = "A Ruthenian archbishop who supported communion with Rome following the Union of Brest and was killed in Vitebsk."
biography = [
  "Born in Volodymyr in what is now Ukraine, John Kuntsevych spent part of his early life in Vilnius. He entered the monastery of the Holy Trinity there and took the name Josaphat. His religious formation belonged to the Byzantine Christian tradition. That tradition remained central to his ministry after his ordination and appointment as archbishop of Polotsk.",
  "The Union of Brest in 1596 had brought participating bishops of the Ruthenian Church into communion with Rome while preserving their Byzantine liturgy and ecclesiastical traditions. Some clergy and faithful accepted the union and others remained Orthodox. The two communities sometimes asserted authority over the same churches and dioceses.",
  "As archbishop, Josaphat promoted education and discipline among the clergy and visited communities in his jurisdiction. He supported the settlement established at Brest and urged people to accept it. His administration took place amid overlapping religious and political loyalties in the Polish-Lithuanian Commonwealth.",
  "In 1623 Josaphat was killed in Vitebsk during an outbreak of violence. Catholic accounts honor him as a martyr for church unity. Understanding the conflict also requires recognizing the divided communities and competing claims to church jurisdiction that shaped his ministry.",
  "Josaphat was canonized in 1867. His profile in the Roman Rite calendar reflects a life rooted in Eastern Catholic worship and diocesan service. The name Josaphat by which he is remembered is the name he took as a monk.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Josaphat"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-josaphat/"

[[saints.sources]]
title = "Pius XI — Ecclesiam Dei (English translation, Papal Encyclicals Online)"
url = "https://www.papalencyclicals.net/pius11/p11eccle.htm"

[[saints]]
id = "frances-xavier-cabrini"
name = "Saint Frances Xavier Cabrini"
aliases = ["Mother Cabrini", "Francesca Cabrini", "Francesca Saverio Cabrini"]
years = "1850–1917"
vocation = "Religious founder and missionary"
place = "Italy and the United States"
summary = "The founder of the Missionary Sisters of the Sacred Heart of Jesus built schools, orphanages, and hospitals serving immigrant communities."
biography = [
  "Francesca Cabrini grew up in northern Italy with an interest in religious life and missionary work. Her health complicated early attempts to join a congregation. She gained experience in teaching and in the care of children before founding the Missionary Sisters of the Sacred Heart of Jesus in 1880.",
  "She hoped to send sisters to Asia. Pope Leo XIII directed her attention to Italian immigrants in the United States, and in 1889 she traveled to New York with six sisters. Their first work took shape around families facing poverty, crowded housing, and limited access to services in their own language. The sisters began with education and care for children.",
  "Cabrini traveled repeatedly to establish new houses and raise funds. The institutions associated with her work included schools, orphanages, and hospitals. Establishing them required negotiating practical questions such as property, money, and the availability of staff. Her congregation eventually extended its work across the United States and to other countries in the Americas.",
  "She became a United States citizen in 1909 and died in Chicago in 1917. In 1946 Pope Pius XII canonized her, making her the first U.S. citizen to be canonized. Her patronage of immigrants reflects the population for whom she built much of the congregation’s work.",
  "Cabrini’s religious name recalls the missionary Francis Xavier. In the United States she was widely known as Mother Cabrini. The schools and hospitals grew out of the needs she and the sisters encountered in immigrant neighborhoods.",
]
patronage = ["Patron of immigrants"]

[[saints.sources]]
title = "USCCB — Saint Frances Xavier Cabrini, Patroness of Immigrants"
url = "https://www.usccb.org/saintfrancescabrini"

[[saints.sources]]
title = "Franciscan Media — Saint Frances Xavier Cabrini"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-frances-xavier-cabrini/"

[[saints]]
id = "margaret-of-scotland"
name = "Saint Margaret of Scotland"
aliases = ["Queen Margaret of Scotland", "Margaret of Wessex", "Margaret of Dunfermline"]
years = "c. 1045–1093"
vocation = "Queen"
place = "Dunfermline, Scotland"
summary = "A queen of Scotland remembered for her care of people in poverty and her support for religious reform."
biography = [
  "Margaret belonged to the Anglo-Saxon royal family and spent part of her early life on the European continent. Her family returned to England and eventually took refuge in Scotland after the Norman Conquest. There Margaret married Malcolm III. She became queen in a court where her family’s English background and her husband’s Scottish kingship intersected.",
  "Accounts of Margaret’s household describe regular prayer, reading, and care for people in poverty. As queen she had the resources to offer food and other assistance and to support communities of clergy. She and Malcolm gave particular support to Dunfermline, where Margaret was later buried.",
  "Margaret encouraged meetings of church leaders to consider questions of discipline and religious practice. Her biographical tradition presents her as someone able to discuss questions of worship and observance openly with clergy. Those stories come from a life written to celebrate the queen’s piety soon after her death, so the author’s purpose matters alongside the details he records.",
  "Margaret and Malcolm had several children. Their son David later became king of Scotland. In 1093 Malcolm and their eldest son Edward died during an expedition into England. Margaret was already ill and died shortly after receiving news of their deaths.",
  "Devotion to Margaret drew together her family life, her influence on the Church, and the direct service described in her biography. Her English origins explain the name Margaret of Wessex. Her marriage, work as queen, and burial at Dunfermline account for the name by which she is most widely remembered.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Margaret of Scotland"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-margaret-of-scotland/"

[[saints]]
id = "gertrude-the-great"
name = "Saint Gertrude the Great"
aliases = ["Gertrude of Helfta", "Gertrud von Helfta"]
years = "1256–c. 1302"
vocation = "Nun and mystic"
place = "Helfta, Germany"
summary = "A nun of Helfta whose writings join personal prayer to Scripture and the liturgy."
biography = [
  "Gertrude entered the monastery at Helfta as a child in the thirteenth century. The community provided an unusually broad education for women of her time. She studied language and literature and learned to participate in a daily life ordered by prayer, reading, work, and the sung liturgy. She is distinct from Gertrude of Hackeborn, the abbess associated with the same house.",
  "In 1281 Gertrude experienced a change in her life of prayer that she later described as an encounter with Christ. The experience shifted the emphasis of her studies toward Scripture and theology. Her writing continued to draw on the language and forms she had learned before that change, especially the texts heard in communal worship.",
  "Her Spiritual Exercises offers forms of prayer for different stages of the Christian life, including remembering baptism and preparing for death. The work that became known as the Herald of Divine Love is more varied. It includes first-person recollections as well as material preserved by other women of Helfta.",
  "Gertrude’s devotion to the humanity and heart of Christ is closely tied to her reading of Scripture and participation in the liturgy. Her treatment of divine mercy often takes the form of an imagined conversation or encounter. These literary forms are a record of a particular tradition of prayer as well as a witness to her personal experience.",
  "She died around 1302. The continued copying and publication of her writings made Helfta’s spirituality known well beyond the community where it developed.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Gertrude the Great"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20101006.html"

[[saints]]
id = "elizabeth-of-hungary"
name = "Saint Elizabeth of Hungary"
aliases = ["Elizabeth of Thuringia", "Elisabeth von Thüringen", "Árpád-házi Szent Erzsébet"]
years = "1207–1231"
vocation = "Landgravine and Franciscan penitent"
place = "Thuringia and Marburg, Germany"
summary = "A Hungarian princess and the wife of a German landgrave, Elizabeth devoted her later years to caring for the sick in Marburg."
biography = [
  "Elizabeth was the daughter of King Andrew II of Hungary. As a young child she was sent to the court of Thuringia, where she was brought up in anticipation of a dynastic marriage. She married Ludwig IV in 1221. They had three children, and contemporary accounts portray the marriage as a source of mutual support.",
  "Life at court gave Elizabeth access to resources she could use during periods of hardship. She gave food and money to people experiencing poverty and took a personal interest in care for the sick. Franciscan preaching reached Thuringia during her lifetime. The example of Francis of Assisi helped shape how she thought about wealth and her obligations to others.",
  "Ludwig died in 1227 while traveling to join a crusade. His death left Elizabeth in an uncertain position at court. She eventually settled at Marburg, where she used resources available to her as a widow to establish a hospital dedicated to Francis. She worked with patients rather than directing the hospital solely from outside.",
  "Her spiritual adviser Conrad of Marburg expected a severe life of discipline from her. The last years of Elizabeth’s life joined that discipline to everyday work in the hospital. She died in 1231 at the age of twenty-four, after only a few years at Marburg.",
  "Pope Gregory IX canonized Elizabeth in 1235. Marburg became a center of devotion. Her place in Franciscan memory comes from the way she applied the ideals of simplicity and care for the poor while living first as a princess and then as a widow responsible for an institution.",
]
patronage = ["Patron of the Secular Franciscan Order", "Traditionally associated with charitable societies"]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Elizabeth of Hungary"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20101020.html"

[[saints.sources]]
title = "Franciscan Media — Saint Elizabeth of Hungary"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-elizabeth-of-hungary/"

[[saints]]
id = "rose-philippine-duchesne"
name = "Saint Rose Philippine Duchesne"
aliases = ["Philippine Duchesne", "Rose Duchesne", "Mother Duchesne"]
years = "1769–1852"
vocation = "Religious sister and educator"
place = "France and the United States"
summary = "A Sacred Heart sister who opened schools in the United States and later joined a mission among the Potawatomi."
biography = [
  "Rose Philippine Duchesne grew up in Grenoble in the years before the French Revolution. She entered a Visitation community, but the Revolution disrupted religious life and forced the convent to close. She spent part of that period living outside the convent and helping people affected by the upheaval.",
  "After efforts to restore the old community, Duchesne joined Madeleine Sophie Barat’s Society of the Sacred Heart. She wanted to work overseas, and in 1818 she sailed to North America with four other sisters. They reached Missouri and began teaching in Saint Charles. Limited money and unfamiliar conditions made the work more difficult than their preparation in France had suggested.",
  "The sisters established additional houses and schools as the congregation developed in the United States. Education and the organization of new communities occupied much of Duchesne’s working life. Those duties held her in Missouri for years even though she wanted to work more directly among Indigenous people.",
  "In old age she joined a mission at Sugar Creek in what is now Kansas, where Potawatomi families lived after forced removal from their earlier homelands. Her age and the language barrier limited what she could do. The sisters’ accounts recall that she spent long periods in prayer. Her time there was brief, and she returned to Saint Charles.",
  "Duchesne died in Missouri in 1852. The schools associated with the Society of the Sacred Heart and the stories about her prayer at Sugar Creek preserve different parts of her career. The circumstances of the Potawatomi mission also place her work within the history of Indigenous displacement in the United States.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Rose Philippine Duchesne"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-rose-philippine-duchesne/"

[[saints.sources]]
title = "Society of the Sacred Heart — Rose Philippine Duchesne’s Life"
url = "https://rscj.org/shrine/her-life/"

[[saints.sources]]
title = "Missouri Encyclopedia — Rose Philippine Duchesne"
url = "https://missouriencyclopedia.org/people/duchesne-rose-philippine"

[[saints]]
id = "peter-the-apostle"
name = "Saint Peter the Apostle"
aliases = ["Saint Peter", "Simon Peter", "Cephas", "Simon son of Jonah"]
years = "First century"
vocation = "Apostle and martyr"
place = "Galilee and Rome"
summary = "A fisherman named Simon whom Jesus called Peter and who became a leader among the apostles."
biography = [
  "Simon Peter first appears in the Gospels as a fisherman in Galilee. Matthew places his call beside the Sea of Galilee, where he and his brother Andrew leave their nets to follow Jesus. In John, Andrew brings Simon to Jesus, who gives him the name Cephas, the Aramaic name represented in Greek by Peter.",
  "The Gospels single Peter out at several points in the ministry. In Matthew he professes Jesus as the Messiah, and Jesus speaks of building his Church on rock and entrusts Peter with the keys of the kingdom. Peter also objects when Jesus speaks of suffering. During the Passion, he denies knowing Jesus, despite having said that he would remain with him.",
  "John recounts a meeting between Peter and the risen Jesus by the Sea of Tiberias. Jesus asks Peter three times whether he loves him and charges him with caring for his flock. The scene looks back to the denials while placing the emphasis on the responsibility now entrusted to Peter.",
  "In Acts, Peter preaches at Pentecost and takes a prominent role in the early Jerusalem community. The account of Cornelius describes how Peter came to accept Gentile believers into that community. His speech before the apostles and elders in Jerusalem reflects the importance of that experience for early Christian practice.",
  "Early Christian tradition connects Peter with Rome and remembers him as a martyr there. The details of his final years come from tradition. Catholic teaching sees his ministry as foundational to the office of the bishop of Rome. The Roman calendar celebrates him with Paul, whose part in the mission to Gentiles complemented Peter’s role.",
]

[[saints.sources]]
