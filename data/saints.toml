summary = "A nun of Helfta whose writings join personal prayer to Scripture and the liturgy."
biography = [
  "Gertrude entered the community at Helfta in childhood and received a broad education there. An experience she dated to 1281 redirected much of her study toward Scripture and theology.",
  "Her Spiritual Exercises and the work known as The Herald of Divine Love convey a spirituality shaped by communal worship, contemplation, and trust in Christ. The latter work also preserves material recorded by other women at Helfta.",
]

