[[saints]]
id = "clement-i"
name = "Saint Clement I"
aliases = ["Clement of Rome", "Pope Clement I", "Saint Clement"]
years = "Late first century"
vocation = "Pope and Apostolic Father"
place = "Rome, Italy"
summary = "An early bishop of Rome associated with a letter urging reconciliation in the Church at Corinth."
biography = [
  "Clement is remembered among the early bishops of Rome after Peter. Lists transmitted by later Christian authors differ in some details about the first Roman succession. They agree that Clement belonged to the generation close to the apostles. Almost nothing certain is known about his family or early life.",
  "The principal document associated with him is a letter from the church at Rome to the church at Corinth, usually called First Clement. The letter speaks in the name of the Roman community. Early Christian tradition associated its composition with Clement, and it is usually placed near the end of the first century.",
  "Some leaders in Corinth had been removed from their positions. The Roman letter asks the community to end the dispute and restore concord. Its argument draws on Scripture and on examples of humility. It presents leadership as a responsibility to be exercised faithfully and recognized by the community.",
  "The letter is valuable evidence for how Christians understood their relationship to the apostles and to leaders in other churches. It describes ministers carrying forward a responsibility received from earlier generations. It also shows that first-century Christian communities dealt with practical questions of authority, jealousy, and reconciliation.",
  "Clement is honored in the liturgy as a martyr. Later accounts place his death in exile and associate him with an anchor, which appears in many depictions of him. Those details belong to a later tradition. The early witness to Clement’s importance is the influence and preservation of the letter sent to Corinth.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Clement of Rome"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070307.html"

[[saints.sources]]
title = "New Advent — First Letter of Clement to the Corinthians"
url = "https://www.newadvent.org/fathers/1010.htm"

[[saints]]
id = "columban"
name = "Saint Columban"
aliases = ["Columbanus", "Columbán", "Columban of Bobbio"]
years = "c. 543–615"
vocation = "Abbot and missionary"
place = "Ireland, France, and Italy"
summary = "An Irish monk who founded communities on the European continent, including the monastery at Bobbio."
biography = [
  "Columban entered monastic life in Ireland and received his formation at Bangor. Around the end of the sixth century he left with companions for Gaul. Their journey followed an Irish monastic tradition of leaving home to live as pilgrims. Their settlements eventually grew into communities with a lasting place in the religious life of western Europe.",
  "The first foundations included Annegray, Luxeuil, and Fontaine. Their common life emphasized prayer, manual work, and a demanding discipline. Columban’s rules and writings show how seriously he took the formation of monks and the correction of faults within a community.",
  "Columban defended some customs he had brought from Ireland, including the way his community reckoned the date of Easter. This drew him into disputes with local clergy. His relationship with the region’s rulers also deteriorated. He was forced to leave his foundations in Gaul and resumed traveling with companions.",
  "He passed through parts of what are now Switzerland and Austria before reaching northern Italy. At Bobbio he founded another monastery with the support of the Lombard rulers. He spent his last years there and died in 615.",
  "Bobbio became an important center for books, study, and monastic life after Columban’s death. The communities he established, the rules he wrote for their use, and his surviving letters show that he remained concerned with the daily conduct of monks and with the place of their foundations in the wider Church.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Columban"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-columban/"

[[saints.sources]]
title = "Vatican, Benedict XVI — Saint Columban"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2008/documents/hf_ben-xvi_aud_20080611.html"

[[saints]]
id = "andrew-dung-lac"
name = "Saint Andrew Dũng-Lạc"
aliases = ["Andrew Dung-Lac", "Andrew Dung Lac", "Anrê Dũng Lạc", "Vietnamese Martyrs", "Martyrs of Vietnam"]
years = "c. 1795–1839"
vocation = "Priest and martyr"
place = "Hanoi, Vietnam"
summary = "A Vietnamese priest commemorated with a group of 117 martyrs that includes clergy and laypeople."
biography = [
  "Andrew Dũng-Lạc grew up in Vietnam in a period when the Catholic Church relied on local families, catechists, and clergy as well as on missionaries from abroad. The account preserved by Vatican News says that he received instruction from a catechist before baptism. He later taught the faith himself and was ordained a priest in 1823.",
  "Restrictions on Catholic worship put priests and lay Catholics under pressure. Andrew continued to serve after his ordination. Like many Vietnamese priests of the period, he depended on communities willing to receive and protect him. Accounts of his ministry describe earlier arrests before his final imprisonment.",
  "Andrew was arrested with Peter Thi, another Vietnamese priest. The two were taken to Hanoi and executed in 1839. The details belong to a period of repeated persecutions rather than a single campaign that affected all the people later commemorated with him.",
  "In 1988 Pope John Paul II canonized Andrew and 116 others. The group includes Vietnamese bishops, priests, and laypeople as well as missionaries from outside the country. They died in different places and at different times during the eighteenth and nineteenth centuries.",
  "The liturgical title names Andrew as the representative figure of the group. His own biography gives particular visibility to the Vietnamese clergy and catechists who formed and served local communities over a long period, including the catechist from whom he first received religious instruction.",
]

[[saints.sources]]
title = "Vatican News — Saints Andrew Dũng Lạc and his companions"
url = "https://www.vaticannews.va/en/saints/11/24/sts--andrew-d_ng-lc--and-his-companions--martyrs.html"

[[saints]]
id = "catherine-of-alexandria"
name = "Saint Catherine of Alexandria"
aliases = ["Katherine of Alexandria", "Catherine of the Wheel", "Great Martyr Catherine"]
years = "Traditionally placed in the early fourth century"
vocation = "Martyr in Christian tradition"
place = "Alexandria, Egypt"
summary = "A martyr honored in Eastern and Western Christianity, whose life is known chiefly through tradition."
biography = [
  "Catherine of Alexandria is remembered as an early Christian martyr. The stories usually place her in Alexandria in the early fourth century. The surviving narratives are much later than the events they describe, and details such as her family, education, and the circumstances of her death cannot be verified independently.",
  "The best-known account portrays her as a well-educated young woman who challenges an emperor’s treatment of Christians. She disputes with philosophers called to answer her. The story’s emphasis on her ability to reason about her faith helped shape her later association with students, teachers, and others whose work depends on argument and learning.",
  "Later tellings describe an attempt to execute her on a wheel that breaks before it can be used. The wheel became her principal attribute in Western art. It identifies Catherine in paintings or sculpture even where the rest of the story is absent.",
  "Devotion to Catherine flourished in both Eastern and Western Christianity. In medieval Europe she was counted among the Fourteen Holy Helpers. Her legend also became associated with the monastery on Mount Sinai that bears her name.",
  "The distinction between her cult and the written legend matters for reading her biography. The long history of devotion and the distinctive images of Catherine are well attested. Her trial, debates, and the broken wheel are the traditional story through which generations of Christians remembered her steadfastness.",
]
patronage = ["Traditionally associated with teachers, students, and lawyers"]

[[saints.sources]]
title = "Franciscan Media — Saint Catherine of Alexandria"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-catherine-of-alexandria/"

[[saints.sources]]
title = "Encyclopaedia Britannica — Saint Catherine of Alexandria"
url = "https://www.britannica.com/biography/Saint-Catherine-of-Alexandria"

[[saints]]
id = "andrew-the-apostle"
name = "Saint Andrew the Apostle"
aliases = ["Saint Andrew", "Andrew the First-Called", "Andreas"]
years = "First century"
vocation = "Apostle and martyr"
place = "Galilee and, by tradition, Patras"
summary = "The brother of Simon Peter, Andrew was among the first followers of Jesus."
biography = [
  "Andrew came from Bethsaida in Galilee and worked as a fisherman. Matthew places him with his brother Simon Peter when Jesus calls them beside the Sea of Galilee. John gives an earlier scene in which Andrew, previously a disciple of John the Baptist, goes to meet Jesus and then tells Simon about him.",
  "In John, Andrew repeatedly notices people who are outside the immediate circle of those speaking with Jesus. When a crowd needs food, he points out the boy who has loaves and fish, while recognizing the difficulty of feeding everyone. Later, when Greek visitors ask Philip to arrange an encounter with Jesus, Philip turns to Andrew before they take the request together.",
  "The Gospel of Mark places Andrew with Peter, James, and John when they ask about Jesus’ words concerning the Temple. Acts names him among the disciples gathered after the Ascension. The New Testament offers no comparable account of his later travels.",
  "Traditions about his preaching connect him with areas around the Black Sea and with Greece. The account of his martyrdom at Patras belongs to that tradition. Art often represents him with a diagonal cross, although the shape is not recoverable from the Gospel accounts.",
  "Eastern Christian tradition calls Andrew the First-Called. His connection with both his brother Peter and the Eastern churches has also given him a place in Catholic and Orthodox encounters.",
]
patronage = ["Traditionally associated with Scotland and fishermen"]

[[saints.sources]]
title = "Franciscan Media — Saint Andrew"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-andrew/"

[[saints.sources]]
title = "Vatican, Benedict XVI — Andrew, the First-Called"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2006/documents/hf_ben-xvi_aud_20060614.html"

