aliases = ["Mother Cabrini", "Francesca Cabrini", "Francesca Saverio Cabrini"]
years = "1850–1917"
vocation = "Religious founder and missionary"
place = "Italy and the United States"
summary = "The founder of the Missionary Sisters of the Sacred Heart of Jesus built schools, orphanages, and hospitals serving immigrant communities."
biography = [
  "Frances founded her congregation in Italy and traveled with six sisters to New York in 1889 at the urging of Pope Leo XIII. They began by helping Italian immigrants who had arrived with little access to education, healthcare, or other social services.",
  "Cabrini supported the development of charitable institutions across the Americas. She became a U.S. citizen and later became the first U.S. citizen canonized by the Catholic Church.",
]
patronage = ["Patron of immigrants"]

