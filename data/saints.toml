name = "Saint Josaphat Kuntsevych"
aliases = ["Josaphat Kunsevich", "Josaphat Kuncewicz", "John Kunsevich", "Josaphat of Polotsk"]
years = "c. 1580–1623"
vocation = "Basilian archbishop and martyr"
place = "Polotsk and Vitebsk, present-day Belarus"
summary = "A Ruthenian archbishop who supported communion with Rome following the Union of Brest and was killed in Vitebsk."
biography = [
  "Born in what is now Ukraine, John took the name Josaphat when he entered Basilian monastic life. As archbishop of Polotsk, he sought to strengthen the clergy and implement the Union of Brest, under which participating Eastern Christian bishops entered communion with Rome while retaining their liturgical tradition.",
  "The union met opposition and conflicting claims to ecclesiastical authority. Josaphat was killed by a mob in Vitebsk in 1623 during this period of religious and political tension.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Josaphat"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-josaphat/"

[[saints]]
