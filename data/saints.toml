[[saints]]
id = "albert-the-great"
name = "Saint Albert the Great"
aliases = ["Albertus Magnus", "Albert of Cologne", "Albert of Lauingen"]
years = "Early thirteenth century–1280"
vocation = "Dominican bishop and Doctor of the Church"
place = "Germany and France"
summary = "A Dominican scholar whose work on philosophy and nature helped shape medieval university teaching."
biography = [
  "Albert was born in southern Germany in the early thirteenth century. While studying at Padua he joined the Order of Preachers. He taught in Dominican houses before taking up work at the University of Paris. His order later sent him to Cologne to organize a center for advanced study.",
  "Thomas Aquinas studied with Albert. Both worked at a time when Latin readers were gaining access to more of Aristotle’s writings and to the commentaries that accompanied them. Albert wanted students to understand the arguments of ancient and medieval thinkers well enough to assess them. His own commentaries covered subjects well beyond theology.",
  "Albert wrote about plants, animals, minerals, and the natural world. He drew on inherited books, but he also attended to what people could observe for themselves. His work allowed scientific and philosophical questions to be treated at length within the education of a Dominican teacher.",
  "Church government interrupted his life of teaching. He served as bishop of Regensburg and later returned to study, writing, preaching, and work on behalf of the order. He spent his final years in Cologne and died there in 1280.",
  "Albert’s reputation as a teacher rests partly on the breadth of the subjects he thought worth studying. Pope Pius XI recognized him as a Doctor of the Church. His association with the natural sciences draws on the range of inquiry visible in his surviving work.",
]
patronage = ["Patron of natural scientists"]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Albert the Great"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20100324.html"

[[saints.sources]]
title = "Franciscan Media — Saint Albert the Great"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-albert-the-great/"

[[saints]]
id = "cecilia"
name = "Saint Cecilia"
aliases = ["Cecilia of Rome", "Cecily", "Santa Cecilia"]
years = "Dates uncertain"
vocation = "Martyr in Christian tradition"
place = "Rome, Italy"
summary = "An early Roman martyr venerated as a patron of music and musicians."
biography = [
  "Cecilia was honored in the early Church at Rome as a virgin and martyr. A Roman church bearing her name is among the historical traces of that devotion. Her name also entered the Roman Eucharistic prayer. The evidence for the details told about her marriage and death is much later.",
  "The customary account describes Cecilia as a young Christian woman married to Valerian. In that story, Valerian comes to share her faith, as does his brother Tiburtius. The narrative connects their deaths with Cecilia’s own refusal to give up her faith. These events cannot be reconstructed from a contemporary biography.",
  "One passage of the later account places music at Cecilia’s wedding. While the instruments sound around her, she prays. Over time this image gave her a special association with music in Christian devotion. In paintings and sculpture she may appear with a small organ or another instrument, even though the evidence does not identify her as a professional musician.",
  "Church musicians, choirs, and others who make music have celebrated her as a patron. Her iconography shows how a detail remembered in worship can acquire a long cultural life. The music associated with her feast and the Roman church dedicated to her are better documented than the individual events of her early story.",
]
patronage = ["Traditionally associated with music and musicians"]

[[saints.sources]]
title = "Franciscan Media — Saint Cecilia"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-cecilia/"

[[saints.sources]]
title = "Encyclopaedia Britannica — Saint Cecilia"
url = "https://www.britannica.com/biography/Saint-Cecilia"

[[saints]]
id = "anthony-of-padua"
name = "Saint Anthony of Padua"
aliases = ["Saint Anthony", "Anthony of Lisbon", "António de Lisboa", "Antonio da Padova"]
years = "c. 1195–1231"
vocation = "Franciscan priest and Doctor of the Church"
place = "Portugal and Italy"
summary = "A Franciscan preacher born in Portugal who spent his last years in Italy."
biography = [
  "Anthony was born in Lisbon and was known in his early life as Fernando. He entered a community of Augustinian canons and studied at Coimbra. His training in Scripture and theology preceded the Franciscan ministry for which he became known.",
  "The death of Franciscan missionaries in Morocco led him to join the Friars Minor and take the name Anthony. He traveled to Morocco, but illness forced him to leave. On the return journey he reached Sicily, then found a place in the developing Franciscan order in Italy.",
  "Anthony became known for public preaching. His knowledge of Scripture and his ability to explain it won him responsibilities in the order’s teaching as well as its preaching. He worked in Italy and France. In his surviving sermons, the exposition of biblical passages is closely tied to questions of conduct, mercy, and care for the poor.",
  "His final ministry was associated with Padua. He died nearby in 1231 and was canonized the following year. Padua became the center of the devotion that gives him his familiar name, while Lisbon and Coimbra mark the earlier years of his life.",
  "Catholics often ask Anthony’s intercession when they have lost something. That custom is one part of his later reception. His teaching and preaching explain his formal recognition as a Doctor of the Church.",
]
patronage = ["Traditionally associated with finding lost items"]

[[saints.sources]]
title = "Franciscan Media — Saint Anthony of Padua"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-anthony-of-padua/"

[[saints.sources]]
title = "Vatican, Benedict XVI — Saint Anthony of Padua"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20100210.html"

[[saints]]
id = "anthony-the-great"
name = "Saint Anthony the Great"
aliases = ["Saint Anthony", "Anthony of Egypt", "Anthony the Abbot", "Anthony of the Desert", "Antony the Great"]
years = "c. 251–356"
vocation = "Desert monk"
place = "Egypt"
summary = "An Egyptian ascetic whose life of prayer inspired Christian monastic communities."
biography = [
  "Anthony was born in Egypt in the third century. Much of the customary account comes from the Life of Anthony attributed to Athanasius of Alexandria. The work was written to explain the spiritual purpose of Anthony’s way of life and became one of the most influential accounts of early Christian monasticism.",
  "According to the Life, Anthony heard a Gospel reading about giving possessions to the poor. He arranged care for his younger sister, parted with his property, and began learning from people already practicing a life of prayer and self-discipline near his home. He later withdrew further from ordinary settlement.",
  "His times of solitude attracted visitors rather than cutting off all contact with others. People came for advice, and disciples settled in the area. Athanasius depicts Anthony advising them about prayer, persistence, and the proper use of their possessions and bodies. The Life’s stories of spiritual combat belong to its religious account of that discipline.",
  "Tradition places Anthony in Alexandria at times of persecution and Christian controversy. His reputation rests principally on his work in Egypt, where the example of desert ascetics helped shape several forms of monastic life.",
  "Anthony died in 356. The reading and translation of his Life introduced his example to Christian communities far from Egypt. He is called Anthony the Great or Anthony the Abbot to distinguish him from later saints, including Anthony of Padua.",
]
patronage = ["Traditionally associated with butchers"]

[[saints.sources]]
title = "Franciscan Media — Saint Anthony of Egypt"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-anthony-of-egypt/"

[[saints.sources]]
title = "New Advent, Athanasius — Life of Saint Anthony"
url = "https://www.newadvent.org/fathers/2811.htm"

[[saints]]
id = "francis-of-assisi"
name = "Saint Francis of Assisi"
aliases = ["Francis of Assisi", "Francesco d'Assisi", "Francis Bernardone", "Poverello"]
years = "c. 1181–1226"
vocation = "Friar and religious founder"
place = "Assisi, Italy"
summary = "The founder of the Friars Minor embraced a life of Gospel poverty and expressed his love of creation in song."
biography = [
  "Francis grew up in the household of a cloth merchant in Assisi. His youth included the ambitions expected of a young man with money and social prospects. Military conflict, captivity, and illness preceded the change in his life that led him toward prayer and care for people he had previously avoided.",
  "Francis later remembered service among lepers as a decisive experience. He spent time at small churches around Assisi and began to live by work and alms. Companions joined him. They made the imitation of Christ in poverty and fraternity the organizing principle of their new community.",
  "The Friars Minor grew rapidly. Francis traveled and preached, and in 1219 he met Sultan al-Malik al-Kamil in Egypt during the Fifth Crusade. As the order expanded, it had to establish a rule and offices capable of supporting communities at a distance from Assisi.",
  "Francis wanted people to encounter the Gospel through familiar things. At Greccio he arranged a Christmas celebration around a manger. His Canticle of the Creatures expresses gratitude for the created world through ordinary realities such as water, fire, and the earth.",
  "In his final years Francis endured severe illness. Early Franciscan tradition records that he received the stigmata, the marks associated with Christ’s wounds. He died in 1226 near Assisi. His legacy includes the religious family that grew from his companions and a widely shared devotion to the care he showed people and creation.",
]
patronage = ["Patron of ecology", "Traditionally associated with animals"]

[[saints.sources]]
title = "Franciscan Media — Saint Francis of Assisi"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-francis-of-assisi/"

[[saints.sources]]
title = "Vatican, Benedict XVI — Saint Francis of Assisi"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20100127.html"

[[saints]]
id = "therese-of-lisieux"
name = "Saint Thérèse of Lisieux"
aliases = ["Saint Thérèse", "The Little Flower", "Thérèse Martin", "Thérèse of the Child Jesus", "Thérèse of the Holy Face", "Teresa of Lisieux"]
years = "1873–1897"
vocation = "Carmelite nun and Doctor of the Church"
place = "Lisieux, France"
summary = "The Carmelite known as the Little Flower taught a way of trust in God practiced through ordinary acts of love."
biography = [
  "Thérèse Martin was born in Alençon in 1873 and grew up with her sisters in a Catholic household. After her mother died, the family moved to Lisieux. Several of her sisters entered religious life, and Thérèse began seeking admission to the Carmel herself while still very young.",
  "She entered the Lisieux Carmel at fifteen. Her years as a nun were largely spent within the community, carrying out its ordinary work and obligations. She hoped to contribute to the Church’s missions through prayer and corresponded with missionaries. She never traveled on a mission herself.",
  "The writings known as Story of a Soul were assembled from autobiographical manuscripts she wrote on request. They describe a way of approaching God through trust and openness about human weakness. Thérèse gives weight to ordinary choices made in love, including acts of patience in situations where little outward distinction is possible.",
  "In her last illness, tuberculosis weakened her before her death in 1897. She wrote about a period of darkness in which faith no longer felt easy. That part of her testimony sits alongside the confidence associated with her little way and helps explain why her work has reached readers facing different kinds of uncertainty.",
  "The circulation of her writings made her known far beyond Lisieux. Pius XI designated her a patron of the missions. John Paul II proclaimed her a Doctor of the Church in 1997 because of the lasting role of her spiritual teaching.",
]
patronage = ["Patron of the missions", "Traditionally associated with florists"]

[[saints.sources]]
title = "Francis — C’est la confiance, apostolic exhortation on Saint Thérèse"
url = "https://www.vatican.va/content/francesco/en/apost_exhortations/documents/20231015-santateresa-delbambinogesu.html"

[[saints.sources]]
title = "Franciscan Media — Saint Thérèse of Lisieux"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-therese-of-lisieux/"

[[saints]]
id = "teresa-of-calcutta"
name = "Saint Teresa of Calcutta"
aliases = ["Mother Teresa", "Teresa of Kolkata", "Gonxha Agnes Bojaxhiu", "Anjezë Gonxhe Bojaxhiu"]
years = "1910–1997"
vocation = "Religious founder and missionary"
place = "Skopje and Kolkata"
summary = "The founder of the Missionaries of Charity built a congregation dedicated to serving people who were poor or dying."
biography = [
  "Born Gonxha Agnes Bojaxhiu in Skopje in 1910, Teresa grew up in an Albanian Catholic family. She joined the Sisters of Loreto as a young woman and went to India. She worked as a teacher in Calcutta, now Kolkata, and spent years in the life of that congregation before founding another community.",
  "In 1946, while traveling by train to Darjeeling for a retreat, she discerned a vocation to serve people living in poverty outside the Loreto schools. With permission to leave the convent, she began working in Kolkata. She acquired practical training and began teaching and caring for people in settings with few resources.",
  "The Missionaries of Charity became a religious congregation in 1950. Their work included homes for people who were dying, care for children, and work among people affected by diseases such as leprosy. The congregation grew to include communities in many countries. It retained an emphasis on direct service and common religious life.",
  "Teresa received the Nobel Peace Prize in 1979. Her public recognition brought attention and support to her work. It also meant that she spoke for an international institution whose daily care depended on many sisters, volunteers, and local workers.",
  "She died in Kolkata in 1997, and Pope Francis canonized her in 2016. The Catholic Church remembers her for her vocation to serve people experiencing extreme poverty and isolation. The congregation she founded continues to carry out that work.",
]

[[saints.sources]]
title = "Holy See — Biography of Mother Teresa of Calcutta"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20031019_madre-teresa_en.html"

[[saints.sources]]
title = "Francis — Homily at the canonization of Mother Teresa of Calcutta"
url = "https://www.vatican.va/content/francesco/en/homilies/2016/documents/papa-francesco_20160904_omelia-canonizzazione-madre-teresa.html"

[[saints.sources]]
title = "Nobel Prize — Mother Teresa, biographical"
url = "https://www.nobelprize.org/prizes/peace/1979/teresa/biographical/"
