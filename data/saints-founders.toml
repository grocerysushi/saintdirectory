[[saints]]
id = "ignatius-of-loyola"
name = "Saint Ignatius of Loyola"
aliases = ["Ignacio de Loyola", "Íñigo López de Loyola", "Ignatius Loyola"]
years = "1491–1556"
vocation = "Jesuit priest and religious founder"
place = "Spain and Rome"
summary = "Ignatius founded the Society of Jesus with companions and developed a method of prayer and discernment in the Spiritual Exercises."
biography = [
  "Íñigo López de Loyola grew up in a Basque noble family and hoped for a career in military and court service. He was injured defending Pamplona in 1521. During his recovery he read accounts of Christ and the saints. He later described paying attention to how different kinds of reading affected his desires, including how long their effects lasted.",
  "Ignatius traveled to Montserrat and spent months at Manresa in prayer and reflection. Experiences from this period helped shape the Spiritual Exercises. Their method uses guided prayer, examination of experience, and reflection on the life of Christ to help someone discern a decision. Ignatius revised the exercises over time as he gave them to other people.",
  "While studying in Paris he formed a group that included Francis Xavier and Peter Faber. They made vows together in 1534 and later placed themselves at the pope’s disposal. Paul III approved the Society of Jesus in 1540. As the first superior general, Ignatius guided its communities from Rome as members undertook missions and founded schools in other parts of the world.",
  "Ignatius worked on the Society’s Constitutions and kept up extensive correspondence with its dispersed members. He died in 1556. The Spiritual Exercises continue to be used in retreats by Jesuits and by people outside the order, and Ignatius is traditionally associated with that practice.",
]
patronage = ["Traditionally associated with spiritual retreats"]

[[saints.sources]]
title = "Society of Jesus — Saint Ignatius of Loyola"
url = "https://www.jesuits.global/saint-blessed/saint-ignatius-of-loyola/"

[[saints.sources]]
title = "Franciscan Media — Saint Ignatius of Loyola"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-ignatius-of-loyola/"

[[saints]]
id = "francis-xavier"
name = "Saint Francis Xavier"
aliases = ["Francisco Javier", "Francisco de Jasso y Azpilicueta", "Francis Xavier, Jesuit"]
years = "1506–1552"
vocation = "Jesuit priest and missionary"
place = "Goa, Japan, and the coast of China"
summary = "A founding Jesuit who carried out missionary work in India, Southeast Asia, and Japan."
biography = [
  "Francis was born in 1506 at the castle of Xavier in the Kingdom of Navarre. He studied and taught in Paris, where he shared quarters with Ignatius of Loyola and Peter Faber. The three were among the companions who made vows together at Montmartre and formed the community that became the Society of Jesus.",
  "Francis left Europe in 1541 and reached Goa the following year. His ministry took him to fishing communities in southern India and later to parts of Southeast Asia. Letters from his journeys describe the scale of the task and practical problems such as teaching across languages and preparing local people to sustain new Christian communities.",
  "In 1549 he traveled to Japan with companions. Conditions varied among regions and authorities, and the missionaries had to learn how to communicate their beliefs in an unfamiliar intellectual and religious setting. Francis left Japan after about two years. He then sought to enter China and died in 1552 on the island of Shangchuan while awaiting passage.",
  "Francis was canonized in 1622 in the same ceremony as Ignatius of Loyola. Catholic tradition remembers him for the geographic reach of his missionary work and his efforts to organize communities that could continue after he moved on. He shares patronage of the Catholic missions with Thérèse of Lisieux, whose life of prayer took place inside a Carmelite convent.",
]
patronage = ["Patron of the missions"]

[[saints.sources]]
title = "Franciscan Media — Saint Francis Xavier"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-francis-xavier/"

[[saints]]
id = "philip-neri"
name = "Saint Philip Neri"
aliases = ["Filippo Neri", "Philip Romolo Neri", "Apostle of Rome"]
years = "1515–1595"
vocation = "Priest and religious founder"
place = "Rome, Italy"
summary = "Philip gathered Romans for prayer and spiritual conversation, forming the community that became the Oratory."
biography = [
  "Philip was born in Florence and settled in Rome as a young man. He spent time studying, praying, and meeting people throughout the city. Before he became a priest he worked with others to help pilgrims and people who were sick, including through a confraternity that provided practical assistance in Rome.",
  "After ordination, Philip spent long hours hearing confessions. He invited people to meetings that brought together prayer, readings, conversation, and music. These gatherings became known as the Oratory. They made room for sustained religious formation among people whose everyday lives took place in shops, streets, homes, and churches across the city.",
  "A community of priests formed to carry on the work, and the Congregation of the Oratory received papal approval in 1575. Its members lived together and served a local community. Philip’s circle also included people such as Cesare Baronius, whose historical studies became part of the wider intellectual life of the early Oratory.",
  "Biographical accounts remember Philip’s humor and his insistence on humility. He resisted the attention that attached itself to his reputation, sometimes using jokes to redirect it. He died in 1595. The Oratory continued to develop in independent houses, and Philip’s name remained closely associated with devotional life in Rome.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Philip Neri"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-philip-neri/"

[[saints]]
id = "francis-de-sales"
name = "Saint Francis de Sales"
aliases = ["François de Sales", "Francis of Sales", "Bishop of Geneva"]
years = "1567–1622"
vocation = "Bishop and Doctor of the Church"
place = "Annecy and the Chablais"
summary = "A bishop and spiritual writer who described how people could pursue a devout life within their everyday responsibilities."
biography = [
  "Francis was born into a noble family in Savoy in 1567. He studied in Paris and Padua and qualified in law. His decision to become a priest led to a ministry in the Chablais, where communities had been shaped by the Reformation. He preached and circulated written explanations of Catholic teaching to reach readers he could not easily meet.",
  "Francis became bishop of Geneva in 1602 and resided in Annecy, from where his predecessors had governed the diocese. He visited communities, taught, and corresponded with people seeking practical spiritual advice. He came to know Jane Frances de Chantal through this work, and together they founded the Visitation of Holy Mary.",
  "His Introduction to the Devout Life addresses people living outside monasteries and shows how prayer and moral attention can fit their occupations and relationships. The Treatise on the Love of God examines the movement of human love toward God. Both works reflect experiences gathered over years of spiritual direction and pastoral life.",
  "Francis died in 1622 while traveling through Lyon. The Catholic Church recognizes him as a Doctor of the Church. Pope Francis’s 2022 apostolic letter marking the four-hundredth anniversary of his death returns to his understanding of love and the importance of responding to people’s particular circumstances.",
]

[[saints.sources]]
title = "Francis — Totum amoris est, apostolic letter on Saint Francis de Sales"
url = "https://www.vatican.va/content/francesco/en/apost_letters/documents/20221228-totum-amoris-est.html"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Francis de Sales"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2011/documents/hf_ben-xvi_aud_20110302.html"

[[saints]]
id = "jane-frances-de-chantal"
name = "Saint Jane Frances de Chantal"
aliases = ["Jeanne-Françoise de Chantal", "Jane de Chantal", "Jeanne de Chantal"]
years = "1572–1641"
vocation = "Religious founder"
place = "Dijon and Annecy, France"
summary = "A widowed mother who founded the Visitation of Holy Mary with Francis de Sales."
biography = [
  "Jane was born into a prominent family in Dijon in 1572. She married Christophe de Rabutin, baron de Chantal, and took responsibility for a household and children. After her husband died, she had to make decisions about her children’s future and manage a household in circumstances that gave a widow limited independence.",
  "In 1604 Jane met Francis de Sales while he was preaching in Dijon. Their correspondence and friendship gave her a way to connect prayer with her responsibilities as a parent and widow. Francis became her spiritual director. They spent several years discussing a religious community that would make room for women unable to follow the demanding physical discipline of some existing orders.",
  "Jane and Francis founded the Visitation of Holy Mary at Annecy in 1610. Its early members practiced prayer and common life, and the foundation initially allowed a degree of service outside the house. As the institute developed, it adopted enclosure. Jane guided the community through that transition and took part in founding additional houses.",
  "After Francis died in 1622, Jane continued to lead the expanding order. Letters and other records of her work show her attending to practical details across houses while supporting sisters through illness and loss. She died in 1641. Her memory as a founder rests alongside her experience as a mother and widow.",
]
patronage = ["Traditionally associated with mothers and widows"]

[[saints.sources]]
title = "Franciscan Media — Saint Jane Frances de Chantal"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-jane-frances-de-chantal/"

[[saints]]
id = "vincent-de-paul"
name = "Saint Vincent de Paul"
aliases = ["Vincent Depaul", "Monsieur Vincent", "Vincent of Paul"]
years = "1581–1660"
vocation = "Priest and religious founder"
place = "France"
summary = "A French priest who organized parish missions and enduring forms of practical help for people in poverty."
biography = [
  "Vincent grew up in Gascony and was ordained a priest in 1600. His early years took him into households and parishes with differing material resources. Ministry among rural people sharpened his awareness that some communities rarely saw a priest or received sustained religious instruction. He began organizing ways to reach those communities over time.",
  "In 1617, at Châtillon, parishioners responded to Vincent’s appeal for a family in need. He saw that an immediate response could be followed by a period in which no one came. He helped establish a group whose members took turns providing care. The confraternities of charity that grew from such efforts gave continuity to local service.",
  "Vincent founded the Congregation of the Mission to give parish missions and assist with the formation of clergy. He also worked closely with Louise de Marillac. Their Daughters of Charity trained women to minister among people in their homes and communities. The women’s mobility let them respond to needs that would have been hard to reach from an enclosed convent.",
  "Vincent’s work eventually included attention to prisoners, abandoned children, and people displaced by war. He used contacts with wealthy families to obtain support while relying on local people to carry out service. He died in Paris in 1660. The Church recognizes him as a patron of charitable societies.",
]
patronage = ["Patron of charitable societies"]

[[saints.sources]]
title = "Franciscan Media — Saint Vincent de Paul"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-vincent-de-paul/"

[[saints]]
id = "louise-de-marillac"
name = "Saint Louise de Marillac"
aliases = ["Louise of Marillac", "Luisa de Marillac"]
years = "1591–1660"
vocation = "Religious founder"
place = "Paris, France"
summary = "Louise helped found the Daughters of Charity and trained women to care for people in their homes and communities."
biography = [
  "Louise grew up in France and considered entering religious life as a young woman. She married Antoine Le Gras, and they had a son. Louise cared for Antoine during a long illness and was widowed in 1625. Her later responsibilities in charity followed years in which illness and family care were part of her own household.",
  "Louise began working with Vincent de Paul, who asked her to visit and support local confraternities of charity. She saw differences in their resources and in the preparation of people carrying out the work. She helped organize practical ways to provide food, nursing, and instruction, and gave encouragement to the women doing the work.",
  "In 1633 Louise began bringing women together for training in her home. This became the Daughters of Charity, founded with Vincent. Members learned to serve people outside their own houses, going where nursing and teaching were needed. Their service and common prayer were sustained through formation, written instructions, and regular supervision.",
  "Louise guided the Daughters as new communities took on work with poor families, abandoned children, and people in hospitals. Balancing local needs with the way of life of a religious community remained one of her responsibilities. She died in 1660, the same year as Vincent. The Church later named her patron of social workers.",
]
patronage = ["Patron of social workers"]

[[saints.sources]]
title = "Franciscan Media — Saint Louise de Marillac"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-louise-de-marillac/"

[[saints]]
id = "alphonsus-liguori"
name = "Saint Alphonsus Liguori"
aliases = ["Alphonsus Maria de Liguori", "Alfonso Maria de’ Liguori", "Alfonso de Liguori"]
years = "1696–1787"
vocation = "Bishop and Doctor of the Church"
place = "Naples, Italy"
summary = "The founder of the Redemptorists was a prolific writer on moral theology and prayer."
biography = [
  "Alphonsus grew up near Naples and trained in civil and canon law. He practiced as a lawyer before turning toward the priesthood and was ordained in 1726. In Naples he took part in religious formation outside formal parish settings, helping organize meetings for people whose work and circumstances made ordinary instruction difficult to attend.",
  "In 1732 he founded the congregation now known as the Redemptorists. Its early mission was to preach in rural communities with limited access to clergy. Traveling missions included teaching and hearing confessions. Alphonsus drew on experiences in that ministry when thinking about what confessors need to know and how they should respond to people individually.",
  "His books included devotional writing and a major work of moral theology. He considered competing schools of thought about moral responsibility and opposed a severity that could drive people away from the sacraments. His more accessible works helped readers reflect on prayer, the Eucharist, and the life of Christ outside formal theological study.",
  "Alphonsus became bishop of Sant’Agata de’ Goti in 1762 and served there for more than a decade. He later retired because of ill health and died in 1787. The Church recognizes him as a Doctor of the Church and patron of confessors and moral theologians, reflecting the connection between his writings and the work he undertook in parishes.",
]
patronage = ["Patron of confessors and moral theologians"]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Alphonsus Liguori"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2011/documents/hf_ben-xvi_aud_20110330.html"

[[saints]]
id = "john-bosco"
name = "Saint John Bosco"
aliases = ["Don Bosco", "Giovanni Bosco", "Giovanni Melchiorre Bosco"]
years = "1815–1888"
vocation = "Priest, educator, and religious founder"
place = "Turin, Italy"
summary = "The founder of the Salesians built a ministry around the education and care of young people in Turin."
biography = [
  "John was born in 1815 in the countryside near Turin. His father died when John was a child, and his mother, Margaret, raised her children with limited means. After years of study and work, John was ordained priest in 1841. In Turin he met young laborers and boys who had come to the city without stable work or family support.",
  "John began gathering boys for instruction, play, and worship. The meetings eventually found a permanent home at Valdocco, where the work developed into an oratory, workshops, and housing. John sought practical opportunities for boys to learn trades, recognizing that training and reliable work could matter as much to their future as time spent in a classroom.",
  "He described his educational approach as preventive. He asked teachers to stay close to students, give reasons for expectations, and build trust before trouble arose. The approach combined religious instruction with exercise, study, and work. John also used printed material to make religious and educational resources available beyond the schools he supervised.",
  "The religious community that grew around the work became the Salesians of Don Bosco, named for Francis de Sales. John and Mary Mazzarello also supported the foundation of the Salesian sisters for the education of girls. He died in 1888. Both institutes carried his educational work into communities far beyond Turin.",
]
patronage = ["Traditionally associated with young apprentices and Catholic publishers"]

[[saints.sources]]
title = "Franciscan Media — Saint John Bosco"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-john-bosco/"

[[saints]]
id = "mary-mazzarello"
name = "Saint Mary Mazzarello"
aliases = ["Mary Domenica Mazzarello", "Maria Domenica Mazzarello", "Mother Mazzarello"]
years = "1837–1881"
vocation = "Religious founder and educator"
place = "Mornese, Italy"
summary = "Mary helped found the Daughters of Mary Help of Christians, the Salesian sisters."
biography = [
  "Mary Domenica was born in 1837 in Mornese, a village in northern Italy. As a young woman she worked with her family and joined a local group of women who dedicated themselves to prayer and service. Her early experience in farming and village life shaped the practical training that later became part of her educational work.",
  "Mary contracted typhoid while caring for relatives during an epidemic. After recovering, she could no longer do the same heavy work. She learned sewing and, with Petronilla Mazzarello, set up a place where girls could learn a trade and receive religious instruction. Their work grew out of a need they had seen in their own community.",
  "John Bosco was looking for a way to extend to girls the kind of work his Salesian communities carried on with boys. With the support of the local priest, Domenico Pestarino, the women’s group at Mornese became the first community of the Daughters of Mary Help of Christians. Mary and her companions made religious profession in 1872.",
  "Mary became the first superior and guided the sisters through the institute’s early growth, including the opening of houses outside Italy. She supported their formation through visits and letters and continued to emphasize education rooted in relationships and ordinary work. She died in 1881. The institute remembers her as its co-founder alongside John Bosco.",
]

[[saints.sources]]
title = "Daughters of Mary Help of Christians — Saint Mary Domenica Mazzarello"
url = "https://www.cgfmanet.org/en/mary-domenica-mazzarello/"

[[saints]]
id = "bernard-of-clairvaux"
name = "Saint Bernard of Clairvaux"
aliases = ["Bernard de Clairvaux", "Bernard of Fontaine", "Doctor Mellifluus"]
years = "1090–1153"
vocation = "Cistercian abbot and Doctor of the Church"
place = "Clairvaux, France"
summary = "A Cistercian abbot whose preaching and writing helped shape medieval Christian spirituality."
biography = [
  "Bernard was born into a noble family in Burgundy around 1090. He entered Cîteaux, a community seeking closer adherence to the Rule of Saint Benedict. In 1115 he was sent to found Clairvaux, where he served as abbot. The new foundation became an influential center of the growing Cistercian order.",
  "Bernard’s position at Clairvaux did not keep him out of public life. Church leaders sought his advice during disputes, including the contested papal election that followed the death of Honorius II. His preaching helped promote the Second Crusade, which ended in failure. Those episodes belong to the history of a medieval abbot whose influence extended beyond his monastery.",
  "His sermons on the Song of Songs interpret the biblical poem in terms of the love between God and the soul and between Christ and the Church. They show how sustained reading and prayer shaped his teaching of monks. In other works he wrote about humility, the love of God, and how someone entrusted with public responsibilities can retain time for reflection.",
  "Bernard died in 1153. Clairvaux and its daughter houses helped extend Cistercian life across Europe. His writings were read in communities very different from those in which they originated, and the Catholic Church recognizes him as a Doctor of the Church.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Bernard of Clairvaux"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2009/documents/hf_ben-xvi_aud_20091021.html"

[[saints]]
id = "anselm-of-canterbury"
name = "Saint Anselm of Canterbury"
aliases = ["Anselm of Aosta", "Anselm of Bec", "Anselmus Cantuariensis"]
years = "1033–1109"
vocation = "Archbishop and Doctor of the Church"
place = "Bec and Canterbury"
summary = "An archbishop and theologian who described his inquiry as faith seeking understanding."
biography = [
  "Anselm was born at Aosta and traveled to Normandy, where he studied at the monastery of Bec under Lanfranc. He became a monk and eventually served as prior and abbot. Bec provided the setting for many of his early writings. Teaching and religious life there gave him recurring opportunities to test arguments in conversation with other readers.",
  "In the Proslogion, Anselm framed reasoning about God as a prayer in which faith seeks understanding. The work includes an argument about God’s existence that later philosophers examined and disputed. His Why God Became Man addresses the Incarnation and reconciliation between God and humanity through a dialogue with a fellow monk.",
  "Anselm became archbishop of Canterbury in 1093. Disputes with William II and later Henry I concerned the ties between episcopal office and royal authority. Anselm spent periods outside England as a result. Negotiations in the later dispute clarified the distinction between conferring church office and recognizing the obligations of bishops who held lands from the king.",
  "Anselm died in 1109. Catholic tradition recognizes him as a Doctor of the Church. His works continue to interest readers because they show how a medieval theologian used questions and argument within the practice of prayer, while facing the practical demands of governing a church.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Anselm of Canterbury"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2009/documents/hf_ben-xvi_aud_20090923.html"

[[saints]]
id = "hildegard-of-bingen"
name = "Saint Hildegard of Bingen"
aliases = ["Hildegard von Bingen", "Hildegard of Rupertsberg", "Sibyl of the Rhine"]
years = "1098–1179"
vocation = "Abbess and Doctor of the Church"
place = "Bingen, Germany"
summary = "A Benedictine abbess whose visions, music, and writings became part of the Christian heritage of the Rhineland."
biography = [
  "Hildegard was born in the Rhineland in 1098. As a girl she entered religious formation at Disibodenberg under Jutta of Sponheim. After Jutta’s death, Hildegard came to lead the women living there. She later established a monastery at Rupertsberg near Bingen and another house across the Rhine at Eibingen.",
  "Hildegard began recording visions she understood as a call to write about God and creation. The first of her major visionary books, Scivias, combines accounts of the visions with explanations of their meaning. Her community supported her work, and she exchanged letters with leaders who could help it reach readers outside the monastery.",
  "Music was another part of Hildegard’s work. Her songs gave words and melodies to worship in her community. She also wrote a musical drama in which personified virtues struggle over the life of a soul. Her letters and other writings show an interest in how bodily life, relationships, and the created world belong within Christian reflection.",
  "Hildegard died in 1179. Her work continued to be preserved in manuscripts from the community and elsewhere. In 2012 Benedict XVI proclaimed her a Doctor of the Church. Her surviving music, writings, and letters document the variety of work undertaken by an abbess in the intellectual and religious life of the medieval Rhineland.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Hildegard of Bingen"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20100901.html"

[[saints.sources]]
title = "Benedict XVI — Apostolic letter proclaiming Saint Hildegard a Doctor of the Church"
url = "https://www.vatican.va/content/benedict-xvi/en/apost_letters/documents/hf_ben-xvi_apl_20121007_ildegarda-bingen.html"

[[saints]]
id = "bede-the-venerable"
name = "Saint Bede the Venerable"
aliases = ["Venerable Bede", "Beda Venerabilis", "Saint Bede"]
years = "c. 673–735"
vocation = "Benedictine monk and Doctor of the Church"
place = "Wearmouth–Jarrow, England"
summary = "A Northumbrian monk whose Ecclesiastical History records the early development of Christianity in England."
biography = [
  "Bede entered the Northumbrian monastic community of Wearmouth and Jarrow at about seven and spent the rest of his life there. The community had a substantial library and contacts beyond Northumbria. Bede became a priest and used the materials available to him to teach, interpret Scripture, and learn how earlier writers had calculated time.",
  "His Ecclesiastical History of the English People follows Christianity in Britain from Roman times to his own day. Bede collected letters and reports, sometimes asking other churches directly for information. His interests shaped the selection of events, but his account preserves details about monasteries, bishops, rulers, and missions that would otherwise be difficult to recover.",
  "Bede also wrote about reckoning time, a practical subject for churches that needed to agree when to celebrate Easter. His work on chronology connected the motions of the sun and moon, calendar practice, and the counting of years. He used a shared year-numbering system in his history, helping readers place events from different kingdoms on the same timeline.",
  "Bede died at Jarrow in 735. An account from his community describes him continuing to work with students near the end of his life. He came to be called Venerable and was later declared a Doctor of the Church. His historical and biblical works reflect the teaching and study that filled his years in one monastery.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Bede the Venerable"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2009/documents/hf_ben-xvi_aud_20090218.html"

[[saints]]
id = "john-henry-newman"
name = "Saint John Henry Newman"
aliases = ["Cardinal Newman", "John Henry Cardinal Newman", "J. H. Newman"]
years = "1801–1890"
vocation = "Oratorian priest and Doctor of the Church"
place = "Oxford and Birmingham, England"
summary = "A theologian and writer whose journey from Anglican ministry to Catholicism shaped his work on education, conscience, and faith."
biography = [
  "John Henry Newman was born in London in 1801 and studied at Oxford. He became an Anglican priest and served as vicar of the university church of Saint Mary the Virgin. His sermons there and his work with others in the Oxford Movement asked what ancient Christian doctrine and worship meant for the Church of England.",
  "Newman’s study of the early Church raised questions about the continuity of doctrine and the authority of churches. He withdrew to Littlemore and worked on the Essay on the Development of Christian Doctrine. In 1845 he was received into the Catholic Church. The change cost him longstanding relationships and altered the setting in which he taught and wrote.",
  "After his ordination as a Catholic priest, Newman brought the Oratory of Saint Philip Neri to England and established a community in Birmingham. He also helped establish a Catholic university in Ireland. Lectures from that work became The Idea of a University, a sustained reflection on how different kinds of knowledge belong in education.",
  "Newman later explained his conversion in the Apologia Pro Vita Sua and considered how people reach convictions in his Grammar of Assent. He became a cardinal in 1879 and died in 1890. Francis canonized him in 2019. In 2025 Leo XIV proclaimed him a Doctor of the Church and named him a co-patron of the Church’s educational mission.",
]
patronage = ["Patron of the Church’s educational mission, jointly with Saint Thomas Aquinas"]

[[saints.sources]]
title = "Francis — Homily at the canonization of Saint John Henry Newman"
url = "https://www.vatican.va/content/francesco/en/homilies/2019/documents/papa-francesco_20191013_omelia-canonizzazione.html"

[[saints.sources]]
title = "Benedict XVI — Homily at the beatification of John Henry Newman"
url = "https://www.vatican.va/content/benedict-xvi/en/homilies/2010/documents/hf_ben-xvi_hom_20100919_beatif-newman.html"

[[saints.sources]]
title = "Leo XIV — Homily proclaiming Saint John Henry Newman a Doctor of the Church"
url = "https://www.vatican.va/content/leo-xiv/en/homilies/2025/documents/20251101-messa-giubileo-formatori.html"

[[saints]]
id = "john-of-avila"
name = "Saint John of Ávila"
aliases = ["Juan de Ávila", "Juan de Avila", "Apostle of Andalusia"]
years = "c. 1499–1569"
vocation = "Priest and Doctor of the Church"
place = "Andalusia, Spain"
summary = "A Spanish preacher and spiritual adviser whose work included education and the formation of priests."
biography = [
  "John was born in Almodóvar del Campo and studied first at Salamanca and then at Alcalá. After his ordination he intended to minister in the Americas. His preparation and preaching drew attention in Seville, where the archbishop persuaded him to remain. Andalusia became the main setting of his priesthood.",
  "John traveled as a preacher and gave spiritual guidance to laypeople and clergy. His teaching drew on Scripture and invited readers to consider how faith shapes their relationships and decisions. He was investigated and imprisoned by the Inquisition for a time, then cleared. He continued to preach and write after his release.",
  "He helped establish schools and took part in founding the university at Baeza. The formation of priests mattered to him because it determined the teaching and care people would receive in their parishes. John wrote proposals connected with reform and used his extensive correspondence to advise people considering religious or public responsibilities.",
  "His book Audi, filia takes its title from a psalm and offers guidance on prayer and attentive Christian life. John died in Montilla in 1569. Pius XII named him patron of diocesan clergy in Spain, and Benedict XVI declared him a Doctor of the Church in 2012. He is also known as the Apostle of Andalusia.",
]
patronage = ["Patron of diocesan clergy in Spain"]

[[saints.sources]]
title = "Benedict XVI — Apostolic letter on Saint John of Ávila"
url = "https://www.vatican.va/content/benedict-xvi/en/apost_letters/documents/hf_ben-xvi_apl_20121007_giovanni-avila.html"

[[saints]]
id = "peter-damian"
name = "Saint Peter Damian"
aliases = ["Pier Damiani", "Pietro Damiani", "Peter Damiani"]
years = "1007–1072"
vocation = "Cardinal bishop and Doctor of the Church"
place = "Fonte Avellana and Ostia, Italy"
summary = "A monk and reformer who brought the discipline of hermit life into his work as a Church leader."
biography = [
  "Peter was born at Ravenna in 1007 and received an education with help from an older brother, Damian. He taught before entering the community at Fonte Avellana, where hermits led a life with substantial time for solitude and a common discipline. Peter later became prior and took responsibility for other communities influenced by its practice.",
  "Peter wrote about the relationship between solitary prayer and the shared worship of the Church. His letters also addressed public questions, especially the buying and selling of church offices and abuses among clergy. The demands he placed on himself and on his readers reflect the urgency with which he regarded reform.",
  "In 1057 Pope Stephen IX made Peter cardinal bishop of Ostia. That office led to assignments outside the monastery. He acted on behalf of popes in disputes and helped negotiate settlements, including matters involving the city of Milan. He repeatedly sought to return to the life of prayer he had left at Fonte Avellana.",
  "Peter died in 1072 while returning from a mission to Ravenna. His writings include letters, sermons, and accounts of religious life. The Church recognizes him as a Doctor of the Church. His surviving work shows how an eleventh-century hermit understood his responsibilities to communities and institutions far beyond his place of prayer.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Peter Damian"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2009/documents/hf_ben-xvi_aud_20090909.html"

[[saints]]
id = "irenaeus-of-lyons"
name = "Saint Irenaeus of Lyons"
aliases = ["Irenaeus of Lyon", "Irénée de Lyon", "Doctor of Unity", "Doctor Unitatis"]
years = "c. 140–c. 202"
vocation = "Bishop and Doctor of the Church"
place = "Smyrna and Lyons"
summary = "A bishop of Lyons who defended the Christian faith and explained how its teaching was handed down through the churches."
biography = [
  "Irenaeus grew up in Asia Minor, where he heard Polycarp of Smyrna teach. He remembered Polycarp’s connection with earlier Christian witnesses. Irenaeus later lived in Gaul and served as a priest at Lyons. After persecution there in 177, he succeeded Pothinus as bishop of a Christian community with ties to the eastern Mediterranean.",
  "In Against Heresies, Irenaeus examined a range of claims to secret religious knowledge. He set them alongside the faith that churches publicly confessed and taught. He appealed to the continuity of teaching in communities founded by the apostles and to the coherence of Scripture read as a whole. His account is a principal source for several early Christian disputes.",
  "For Irenaeus the story told in Scripture reaches from creation to Christ. He explained salvation as Christ taking up and restoring the course of human life, a theme often called recapitulation. His Demonstration of the Apostolic Preaching offers a shorter account of this historical unity for readers learning the faith.",
  "Irenaeus also urged patience when churches disagreed over the date of Easter. The details of his death are uncertain, though Christian tradition honors him as a martyr. In 2022 Francis proclaimed him a Doctor of the Church under the title Doctor of Unity, recognizing his connection with both Eastern and Western Christianity.",
]

[[saints.sources]]
title = "Irenaeus of Lyons — Against Heresies, book III"
url = "https://www.newadvent.org/fathers/0103.htm"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Irenaeus of Lyons"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070328.html"

[[saints.sources]]
title = "Francis — Decree proclaiming Saint Irenaeus a Doctor of the Church"
url = "https://press.vatican.va/content/salastampa/en/bollettino/pubblico/2022/01/21/220121b.html"

[[saints]]
id = "justin-martyr"
name = "Saint Justin Martyr"
aliases = ["Justin the Philosopher", "Justin of Neapolis", "Saint Justin"]
years = "c. 100–c. 165"
vocation = "Philosopher and martyr"
place = "Flavia Neapolis and Rome"
summary = "An early Christian philosopher whose writings describe Christian worship and defend the faith before Roman readers."
biography = [
  "Justin was born at Flavia Neapolis, near present-day Nablus, around the beginning of the second century. In the opening of his Dialogue with Trypho, he describes searching among schools of philosophy before a conversation prompted him to read the prophets. He came to regard Christianity as the answer to questions he had pursued through philosophical study.",
  "Justin taught in Rome. His First Apology, addressed to the emperor and other Roman authorities, asks them to judge Christians by their conduct and the reasons for their beliefs. He responds to accusations against Christian communities and describes how he understands the relationship between faith in Christ and the truth sought by philosophers.",
  "The apology is an early witness to Christian worship. Justin explains baptism and describes a Sunday assembly with readings, instruction, common prayer, and the Eucharist. He also describes contributions for people in need. These passages show what a public defense of Christianity could tell its Roman readers about the ordinary life of a local congregation.",
  "Justin was arrested and executed at Rome about 165 with a group of companions. An early record of their trial preserves the outline of their questioning. He came to be known as Justin Martyr. His surviving works are read for the evidence they provide about early Christian argument, worship, and life in Roman cities.",
]

[[saints.sources]]
title = "Justin Martyr — First Apology"
url = "https://www.newadvent.org/fathers/0126.htm"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Justin Martyr"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070321.html"

[[saints]]
id = "athanasius-of-alexandria"
name = "Saint Athanasius of Alexandria"
aliases = ["Athanasius the Great", "Athanasius of Alexandria", "Athanasius the Apostolic"]
years = "c. 295–373"
vocation = "Bishop and Doctor of the Church"
place = "Alexandria, Egypt"
summary = "A bishop who defended the teaching of the Council of Nicaea on the divinity of Christ."
biography = [
  "Athanasius grew up in Alexandria and served as a deacon to Bishop Alexander. He accompanied Alexander to the Council of Nicaea in 325. The council affirmed that the Son shares the same divine being as the Father. Athanasius succeeded Alexander as bishop of Alexandria several years later.",
  "Debates about the wording and authority of Nicaea continued throughout Athanasius’s episcopate. Imperial decisions and conflicts among bishops forced him into exile repeatedly. He spent periods outside Egypt and time among Egyptian monks. Letters and treatises allowed him to continue writing about the questions at stake even when he could not serve in Alexandria.",
  "Athanasius’s writing On the Incarnation connects the identity of Christ with what Christians believe Christ accomplishes. He argued that salvation depends on God truly entering human life. His theological works thus address both the words used to confess Christ and the relation of that confession to worship and Christian hope.",
  "His Life of Antony presents the example of the Egyptian desert monk Antony. The book helped readers far beyond Egypt learn about the spiritual practices of the desert. Athanasius died in 373 after returning to Alexandria. Eastern and Western churches honor his contribution to Christian teaching, and the Catholic Church recognizes him as a Doctor of the Church.",
]

[[saints.sources]]
title = "Athanasius of Alexandria — Life of Antony"
url = "https://www.newadvent.org/fathers/2811.htm"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Athanasius of Alexandria"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070620.html"

[[saints]]
id = "john-chrysostom"
name = "Saint John Chrysostom"
aliases = ["John of Antioch", "John of Constantinople", "Golden-Mouthed John"]
years = "c. 349–407"
vocation = "Bishop and Doctor of the Church"
place = "Antioch and Constantinople"
summary = "A preacher known for explaining Scripture and challenging his listeners to care for the poor."
biography = [
  "John was born at Antioch and trained in rhetoric before committing himself to a life of study and prayer. He spent time in ascetic communities and later served as a deacon and priest in Antioch. His ability to explain Scripture in public preaching earned him the name Chrysostom, meaning golden-mouthed.",
  "His sermons often move from close reading of a biblical passage to the decisions people make at home or in the city. He urged wealthy hearers to attend to people who lacked food and shelter. His preaching also dealt with family life, prayer, and worship. Many of these sermons survived and became sources for the study of late ancient Christianity.",
  "John was appointed bishop of Constantinople in 397. He promoted greater simplicity in the episcopal household and called for changes in the conduct of clergy. Conflicts with other bishops and the imperial court led to his removal and exile. Although he returned briefly, he was exiled again and died in 407 while being moved farther from the capital.",
  "Eastern Christians know his name through the Divine Liturgy that bears it, as well as through his writings. The Catholic Church honors him as a Doctor of the Church. The connection between preaching and practical care for the poor remains visible across his work.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint John Chrysostom, part two"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070926.html"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint John Chrysostom"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070919.html"

[[saints]]
id = "cyril-of-alexandria"
name = "Saint Cyril of Alexandria"
aliases = ["Cyril the Alexandrian", "Cyril of Alexandria"]
years = "c. 370–444"
vocation = "Bishop and Doctor of the Church"
place = "Alexandria, Egypt"
summary = "A bishop of Alexandria whose teaching about Christ was central to the Council of Ephesus."
biography = [
  "Cyril became bishop of Alexandria in 412, succeeding his uncle Theophilus. Alexandria was a major center of Christian biblical scholarship and ecclesiastical authority. Cyril’s surviving commentaries, letters, and theological works show how questions about the interpretation of Scripture entered his day-to-day work of teaching and governing the church.",
  "His best-known dispute concerned Nestorius, bishop of Constantinople. They differed over the language used to describe the relationship between Christ’s divinity and humanity. Cyril argued that the subject of Christ’s human life was the eternal Word who had taken flesh. On that basis he defended calling Mary Theotokos, a Greek title commonly translated as Mother of God.",
  "The Council of Ephesus in 431 upheld Cyril’s position and deposed Nestorius. The council itself was marked by procedural disputes and divisions among bishops. Afterward, Cyril and John of Antioch came to agreement on a formula in 433 whose language gave both Christ’s humanity and divinity an explicit place.",
  "Cyril died in 444. The Catholic Church honors him as a Doctor of the Church, and his writings are also important to Eastern Christian traditions. His treatment of Mary’s title is best understood within the wider argument about who Christ is and how Christian language can speak about his life.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Cyril of Alexandria"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20071003.html"

[[saints]]
id = "cyril-of-jerusalem"
name = "Saint Cyril of Jerusalem"
aliases = ["Cyril of Jerusalem", "Cyrillus Hierosolymitanus"]
years = "c. 315–386"
vocation = "Bishop and Doctor of the Church"
place = "Jerusalem"
summary = "A bishop whose catechetical lectures show how the Church of Jerusalem prepared people for baptism."
biography = [
  "Cyril was born around the beginning of the fourth century and became bishop of Jerusalem around 350. The city had recently acquired major churches and was drawing pilgrims to places associated with the life of Jesus. Cyril’s teaching connected those places with the preparation of new Christians for baptism.",
  "His Catechetical Lectures address candidates preparing to join the Church. He explains the creed, discusses passages from Scripture, and asks listeners to examine how they live. The lessons take for granted a process that unfolded over a period of time, with public worship and personal preparation reinforcing what candidates heard in instruction.",
  "A further set of lectures transmitted with his work explains rites to people who had just received them. Their practice of interpreting the sacraments after initiation gives these lectures the name mystagogical. The sequence offers an unusually detailed view of the religious education and worship of a fourth-century church.",
  "Cyril’s episcopal ministry was interrupted by disputes and periods of exile. He later participated in the Council of Constantinople in 381. He died around 386. The Catholic Church honors him as a Doctor of the Church, and his lectures continue to be consulted for their record of how Jerusalem taught and welcomed new members.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Cyril of Jerusalem"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070627.html"

[[saints]]
id = "ephrem-the-syrian"
name = "Saint Ephrem the Syrian"
aliases = ["Ephrem of Nisibis", "Ephraem Syrus", "Ephraim the Syrian", "Harp of the Holy Spirit"]
years = "c. 306–373"
vocation = "Deacon and Doctor of the Church"
place = "Nisibis and Edessa"
summary = "A deacon who taught Christian theology in Syriac through poetry and hymns."
biography = [
  "Ephrem grew up in Nisibis, a city near the border between the Roman and Persian empires. He served as a deacon and came to be known for his teaching. When Nisibis was ceded to Persia in 363, he left with other Christians and spent the final part of his life at Edessa.",
  "Ephrem wrote in Syriac, using poetry to teach through images and patterns that listeners could remember. Some of his hymns were composed for use in communal worship. Their topics include the birth and death of Christ, the meaning of baptism, and the ways created things can direct attention to God. He also wrote prose commentaries on Scripture.",
  "Ephrem’s poems frequently place several biblical events beside one another, asking the listener to notice a shared image or action. Images such as light, water, and the garden can take on meaning from different parts of Scripture. Music and repetition gave those connections a place in prayer even for people without access to books.",
  "Ephrem died in 373. His reputation for writing and singing theology earned him the title Harp of the Holy Spirit. He is honored as a Doctor of the Church. The continued use of his hymns and the survival of Syriac manuscripts preserve evidence of the intellectual and liturgical life of Christians in the region.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Ephrem the Syrian"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20071128.html"

[[saints]]
id = "gregory-of-narek"
name = "Saint Gregory of Narek"
aliases = ["Grigor Narekatsi", "Gregory Narekatsi", "Grigor of Narek"]
years = "c. 950–c. 1003"
vocation = "Monk and Doctor of the Church"
place = "Narek, historic Armenia"
summary = "An Armenian monk whose Book of Lamentations gives voice to repentance, sorrow, and hope in God."
biography = [
  "Gregory lived in the Armenian monastic community of Narek around the turn of the first millennium. The monastery was a center of learning and prayer near Lake Van. He became a monk and priest there, working in an Armenian literary culture with a long tradition of translating Scripture, composing hymns, and interpreting sacred texts.",
  "His best-known work, the Book of Lamentations, is a collection of prayers addressed to God. The speaker examines failings, gives voice to suffering, and seeks mercy. The book ranges beyond one individual’s experience. Gregory writes as though bringing the needs of many people into his own prayer, an approach Pope Francis later emphasized.",
  "Gregory also composed hymns and devotional works and wrote commentary on the Song of Songs. The tension between an awareness of weakness and confidence in divine mercy recurs in his writing. His work remained important in Armenian religious life through generations of readers and in communities far from the monastery in which he wrote.",
  "Gregory is honored in the Armenian Apostolic tradition and by Armenian Catholics. In 2015 Francis proclaimed him a Doctor of the Church, recognizing the importance of this Armenian witness for the wider Catholic Church. His work remains closely associated with intercessory prayer and with the Armenian language in which he composed it.",
]

[[saints.sources]]
title = "Francis — Message on the proclamation of Saint Gregory of Narek as a Doctor of the Church"
url = "https://www.vatican.va/content/francesco/en/messages/pont-messages/2015/documents/papa-francesco_20150412_messaggio-armeni.html"

[[saints.sources]]
title = "Francis — General audience on Saint Gregory of Narek"
url = "https://www.vatican.va/content/francesco/en/audiences/2023/documents/20230426-udienza-generale.html"

[[saints]]
id = "isidore-of-seville"
name = "Saint Isidore of Seville"
aliases = ["Isidoro de Sevilla", "Isidorus Hispalensis"]
years = "c. 560–636"
vocation = "Bishop and Doctor of the Church"
place = "Seville, Spain"
summary = "The bishop of Seville assembled a survey of inherited learning in his Etymologies."
biography = [
  "Isidore grew up in a family prominent in the Church in Visigothic Spain. His older brother Leander served as bishop of Seville and took part in the religious changes that brought Visigothic rulers into Catholic communion. Isidore succeeded him as bishop around the beginning of the seventh century.",
  "As bishop, Isidore supported the education of clergy and took part in councils that brought bishops together from different parts of Spain. He sought to transmit learning inherited from classical writers and earlier Christian authors. His own work covered religious instruction, the interpretation of Scripture, and the history of political communities.",
  "The Etymologies, his best-known work, organizes information by subject, often beginning with the origins or meanings he assigned to words. Its topics range from grammar and medicine to animals and tools. Isidore’s explanations reflect the sources and ideas available to him. For medieval readers, the work made a great deal of inherited learning accessible in one place.",
  "Isidore also wrote works on Christian teaching and accounts of the peoples who ruled in Spain. He died in 636. The Catholic Church recognizes him as a Doctor of the Church, and his surviving works show how a bishop in the early Middle Ages could use scholarship as part of his pastoral responsibilities.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Isidore of Seville"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2008/documents/hf_ben-xvi_aud_20080618.html"

[[saints]]
id = "peter-canisius"
name = "Saint Peter Canisius"
aliases = ["Petrus Canisius", "Peter Kanis", "Pieter Kanis"]
years = "1521–1597"
vocation = "Jesuit priest and Doctor of the Church"
place = "Nijmegen and Central Europe"
summary = "A Jesuit teacher whose catechisms explained Catholic faith during the Reformation."
biography = [
  "Peter was born at Nijmegen in 1521 and studied at Cologne. An encounter with the Jesuit Peter Faber led him to undertake the Spiritual Exercises and join the young Society of Jesus. His education, preaching, and early work in church meetings prepared him for assignments during the religious changes of the sixteenth century.",
  "Peter taught and preached in cities across Central Europe. He helped establish schools and colleges and took part in efforts to prepare clergy. These assignments often took place in communities where the Reformation had altered institutions and religious loyalties. His work combined public explanation of Catholic teaching with the long process of educating people to continue it.",
  "His catechisms presented Christian doctrine in a question-and-answer format. Peter prepared versions for readers with different levels of education. The shorter works provided a way to teach essential points in parishes and schools, while the longer version could be used for deeper study. The texts circulated in successive editions and translations.",
  "Peter spent his later years in Fribourg, Switzerland, where he continued writing and supporting educational work. He died in 1597. The Catholic Church honors him as a Doctor of the Church. His name remains associated with the use of accessible, structured teaching during a period of intense religious disagreement.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Peter Canisius"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2011/documents/hf_ben-xvi_aud_20110209.html"

[[saints]]
id = "robert-bellarmine"
name = "Saint Robert Bellarmine"
aliases = ["Roberto Bellarmino", "Robert Bellarmino", "Roberto Francesco Romolo Bellarmino"]
years = "1542–1621"
vocation = "Jesuit cardinal and Doctor of the Church"
place = "Montepulciano and Rome, Italy"
summary = "A Jesuit theologian and cardinal who explained Catholic teaching in an age of religious controversy."
biography = [
  "Robert was born into a family at Montepulciano in 1542 and entered the Society of Jesus as a young man. He studied and taught in several places, including Louvain. He later taught at the Roman College, where students had to learn both Catholic theology and the claims being made by writers of the Reformation.",
  "His lectures became the Controversies, a large work organized around major disputes about Scripture, authority, the sacraments, and church life. It sought to set out the questions systematically before defending Catholic positions. Its scale reflected the need to address a range of arguments circulating in books and public debates across Europe.",
  "Robert also wrote catechisms for readers who did not need a university-level account of those controversies. His public work extended beyond writing. After his appointment as cardinal he served in Roman offices and spent several years as archbishop of Capua, where he preached and visited communities in his diocese.",
  "Robert returned to Rome and continued to take on assignments as a theologian and adviser. In his later years he wrote about prayer and preparation for death. He died in 1621. The Catholic Church recognizes him as a Doctor of the Church. His surviving books reflect the very different audiences a theologian of his period needed to address.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Robert Bellarmine"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2011/documents/hf_ben-xvi_aud_20110223.html"

[[saints]]
id = "lawrence-of-brindisi"
name = "Saint Lawrence of Brindisi"
aliases = ["Lorenzo da Brindisi", "Laurence of Brindisi", "Giulio Cesare Russo"]
years = "1559–1619"
vocation = "Capuchin priest and Doctor of the Church"
place = "Brindisi and Central Europe"
summary = "A Capuchin preacher who drew on his knowledge of languages and Scripture in his ministry."
biography = [
  "Lawrence was born at Brindisi in 1559 and joined the Capuchins. He studied languages and theology before undertaking public preaching. His knowledge of Scripture and languages, including Hebrew, was a notable part of his formation and helped equip him for work among people who spoke and worshiped in different settings.",
  "Lawrence preached in Italy and traveled widely in Central Europe. He helped establish Capuchin communities in places where the order was new. These assignments put him in contact with people affected by the religious divisions of the Reformation and with civil and church leaders who sought his help in public affairs.",
  "He served as minister general of the Capuchins and acted on several diplomatic assignments. Near the end of his life he carried concerns from Naples to the Spanish court and died in Lisbon in 1619. The range of his travels reflected the responsibilities that religious superiors and rulers were prepared to entrust to a preacher of his experience.",
  "His surviving sermons and writings show the weight he gave to reading and explaining Scripture. John XXIII proclaimed him a Doctor of the Church in 1959. Capuchins remember him for bringing his study to preaching and for sustaining communities of friars across the regions where he worked.",
]

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Lawrence of Brindisi"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2011/documents/hf_ben-xvi_aud_20110323.html"

[[saints]]
id = "albert-chmielowski"
name = "Saint Albert Chmielowski"
aliases = ["Adam Chmielowski", "Brother Albert", "Brat Albert", "Adam Hilary Bernard Chmielowski"]
years = "1845–1916"
vocation = "Religious brother and founder"
place = "Kraków, Poland"
summary = "A Polish painter who became Brother Albert and established communities serving people without shelter."
biography = [
  "Born Adam Chmielowski in 1845 near Kraków, Albert grew up during the partition of Poland. He took part in the Polish uprising of 1863 and lost a leg after being wounded. He later studied art and developed a career as a painter. Art remained a way for him to reflect on suffering and faith.",
  "In Kraków he encountered people sleeping in public shelters and began to take responsibility for their care. He adopted the life of a Franciscan tertiary and became known as Brother Albert. He shared the daily conditions of people using the shelters and helped arrange assistance that could continue beyond the first days of need.",
  "Other men and women joined in the work. The communities that developed became known as the Brothers and Sisters of the Third Order of Saint Francis, Servants of the Poor. Their ministry included food, shelter, and companionship for people who had been excluded from more stable forms of support. Albert’s painting Ecce Homo is often remembered alongside this work.",
  "Albert died in Kraków in 1916. John Paul II canonized him in 1989. He had earlier explored the painter’s life in a play written before becoming pope. Albert’s story preserves a particular connection between his earlier vocation as an artist and the care for people that occupied his final decades.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Albert Chmielowski"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-albert-chmielowski/"
