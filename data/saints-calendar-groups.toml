[[saints]]
id = "seven-holy-founders-of-the-servite-order"
name = "Seven Holy Founders of the Servite Order"
aliases = ["Seven Founders of the Servite Order","Servite founders","Seven Founders of the Servants of Mary"]
years = "Thirteenth century"
vocation = "Religious founders"
place = "Florence and Monte Senario, Italy"
summary = "Seven men from Florence whose shared life of prayer and devotion to Mary gave rise to the Servite Order."
biography = [
  "In the Servite founding tradition, Bonfilius Monaldi, Bonajunta Manetti, Manettus dell’Antella, Amidius Amidei, Hugo Uguccioni, Sosthenes Sostegni, and Alexis Falconieri left their work in Florence for a shared life of prayer. The community they formed at Monte Senario became known as the Servants of Mary.",
  "The community adopted the Rule of Saint Augustine. The order that grew from their settlement combined prayer and common life with preaching and ministry outside the convent.",
]

[[saints.sources]]
title = "Franciscan Media — Seven Founders of the Servite Order"
url = "https://www.franciscanmedia.org/saint-of-the-day/seven-founders-of-the-servite-order/"

