[[saints]]
id = "seven-holy-founders-of-the-servite-order"
name = "Seven Holy Founders of the Servite Order"
aliases = ["Seven Founders of the Servite Order","Servite founders","Seven Founders of the Servants of Mary"]
years = "Thirteenth century"
vocation = "Religious founders"
place = "Florence and Monte Senario, Italy"
summary = "Seven men from Florence whose shared life of prayer and devotion to Mary gave rise to the Servite Order."
biography = [
  "The Servite founding tradition remembers seven men involved in the religious life of thirteenth-century Florence. Their names are Bonfilius Monaldi, Bonajunta Manetti, Manettus dell’Antella, Amidius Amidei, Hugo Uguccioni, Sosthenes Sostegni, and Alexis Falconieri. The accounts associate them with a lay confraternity devoted to Mary and date the beginning of their common life to 1233.",
  "The founders withdrew from the city and established themselves at Monte Senario, where they built a small church and lived in community. They adopted the Rule of Saint Augustine and came to be called Servants of Mary. A later tradition connects their black habit with an apparition of Mary, an account that expresses how the order understood its vocation.",
  "Life at Monte Senario combined prayer, simplicity, and communal discipline. The community also developed ways of serving people in the surrounding towns. Bonfilius is remembered as an early leader, while Alexis is remembered as a lay brother who lived into the next century. Their different roles reflect the character of the foundation as a group.",
  "The Servite Order continued beyond the first community and spread to other places. Devotion to Mary, particularly reflection on her grief in the life and death of Jesus, became a distinctive part of its spiritual life. Leo XIII canonized the seven together in 1888. The order preserves their shared memory at Monte Senario.",
]

[[saints.sources]]
title = "Franciscan Media — Seven Founders of the Servite Order"
url = "https://www.franciscanmedia.org/saint-of-the-day/seven-founders-of-the-servite-order/"

[[saints.sources]]
title = "Vatican City State — Seven Holy Founders of the Order of the Servants of Mary"
url = "https://vaticanstate.va/en/component/content/article/17-february-seven-holy-founders-of-the-order-of-the-servants-of-mary.html?catid=51&Itemid=216"

[[saints]]
id = "first-martyrs-of-the-church-of-rome"
name = "First Martyrs of the Church of Rome"
aliases = ["First Martyrs of the Holy Roman Church","Martyrs of Rome under Nero","Roman protomartyrs"]
years = "Mid-first century"
vocation = "Martyrs"
place = "Rome, Italy"
summary = "Christians killed in Rome under Nero after the great fire of 64."
biography = [
  "A major fire swept through Rome in July 64, during the reign of Nero. Christians already lived in the city. Paul’s Letter to the Romans, written before his own visit, addresses a community that included people from Jewish and Gentile backgrounds. The disaster exposed members of this relatively small community to punishment by the imperial authorities.",
  "Tacitus, a Roman historian writing decades later, says that Nero accused Christians as rumors circulated about the emperor’s own responsibility. He describes arrests and deaths and notes that the severity of the punishment aroused sympathy among spectators. Tacitus was hostile to Christianity and is a witness from outside the church. The source of the fire remains uncertain.",
  "The names of those killed are largely unknown. Early Christian tradition places the deaths of Peter and Paul in Rome under Nero. The precise relationship between their deaths and the episode described by Tacitus remains uncertain. Roman Christians continued to face legal and social pressures in later periods, which produced other groups of martyrs.",
  "The Roman calendar commemorates these martyrs on June 30, after the solemnity of Peter and Paul on June 29. The shared memorial honors members of the early Roman church whose lives were not recorded individually. It also keeps the persecution witnessed by Tacitus distinct from later events in the same city.",
]

[[saints.sources]]
title = "Tacitus — Annals, book 15, chapter 44 (LacusCurtius)"
url = "https://penelope.uchicago.edu/thayer/e/roman/texts/tacitus/annals/15b*.html"

[[saints.sources]]
title = "Franciscan Media — First Martyrs of the Church of Rome"
url = "https://www.franciscanmedia.org/saint-of-the-day/first-martyrs-of-the-church-of-rome/"

[[saints]]
id = "holy-innocents"
name = "Holy Innocents"
aliases = ["Holy Innocents, Martyrs","Children of Bethlehem","Martyrs of Bethlehem"]
years = "Infancy of Jesus, in Matthew’s Gospel"
vocation = "Martyrs in the Gospel account"
place = "Bethlehem"
summary = "The children killed on Herod’s orders in Matthew’s account of the infancy of Jesus."
biography = [
  "The account of the Holy Innocents comes from the second chapter of Matthew. Travelers from the East arrive seeking a newborn king, prompting Herod to inquire about the child. After the travelers honor Jesus, they return home by another route. Joseph receives a warning in a dream and takes Mary and Jesus to Egypt.",
  "Matthew says that Herod realized the visitors had gone home by another route and ordered the deaths of boys two years old and younger in Bethlehem and its vicinity. The evangelist identifies the children only by age and place. Matthew is the sole New Testament source for the episode, and independent contemporary evidence for its details remains elusive.",
  "Matthew presents the episode through the language of Israel’s Scriptures. He recalls Jeremiah’s image of Rachel mourning her children, speaking in the Gospel for the grief of the families. The journey to Egypt and return after Herod’s death also connect the story of Jesus’s infancy with Israel’s experience of exile and deliverance.",
  "The Catholic Church honors the children together on December 28 during the Christmas octave. They are called martyrs because, in Matthew’s account, they died as a consequence of Herod’s effort to kill Jesus. Their commemoration makes space for the suffering of children and families within the liturgical celebration of Christ’s birth.",
]

[[saints.sources]]
title = "USCCB — Gospel according to Matthew, chapter 2"
url = "https://bible.usccb.org/bible/matthew/2"

[[saints.sources]]
title = "Franciscan Media — Holy Innocents"
url = "https://www.franciscanmedia.org/saint-of-the-day/holy-innocents/"

[[saints]]
id = "paul-miki-and-companions"
name = "Saint Paul Miki and Companions"
aliases = ["Twenty-Six Martyrs of Japan","26 Martyrs of Japan","Martyrs of Nagasaki of 1597"]
years = "Died 1597"
vocation = "Martyrs"
place = "Nagasaki, Japan"
summary = "Twenty-six Christians executed at Nagasaki in 1597, including the Jesuit Paul Miki."
biography = [
  "Christian missions had been active in Japan for several decades when Toyotomi Hideyoshi ordered arrests in the 1590s. The prisoners came from different parts of the Christian community. Some were missionaries from abroad, some were Japanese religious, and others were local lay Catholics who had learned and practiced the faith in Japan.",
  "Among them were the Japanese Jesuit Paul Miki and the Franciscans associated with Pedro Bautista. Three boys were among the twenty-six. The authorities took the prisoners to Nagasaki and executed them there on February 5, 1597. The site, Nishizaka, later became a place where their memory was preserved.",
  "Accounts from the mission describe the prisoners praying and speaking about their faith. Paul Miki said he was Japanese, identified his teaching of Christianity as the reason for his sentence, and spoke of forgiveness. His words are transmitted through accounts of the execution, which also record the courage of fellow prisoners who were less well known.",
  "The group was beatified in 1627 and canonized in 1862. Catholics celebrate the twenty-six together on February 6. Later groups of Christian martyrs also died at Nagasaki, including those remembered with Lorenzo Ruiz. The names and dates distinguish separate persecutions in the history of Japanese Christianity.",
]

[[saints.sources]]
title = "Catholic Culture — Twenty-Six Crosses on a Hill"
url = "https://www.catholicculture.org/culture/library/view.cfm?recnum=7872"

[[saints.sources]]
title = "Franciscan Media — Saint Paul Miki and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-paul-miki-and-companions/"

[[saints]]
id = "christopher-magallanes-and-companions"
name = "Saint Christopher Magallanes and Companions"
aliases = ["Cristóbal Magallanes and Companions","Twenty-Five Mexican Martyrs","Mexican Martyrs canonized in 2000"]
years = "Died 1915–1937"
vocation = "Martyrs"
place = "Mexico"
summary = "Christopher Magallanes and 24 other Catholics killed during a period of religious conflict in Mexico."
biography = [
  "Christopher Magallanes and his twenty-four companions supplied Catholic communities with ministry during recurring conflict between government authorities and the Church in Mexico in the early twentieth century. Restrictions on religious activity varied across places and years. Some clergy were expelled or prevented from working openly, while communities found ways to continue religious education and practice.",
  "Magallanes served as a diocesan priest at Totatiche in Jalisco. When the diocesan seminary was closed, he helped continue the education of candidates for the priesthood there. His work illustrates what was at stake for parishes when public religious services and training for clergy became difficult to maintain.",
  "Most of those remembered with him were diocesan priests. Three were laymen: Manuel Morales, David Roldán, and Salvador Lara. They died with their parish priest, Luis Batis. The group includes people killed in several Mexican states between 1915 and 1937, across different phases of conflict. Their collective title reflects a later ecclesiastical judgment about their deaths.",
  "John Paul II canonized them together on May 21, 2000. In his homily he emphasized their decision to continue serving their communities and their forgiveness of those responsible for their deaths. The shared memorial refers specifically to these twenty-five people, alongside other Catholic martyrs remembered separately from the same era.",
]

[[saints.sources]]
title = "John Paul II — Homily at the canonization of Cristóbal Magallanes and his companions"
url = "https://www.vatican.va/content/john-paul-ii/en/homilies/2000/documents/hf_jp-ii_hom_20000521_canonizations.html"

[[saints.sources]]
title = "Franciscan Media — Saint Cristóbal Magallanes and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-cristobal-magallanes-and-companions/"

[[saints]]
id = "charles-lwanga-and-companions"
name = "Saint Charles Lwanga and Companions"
aliases = ["Uganda Martyrs","Ugandan Catholic Martyrs","Catholic Martyrs of Namugongo"]
years = "Late nineteenth century"
vocation = "Martyrs"
place = "Kingdom of Buganda, present-day Uganda"
summary = "The Catholic martyrs remembered with Charles Lwanga, many of whom served at the royal court of Buganda."
biography = [
  "Christianity had reached the Kingdom of Buganda, in present-day Uganda, through Catholic and Anglican missions by the time Mwanga II became king. Young men who served as pages at the royal court were among the converts. Their presence there placed religious commitments, expectations of service, and the exercise of royal authority in close contact.",
  "Charles Lwanga entered the court and served with Joseph Mukasa Balikuddembe, an older Christian who held responsibility for the pages. Joseph was killed in 1885. Charles was baptized and continued to teach and support younger pages. Accounts of the persecution remember his efforts to protect them when they faced demands they refused to obey.",
  "Charles and a number of other Christians were killed at Namugongo on June 3, 1886. Some of the younger converts, including Kizito, had received baptism shortly before their deaths. Other Catholics in the group died at different places and times. Matthias Mulumba, named alongside Charles in the canonization, was also among those killed.",
  "Paul VI canonized twenty-two Catholic martyrs together on October 18, 1964. At the ceremony he also recognized the witness of Anglican Christians killed during the same persecution. The Roman calendar remembers Charles and his companions on June 3. The Catholic canonization and the wider Ugandan memory of the persecution both shape how Namugongo is commemorated.",
]

[[saints.sources]]
title = "Paul VI — Homily at the canonization of Charles Lwanga, Matthias Mulumba, and their companions"
url = "https://www.vatican.va/content/paul-vi/la/homilies/1964/documents/hf_p-vi_hom_19641018_martiri-uganda.html"

[[saints.sources]]
title = "Franciscan Media — Saint Charles Lwanga and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-charles-lwanga-and-companions/"

[[saints]]
id = "augustine-zhao-rong-and-companions"
name = "Saint Augustine Zhao Rong and Companions"
aliases = ["Chinese Martyrs","Martyr Saints of China","120 Martyrs of China"]
years = "Died 1648–1930"
vocation = "Martyrs"
place = "China"
summary = "A group of 120 Catholics killed in China at different times, including the priest Augustine Zhao Rong."
biography = [
  "The Catholic Church remembers one hundred and twenty people killed in China between 1648 and 1930 under the shared name of Augustine Zhao Rong and Companions. Their deaths took place in different provinces and political periods. The group includes people born in China and missionaries who arrived from abroad, with varied roles in the communities they served.",
  "Augustine Zhao Rong had been a soldier before becoming Catholic and later served as a diocesan priest. He died in 1815. His inclusion alongside lay believers, catechists, bishops, religious, and other priests reflects the variety of people who sustained Christian communities. In all, eighty-seven of the people in the group were born in China.",
  "The earliest death in the group was that of the Dominican missionary Francisco Fernández de Capillas in 1648. Other members died more than two centuries later during attacks associated with the Boxer uprising. John Paul II recalled fourteen-year-old Ann Wang and eighteen-year-old Chi Zhuzi at the canonization. The different dates and circumstances matter to understanding their lives.",
  "The saints had been beatified in several groups before John Paul II canonized them together on October 1, 2000. Their shared memorial on July 9 brings together local believers and missionaries while preserving the names of individuals known from different regions and periods of Chinese Catholic history.",
]

[[saints.sources]]
title = "Holy See — Biographical notes for Augustine Zhao Rong and 119 companions"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_zhao-rong-compagni_en.html"

[[saints.sources]]
title = "John Paul II — Homily at the canonization of Augustine Zhao Rong and 119 companions"
url = "https://www.vatican.va/content/john-paul-ii/en/homilies/2000/documents/hf_jp-ii_hom_20001001_canonization.html"

[[saints.sources]]
title = "Franciscan Media — Saint Augustine Zhao Rong and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-augustine-zhao-rong-and-companions/"

[[saints]]
id = "sixtus-ii-and-companions"
name = "Saint Sixtus II and Companions"
aliases = ["Pope Sixtus II and Companions","Deacons of Saint Sixtus II","Martyrs of the Cemetery of Praetextatus"]
years = "Died 258"
vocation = "Pope and deacon martyrs"
place = "Rome, Italy"
summary = "Pope Sixtus II and six deacons remembered together after their deaths during Valerian’s persecution."
biography = [
  "Sixtus became bishop of Rome in 257, during the reign of Valerian. His short pontificate came at a time when Christian leaders were already discussing how to receive believers baptized outside their communion. An immediate danger arose when imperial measures against Christians restricted assemblies and threatened clergy with death.",
  "A letter from Cyprian of Carthage, written close to the events, reports that Sixtus was killed in a cemetery on August 6, 258, with four deacons. Later accounts identify the location as the cemetery of Praetextatus and describe the bishop being seized there during worship. The early letter establishes the date and setting more securely than it establishes the details of the scene.",
  "The companions normally named with Sixtus are Januarius, Vincent, Magnus, Stephen, Agapitus, and Felicissimus. The last two are remembered as having been killed separately on the same day. The multiple deaths point to the role of deacons in the life of the Christian community and the reach of the persecution beyond its bishop.",
  "Lawrence of Rome was another deacon who died during the persecution in August 258. The Church commemorates him separately on August 10. The Roman calendar remembers Sixtus and the six other deacons together on August 7, preserving the memory of this period in the life of the Roman church through two distinct observances.",
]

[[saints.sources]]
title = "Cyprian of Carthage — Letter to Successus on Valerian’s persecution"
url = "https://www.newadvent.org/fathers/050681.htm"

[[saints.sources]]
title = "The Catholic Spirit — Saint Sixtus II, Pope, and Companions"
url = "https://www.thecatholicspirit.com/commentary/hotdish/st-sixtus-ii-pope-and-companions-martyrs/"

[[saints]]
id = "korean-martyrs"
name = "Korean Martyrs"
aliases = ["Andrew Kim Tae-gŏn and Companions","Andrew Kim Taegon, Paul Chong Hasang, and Companions","103 Korean Martyrs"]
years = "Nineteenth century"
vocation = "Martyrs"
place = "Korea"
summary = "A group of 103 martyrs honored together with Andrew Kim Tae-gŏn and Paul Chŏng Ha-sang."
biography = [
  "The community that gave rise to the Korean martyrs grew through Korean laypeople who encountered Christian writings, some obtained through contacts with China. They read and discussed the books, shared what they learned, and sustained a local church before priests could serve it regularly. Their efforts shaped the strong lay leadership visible among the martyrs.",
  "Paul Chŏng Ha-sang was one of those leaders. He helped maintain connections with Catholics outside Korea and sought priests to serve the community. He died in the persecution of 1839. Among the others killed in that period were the sisters Columba Kim and Agnes Kim, both laywomen. Their stories help convey who was carrying on religious life in families and communities.",
  "Andrew Kim Tae-gŏn studied for the priesthood outside Korea and was ordained in Shanghai in 1845. He returned to serve Korean Catholics and worked to arrange routes by which clergy could reach them. He was arrested and executed in 1846. He is remembered as the first Korean Catholic priest.",
  "John Paul II canonized Andrew, Paul, and 101 companions in Seoul on May 6, 1984. The group includes Korean laywomen and laymen, clergy, and three French missionaries, with deaths spanning several waves of persecution. They are commemorated on September 20. The 124 martyrs beatified with Paul Yun Ji-chung in 2014 belong to a separate group.",
]

[[saints.sources]]
title = "John Paul II — Homily at the canonization of Andrew Kim Tae-gŏn, Paul Chŏng Ha-sang, and companions"
url = "https://www.vatican.va/content/john-paul-ii/en/homilies/1984/documents/hf_jp-ii_hom_19840506_martiri-coreani.html"

[[saints.sources]]
title = "Francis — Homily at the beatification of Paul Yun Ji-chung and 123 companions"
url = "https://www.vatican.va/content/francesco/en/homilies/2014/documents/papa-francesco_20140816_corea-omelia-beatificazione.html"

[[saints.sources]]
title = "Franciscan Media — Saints Andrew Kim Taegon, Paul Chong Hasang, and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-andrew-kim-taegon-paul-chong-hasang-and-companions/"

[[saints]]
id = "lawrence-ruiz-and-companions"
name = "Saint Lawrence Ruiz and Companions"
aliases = ["Saint Lorenzo Ruiz and Companions","Dominican Martyrs of Japan","Martyrs of Nagasaki with Lorenzo Ruiz"]
years = "Seventeenth century"
vocation = "Martyrs"
place = "Japan"
summary = "Catholics honored with Lawrence Ruiz, a layman from Manila who died during persecution in Japan."
biography = [
  "Lorenzo Ruiz grew up in Manila in a family with Chinese and Filipino roots. He worked as a calligrapher, served in a church associated with the Dominicans, and married and had children. When he faced a criminal accusation whose circumstances remain unclear, he left the Philippines aboard a vessel carrying missionaries bound for Japan.",
  "Christian practice had been prohibited in Japan, and the group faced arrest after reaching Okinawa. Lorenzo was brought to Nagasaki with others, including the Dominican priests Antonio González, Guillaume Courtet, and Miguel de Aozaraza, the Japanese priest Vicente Shiwozuka, and the layman Lázaro of Kyoto. Prison accounts describe hesitation under interrogation as well as the prisoners’ eventual resolve.",
  "The Church canonized sixteen people in this group. Their deaths took place in and around Nagasaki between 1633 and 1637, so the group extends beyond the people who traveled with Lorenzo. It includes Japanese Catholics such as Magdalene of Nagasaki and Marina of Omura. Their lives show how many kinds of religious service continued under the ban.",
  "John Paul II beatified the group in Manila in 1981 and canonized them on October 18, 1987. Lorenzo is honored as the first Filipino canonized saint. His shared memorial on September 28 honors this group of seventeenth-century martyrs. Paul Miki’s companions were executed at Nagasaki in 1597 and are commemorated in February.",
]

[[saints.sources]]
title = "John Paul II — Homily at the canonization of Lorenzo Ruiz and his companions"
url = "https://www.vatican.va/content/john-paul-ii/en/homilies/1987/documents/hf_jp-ii_hom_19871018_canonizzaz-martiri.html"

[[saints.sources]]
title = "Franciscan Media — Saint Lorenzo Ruiz and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-lorenzo-ruiz-and-companions/"

[[saints.sources]]
title = "Franciscan Media — Saint Paul Miki and Companions (separate 1597 martyrdom)"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-paul-miki-and-companions/"

[[saints]]
id = "denis-and-companions"
name = "Saint Denis and Companions"
aliases = ["Denis of Paris and Companions","Martyrs of Montmartre","Saint Denis and his companions"]
years = "Traditionally dated to the third century"
vocation = "Martyrs"
place = "Paris, France"
summary = "Denis, remembered as the first bishop of Paris, and the companions honored with him."
biography = [
  "Denis is remembered as an early bishop of Paris, then a city in Roman Gaul. Gregory of Tours, writing in the sixth century, included Denis in an account of bishops who carried the Christian faith into Gaul. This source is several centuries later than the events it describes. The date and immediate circumstances of the martyrdom therefore remain uncertain.",
  "The companions named in the tradition are Rusticus, a priest, and Eleutherius, a deacon. Their names became associated with Denis in the local cult of the martyrs. Later stories linked their deaths with Montmartre and accentuated Denis’s courage. The familiar image of Denis carrying his head after execution belongs to that later tradition.",
  "A place of veneration grew around the tomb associated with Denis north of Paris. The church there became the Basilica of Saint-Denis and gained an important place in the history of the French monarchy. The importance of the later church helps explain why the group became widely known, despite the limited evidence about their original lives.",
  "Denis of Paris is distinct from Dionysius the Areopagite, a figure in Acts, though some medieval writers identified them with one another. In the Roman calendar Denis, Rusticus, and Eleutherius share an optional memorial on October 9.",
]

[[saints.sources]]
title = "Centre des monuments nationaux — History of the Basilica of Saint-Denis"
url = "https://www.saint-denis-basilique.fr/en/discover/history-of-the-monument"

[[saints.sources]]
title = "Franciscan Media — Saint Denis and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-denis-and-companions/"

[[saints.sources]]
title = "Northwest Catholic — Saint Denis and Companions"
url = "https://nwcatholic.org/news/catholic-news-service/october-2020-st-denis-and-companions"

[[saints]]
id = "north-american-martyrs"
name = "North American Martyrs"
aliases = ["Canadian Martyrs","John de Brébeuf and Isaac Jogues and Companions","Eight North American Martyrs"]
years = "Died 1642–1649"
vocation = "Jesuit and lay martyrs"
place = "New France and the Mohawk Valley"
summary = "Eight men associated with the Jesuit missions in North America who died in the 1640s."
biography = [
  "The North American Martyrs were six French Jesuit priests and two lay assistants who died in the 1640s. Their work took place in New France and the Mohawk Valley, at a time when European colonization, trade, disease, and warfare unsettled Indigenous communities. Much of their documented history comes from Jesuit letters written from a missionary perspective.",
  "Jean de Brébeuf lived among the Wendat, often called the Huron in older sources, and worked to learn their language. He and Gabriel Lalemant were killed in 1649. Anthony Daniel died in 1648, and Charles Garnier and Noël Chabanel died in 1649. Their deaths occurred in separate incidents within the wider conflict.",
  "Isaac Jogues was captured with the lay assistant René Goupil in 1642. Goupil died that year. Jogues escaped with Dutch assistance and returned to France, then went back to North America. In 1646 he and another lay assistant, Jean de Lalande, were killed near the Mohawk settlement of Ossernenon in what is now New York.",
  "The Church canonized all eight together in 1930, linking the memory of people who died in different places and years. The U.S. Roman Rite calendar remembers them on October 19. In Canada the associated observance is September 26, reflecting the history of their remembrance on both sides of the present border.",
]

[[saints.sources]]
title = "Society of Jesus — The North American Martyrs"
url = "https://www.jesuits.org/stories/society-of-jesus-in-the-u-s-celebrates-the-feast-of-the-north-american-martyrs/"

[[saints.sources]]
title = "Franciscan Media — Saints Isaac Jogues, Jean de Brébeuf, and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-isaac-jogues-jean-de-brebeuf-and-companions/"

[[saints]]
id = "vietnamese-martyrs"
name = "Vietnamese Martyrs"
aliases = ["Martyrs of Vietnam","Andrew Dũng-Lạc and Companions","Andrew Dung Lac and Companions","117 Vietnamese Martyrs"]
years = "Eighteenth and nineteenth centuries"
vocation = "Martyrs"
place = "Vietnam"
summary = "The group of 117 martyrs, including Andrew Dũng-Lạc, canonized in 1988."
biography = [
  "The Vietnamese Martyrs are one hundred and seventeen people whose lives belonged to different periods and communities of the Catholic Church in Vietnam. Most were Vietnamese. The group also includes Spanish and French missionaries. Bishops, priests, catechists, and lay Catholics are represented, including people whose work and family life took place far from centers of government.",
  "Andrew Dũng-Lạc grew up in northern Vietnam, received Christian instruction from a catechist, and was ordained a priest in 1823. He was arrested during the reign of Minh Mạng, released after his parishioners paid a ransom, and arrested again. He and the priest Peter Thi were executed at Hanoi on December 21, 1839.",
  "The group includes people killed before and after Andrew. Under different rulers, policies against Catholic practice ranged from restrictions on missionaries to efforts to compel believers to renounce their faith. Lay Catholics helped sustain communities by teaching, sheltering clergy, and continuing worship. The names recognized in the canonization represent only part of the much larger history of persecution.",
  "John Paul II canonized the group on June 19, 1988. His homily acknowledged both the Vietnamese church and the overseas religious communities to which some of the missionaries belonged. On November 24 the Roman calendar remembers Andrew and his companions together. The shared observance reflects a history of local Catholic life spanning communities and generations.",
]

[[saints.sources]]
title = "John Paul II — Homily at the canonization of the Vietnamese martyrs"
url = "https://www.vatican.va/content/john-paul-ii/it/homilies/1988/documents/hf_jp-ii_hom_19880619_martiri.html"

[[saints.sources]]
title = "Catholic Church in Norway — Saint Andrew Dũng-Lạc and his 116 companions, 1745–1862"
url = "https://www.katolsk.no/biografier/historisk/adung_en"
