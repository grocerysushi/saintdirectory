years = "Died 258"
vocation = "Pope and deacon martyrs"
place = "Rome, Italy"
summary = "Pope Sixtus II and six deacons remembered together after their deaths during Valerian’s persecution."
biography = [
  "An account of the persecution places Sixtus at the cemetery of Praetextatus in 258. Four of the deacons associated with his memorial were killed with him, and two others were killed later that day.",
  "The companions are remembered as Januarius, Vincent, Magnus, Stephen, Agapitus, and Felicissimus. Lawrence of Rome died during the same persecution and is commemorated separately.",
]

