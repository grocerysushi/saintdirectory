id = "first-martyrs-of-the-church-of-rome"
name = "First Martyrs of the Church of Rome"
aliases = ["First Martyrs of the Holy Roman Church","Martyrs of Rome under Nero","Roman protomartyrs"]
years = "Mid-first century"
vocation = "Martyrs"
place = "Rome, Italy"
summary = "Christians killed in Rome under Nero after the great fire of 64."
biography = [
  "A fire devastated Rome in 64. The Roman historian Tacitus reports that Nero blamed Christians for it and subjected them to punishment. The names of many of those killed are unknown.",
  "The Church commemorates these early Roman Christians together. The date of their observance follows the solemnity of Saints Peter and Paul.",
]

