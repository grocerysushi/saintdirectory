[[saints]]
id = "carlo-acutis"
name = "Saint Carlo Acutis"
aliases = ["Carlo Acutis", "Carlos Acutis", "San Carlo Acutis"]
years = "1991–2006"
vocation = "Lay student and catechist"
place = "London, England, and Milan, Monza, and Assisi, Italy"
summary = "An Italian teenager who taught catechism, volunteered with people in need, and used computers to share Catholic teaching on the Eucharist."
biography = [
  "Carlo Acutis was born in London while his Italian parents were living there for work. The family returned to Milan when he was an infant. He received his first Communion at seven and made frequent Mass attendance and prayer before the Eucharist part of his life as a student. At his parish, Santa Maria Segreta, he helped prepare children for confirmation.",
  "Carlo learned to work with computers and helped friends and relatives use their software. He worked with an engineering student on the parish website and organized material about reported Eucharistic miracles into an exhibition. The project gathered photographs and historical accounts from different places and made them available beyond his own parish. Carlo also used the material when teaching catechism.",
  "He often spent holidays in Assisi, where he learned about Francis and Clare and became attached to the town. In Milan he also volunteered among people without housing and with organizations serving meals. His life in both places included friendships, schoolwork, and the practical responsibilities he took on alongside his devotion to the Eucharist.",
  "Carlo developed acute leukemia in October 2006 and died at a hospital in Monza at fifteen. He was buried in Assisi, where his beatification took place in 2020. Pope Leo XIV canonized him with Pier Giorgio Frassati on September 7, 2025. In his homily, Leo presented both as examples of lay holiness shaped through ordinary decisions.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Carlo Acutis"
url = "https://www.causesanti.va/it/santi-e-beati/carlo-acutis.html"

[[saints.sources]]
title = "Leo XIV — Canonization of Pier Giorgio Frassati and Carlo Acutis"
url = "https://www.vatican.va/content/leo-xiv/en/homilies/2025/documents/20250907-omelia-frassati-acutis.html"

[[saints]]
id = "pier-giorgio-frassati"
name = "Saint Pier Giorgio Frassati"
aliases = ["Pier Giorgio Frassati", "Piergiorgio Frassati", "Frassati", "Fra Girolamo"]
years = "1901–1925"
vocation = "Lay student, social activist, and Dominican tertiary"
place = "Turin and Pollone, Italy"
summary = "A Turin engineering student who visited poor families, took part in Catholic social action, and brought friends together through mountaineering."
biography = [
  "Pier Giorgio Frassati was born in Turin to Alfredo Frassati, a newspaper founder, and Adelaide Ametis, a painter. As a young man he joined the Society of Saint Vincent de Paul and visited families facing poverty. He helped people obtain food, medicines, and clothing, and sometimes used the money intended for his own travel to pay for what someone else needed.",
  "He enrolled in engineering with a concentration in mining, hoping to work among miners. He joined Catholic student organizations and Catholic Action and became involved with the Italian Popular Party. In the unsettled years after the First World War, he called for social reform and disagreed with members of the party who were willing to support the emerging fascist movement.",
  "Frassati was also a lay Dominican. He enjoyed climbing and belonged to alpine associations through which he took friends on trips into the mountains. His family came to understand the full extent of his charitable work only after his death, when some of the people he had assisted came to his funeral.",
  "He died of rapidly progressing poliomyelitis in Turin on July 4, 1925, at twenty-four, while still a student. Pope John Paul II beatified him in 1990. Pope Leo XIV canonized him with Carlo Acutis on September 7, 2025, a century after Frassati’s death.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Pier Giorgio Frassati"
url = "https://www.causesanti.va/it/santi-e-beati/pier-giorgio-frassati.html"

