[[saints]]
id = "gianna-beretta-molla"
name = "Saint Gianna Beretta Molla"
aliases = ["Gianna Beretta", "Gianna Molla", "Santa Gianna Beretta Molla"]
years = "1922–1962"
vocation = "Pediatrician, wife, and mother"
place = "Magenta and Mesero, Italy"
summary = "A pediatrician who combined medical practice and charitable work with raising a family in northern Italy."
biography = [
  "Gianna Beretta was born in Magenta, west of Milan. While studying medicine she worked with young people in Catholic Action and assisted older people and families in need through the Society of Saint Vincent de Paul. She received her medical degree from the University of Pavia in 1949 and opened a practice in nearby Mesero the following year.",
  "Gianna specialized in pediatrics at the University of Milan in 1952. She saw children and expectant mothers in her practice and also cared for older people and patients with limited resources. She married Pietro Molla in 1955 and continued working as a physician while raising their children, Pierluigi, Mariolina, and Laura.",
  "In 1961, during her fourth pregnancy, doctors found a uterine fibroid that required surgery. She asked her surgeon to preserve the pregnancy if possible. Her daughter Gianna Emanuela was born on April 21, 1962. Gianna became gravely ill after the birth and died one week later at thirty-nine.",
  "Pope John Paul II beatified Gianna in 1994 and canonized her in 2004. The Vatican biography remembers her enjoyment of skiing and mountaineering alongside the attention she gave to children in Catholic Action. Her medical work and the years she devoted to raising a family were part of the life the Church recognized at her canonization.",
]

[[saints.sources]]
title = "Holy See — Gianna Beretta Molla, Biography"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20040516_beretta-molla_en.html"

[[saints]]
id = "zelie-martin"
name = "Saint Zélie Martin"
aliases = ["Zelie Martin", "Zélie Guérin", "Azélie-Marie Guérin", "Marie-Azélie Guérin", "Zélie Martin and Louis Martin"]
years = "1831–1877"
vocation = "Lacemaker, wife, and mother"
place = "Alençon, Normandy, France"
summary = "An Alençon lace entrepreneur and the mother of five daughters who entered religious life, including Thérèse of Lisieux."
biography = [
  "Zélie Guérin grew up in Normandy and learned to make point d’Alençon, a fine needle lace produced in the region. She set up her own business in Alençon, where she coordinated the work of lacemakers and dealt with customers. Her letters give a picture of skilled work carried out alongside the needs of a busy household.",
  "She married the watchmaker Louis Martin in 1858. The couple had nine children, four of whom died young. Their surviving daughters were Marie, Pauline, Léonie, Céline, and Thérèse. Zélie’s correspondence records her concern for their health and education, the changes in her business, and the relationships with relatives who helped sustain the family.",
  "As her work grew, Louis helped manage the lace business. Zélie continued to direct its production while caring for her children and helping people in need. She became gravely ill with breast cancer and died at Alençon in 1877. Thérèse, her youngest surviving daughter, was four.",
  "Zélie and Louis were beatified together in 2008 and canonized by Pope Francis in 2015. All five surviving daughters entered religious life. Zélie’s letters preserve a detailed view of the choices she made as a business owner, parent, and Catholic during a period of frequent illness and loss in the family.",
]

[[saints.sources]]
title = "Sanctuary of Lisieux — The Story of Louis and Zélie"
url = "https://www.therese-de-lisieux.catholique.fr/en/lhistoire/histoire-louis-zelie/"

[[saints.sources]]
title = "Vatican News — Tenth Anniversary of the Canonization of Louis and Zélie Martin"
url = "https://www.vaticannews.va/en/pope/news/2025-10/pope-leo-xiv-louis-zelie-martin-anniversary-therese-of-lisieux.html"

[[saints]]
id = "louis-martin"
name = "Saint Louis Martin"
aliases = ["Louis Joseph Aloys Stanislaus Martin", "Louis-Joseph-Aloys-Stanislas Martin", "Louis Martin of Lisieux", "Louis Martin and Zélie Martin"]
years = "1823–1894"
vocation = "Watchmaker, husband, and father"
place = "Bordeaux, Alençon, and Lisieux, France"
summary = "A watchmaker who helped run the family lace business and raised five daughters with his wife Zélie."
biography = [
  "Louis Martin was born at Bordeaux into a family that moved with his father’s military assignments. As a young man he considered religious life at the Great Saint Bernard hospice. He went on to learn watchmaking and opened a shop at Alençon in 1850. He also made time for prayer, visits to friends, and charitable work in the town.",
  "He married Zélie Guérin in 1858. Louis kept his shop for part of their marriage and eventually took on administrative work for Zélie’s growing lace business. They had nine children. Five daughters survived childhood, and the couple shared the work of raising them while coping with the deaths of four children.",
  "After Zélie died in 1877, Louis moved with his daughters to Lisieux to live near her brother, Isidore Guérin, and his family. He supported his daughters’ interest in religious life. Thérèse entered the Carmelite convent at Lisieux in 1888. Louis experienced serious illness later in life and spent several years receiving care at a hospital in Caen before returning to his family.",
  "Louis died in 1894. Pope Francis canonized him and Zélie together in 2015. Their Church recognition drew attention to the lives of a married couple with responsibilities in the household, the parish, and the workplace. Louis’s years as a widowed father and the support he received during illness are also part of that history.",
]

[[saints.sources]]
title = "Sanctuary of Lisieux — The Story of Louis and Zélie"
url = "https://www.therese-de-lisieux.catholique.fr/en/lhistoire/histoire-louis-zelie/"

[[saints.sources]]
title = "Vatican News — Tenth Anniversary of the Canonization of Louis and Zélie Martin"
url = "https://www.vaticannews.va/en/pope/news/2025-10/pope-leo-xiv-louis-zelie-martin-anniversary-therese-of-lisieux.html"

[[saints]]
id = "jose-sanchez-del-rio"
name = "Saint José Sánchez del Río"
aliases = ["Jose Sanchez del Rio", "Joselito Sánchez del Río", "Joselito", "San José Sánchez del Río"]
years = "1913–1928"
vocation = "Lay teenager and martyr"
place = "Sahuayo, Michoacán, Mexico"
summary = "A teenager from Michoacán killed during the Cristero War after refusing to renounce his Catholic faith."
biography = [
  "José Sánchez del Río grew up in a Catholic family in Sahuayo, Michoacán. In the 1920s, the Mexican government imposed new restrictions on clergy and public worship. The bishops suspended public services in 1926. Armed resistance followed in parts of the country, including Michoacán, in the conflict now called the Cristero War.",
  "Two of José’s older brothers joined the Cristero movement. José continued receiving religious instruction and eventually asked his parents to let him join a group operating near Sahuayo. According to the Church’s account of his cause, he served as a standard-bearer and took on basic support duties. Government troops captured him during a clash in February 1928.",
  "José was taken back to Sahuayo and held in the parish church, which the troops were using as a prison. A letter to his mother expresses his trust in God and his expectation that he would die. Accounts gathered for his cause describe his refusal to renounce his faith under torture. He was killed on February 10, 1928, at fourteen.",
  "The Church beatified José in 2005 and Pope Francis canonized him in 2016. His remains are venerated at the parish church where he was baptized and later held. He is commonly called Joselito, the name used by his family and neighbors.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — José Sánchez del Río"
url = "https://www.causesanti.va/it/santi-e-beati/jose-sanchez-del-rio.html"

[[saints.sources]]
title = "Holy See — Thanksgiving Homily for the Beatification of José Sánchez del Río"
url = "https://www.vatican.va/roman_curia/congregations/csaints/documents/rc_con_csaints_doc_20051121_beatificazione-sanchez-del-rio_sp.html"

[[saints]]
id = "nunzio-sulprizio"
name = "Saint Nunzio Sulprizio"
aliases = ["Nunzio Sulprizio", "Nuntius Sulprizio", "San Nunzio Sulprizio"]
years = "1817–1836"
vocation = "Lay artisan and blacksmith’s apprentice"
place = "Pescosansonesco, L’Aquila, and Naples, Italy"
summary = "An orphaned apprentice who spent years in treatment for a serious illness and supported other patients in the hospitals that cared for him."
biography = [
  "Nunzio Sulprizio was born at Pescosansonesco in Abruzzo. His father died when Nunzio was very young, and he went to live with his maternal grandmother after his mother died. She encouraged the habits of prayer and devotion that remained important to him. Her death left him without her support when he was nine.",
  "A maternal uncle took Nunzio into his household, withdrew him from school, and put him to work at his blacksmith’s shop. Nunzio developed a painful wound on his foot and received treatment at a hospital in L’Aquila. While there he visited other patients, prayed with them, and tried to help with the needs he could meet.",
  "Another uncle sought help from Felice Wochinger, an army colonel in Naples. Wochinger took responsibility for Nunzio’s care and arranged for him to receive treatment at the hospital known as the Incurabili. The illness progressed. Nunzio spent his last years in Naples, where his care included a period in Wochinger’s home after his discharge.",
  "Nunzio died on May 5, 1836, at nineteen. Pope Paul VI beatified him in 1963, and Pope Francis canonized him in 2018. The accounts of his life preserve his experience as a young worker and patient and remember the attention he gave to other people during his own illness.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Nunzio Sulprizio"
url = "https://www.causesanti.va/it/santi-e-beati/nunzio-sulprizio.html"

[[saints]]
id = "laura-montoya"
name = "Saint Laura Montoya"
aliases = ["María Laura de Jesús Montoya Upegui", "Laura Montoya Upegui", "Laura of Saint Catherine of Siena", "Mother Laura", "Madre Laura"]
years = "1874–1949"
vocation = "Teacher, missionary, and religious founder"
place = "Jericó, Dabeiba, and Medellín, Colombia"
summary = "A Colombian teacher who founded a congregation of women missionaries and worked among Indigenous communities in Antioquia."
biography = [
  "Laura Montoya was born in Jericó, in the Colombian department of Antioquia. Her father was killed during political conflict when she was a young child, and for a time she lived with her maternal grandparents. She studied in Medellín to become a teacher and then taught in several towns in Antioquia.",
  "Montoya made a missionary journey to the Guapá and Chamí region in 1908 with two women and a priest. In 1914 she traveled to Dabeiba with her mother and several companions. Their work brought them into contact with Emberá communities. Her Catholic mission grew from her experience as a teacher and involved journeys into areas far from the schools where she had previously worked.",
  "She established the Missionary Sisters of Mary Immaculate and Saint Catherine of Siena. The congregation obtained its first ecclesiastical approval in 1916, and Montoya made her religious profession the following year. As superior she guided the growth of communities in Colombia and neighboring countries. She continued directing the congregation through years of illness that limited her mobility.",
  "Montoya died in Medellín in 1949. Pope Francis canonized her on May 12, 2013. She was the first Colombian to be canonized and is widely known in Colombia as Madre Laura. Her religious name, Laura of Saint Catherine of Siena, appears in Church records alongside her family name.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Laura of Saint Catherine of Siena"
