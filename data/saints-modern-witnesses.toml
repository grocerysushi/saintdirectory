[[saints]]
id = "maria-guadalupe-garcia-zavala"
name = "Saint María Guadalupe García Zavala"
aliases = ["Maria Guadalupe Garcia Zavala", "Anastasia Guadalupe García Zavala", "Mother Lupita", "Madre Lupita", "Guadalupe García Zavala"]
years = "1878–1963"
vocation = "Nurse and religious co-founder"
place = "Zapopan and Guadalajara, Jalisco, Mexico"
summary = "A Mexican nurse who co-founded a congregation devoted to hospital care and kept serving patients through political and religious upheaval."
biography = [
  "Anastasia Guadalupe García Zavala was born in Zapopan, Jalisco. Her family called her Lupita. Her father ran a shop near the shrine of Our Lady of Zapopan, and she took part in charitable work as a young woman. At twenty-three she ended her engagement and decided to devote herself to religious life and the care of people who were ill.",
  "In 1901 she and Father Cipriano Iñiguez Martín del Campo founded the Servants of Saint Margaret Mary and the Poor. Lupita worked as a nurse and became the congregation’s superior. The sisters cared for patients in a Guadalajara hospital that had limited equipment and money. When it could no longer meet essential costs, she and other sisters collected donations in the streets.",
  "During the period of conflict between Mexican authorities and the Church, Lupita and the sisters sheltered clergy in the hospital, including the archbishop of Guadalajara. They also fed soldiers posted nearby and treated those who were wounded. The hospital remained a place of care through years in which the sisters’ own security was often uncertain.",
  "Lupita led the congregation as it opened other houses. She died in Guadalajara in 1963. Pope John Paul II beatified her in 2004, and Pope Francis canonized her on May 12, 2013. She is remembered in Mexico as Madre Lupita.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — María Guadalupe García Zavala"
url = "https://www.causesanti.va/it/santi-e-beati/maria-guadalupe-garcia-zavala.html"

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Canonizations of May 12, 2013"
url = "https://www.causesanti.va/it/celebrazioni/canonizzazioni/2013/05/12.html"

[[saints]]
id = "dulce-lopes-pontes"
name = "Saint Dulce Lopes Pontes"
aliases = ["Irmã Dulce", "Irma Dulce", "Dulce of the Poor", "Santa Dulce dos Pobres", "Maria Rita de Souza Brito Lopes Pontes", "Maria Rita de Sousa Brito Lopes Pontes"]
years = "1914–1992"
vocation = "Missionary sister and social care organizer"
place = "Salvador, Bahia, Brazil"
summary = "A Brazilian religious sister whose work with poor and sick residents of Salvador grew into a hospital and a network of social services."
biography = [
  "Maria Rita de Souza Brito Lopes Pontes grew up in Salvador, in the Brazilian state of Bahia. Her mother died when Maria Rita was seven. As a teenager she began helping poor and sick people near her home. After training as a teacher, she entered the Missionary Sisters of the Immaculate Conception of the Mother of God in 1933 and took her mother’s name, Dulce.",
  "Dulce taught in Salvador and helped organize a workers’ association named for Saint Francis. The association developed a clinic and educational services. As more people came to her for help, Dulce sought places where patients who had nowhere else to go could stay. She moved them between makeshift shelters as their circumstances changed.",
  "In 1949 Dulce obtained permission to use a poultry shed near her convent to house patients. That improvised ward became the beginning of a larger effort. In 1959 the association Obras Sociais Irmã Dulce was established to support the work, which developed into a network of services and the Santo Antônio Hospital in Salvador.",
  "Dulce lived with serious respiratory illness and died in 1992. Pope Francis canonized her in 2019. In Brazil she is widely known as Santa Dulce dos Pobres, or Saint Dulce of the Poor. The institution she founded continues to care for patients in Salvador.",
]

[[saints.sources]]
title = "Obras Sociais Irmã Dulce — Saint Dulce of the Poor"
url = "https://irmadulce.org.br/santa-dulce-dos-pobres"

[[saints.sources]]
title = "Vatican News — Dulce Lopes Pontes, Biography"
url = "https://www.vaticannews.va/en/church/news/2019-10/biography-dulce-lopes-pontes-nobel-nominee.html"
