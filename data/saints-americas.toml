[[saints]]
id = "marie-of-the-incarnation"
name = "Saint Marie of the Incarnation"
aliases = ["Marie Guyart", "Marie de l’Incarnation", "Marie Guyart Martin", "Marie of the Incarnation of Québec"]
years = "1599–1672"
vocation = "Ursuline nun, educator, and writer"
place = "Tours, France, and Québec, New France"
summary = "An Ursuline educator and writer who crossed the Atlantic in 1639 and helped establish her order in Québec."
biography = [
  "Marie Guyart was born in Tours, France, in 1599. She married Claude Martin and had a son, also named Claude. Her husband died while their child was still an infant, and Marie had to settle the affairs of the failed family business. She later worked in a relative’s business while caring for her son. She wrote about experiences of prayer that developed during those years and eventually sought to enter the Ursulines.",
  "Marie joined the order at Tours in 1631. Her son remained in the care of relatives, a separation that she later discussed in correspondence. In 1639 she sailed to Québec with other Ursulines and with Madeleine de La Peltrie, who supported their foundation. The group established a community and began educating girls.",
  "The Québec Ursulines taught girls from French and Indigenous communities. Marie studied Indigenous languages to communicate with her pupils and help prepare material for teaching. The work took place in a French colony in which relations with Indigenous nations shaped daily life. A fire destroyed the convent in 1650, and the Ursulines rebuilt it.",
  "Marie kept up a large correspondence across the Atlantic. Her letters describe her own prayer and the practical demands of maintaining a community in Québec. Some were preserved and published through the work of her son, who became a Benedictine. She died in Québec in 1672. Pope Francis canonized her in 2014.",
]

[[saints.sources]]
title = "The Canadian Encyclopedia — Marie de l’Incarnation"
url = "https://thecanadianencyclopedia.ca/en/article/marie-de-lincarnation"

[[saints.sources]]
title = "Canadian Conference of Catholic Bishops — Welcoming Canada’s Two New Saints"
url = "https://www.cccb.ca/letter/welcoming-canadas-two-new-saints-francois-de-laval-and-marie-of-the-incarnation/"

[[saints]]
id = "francois-de-laval"
name = "Saint François de Laval"
aliases = ["François de Montmorency-Laval", "Francis de Laval", "Monsignor de Laval", "Monseigneur de Laval"]
years = "1623–1708"
vocation = "Bishop and seminary founder"
place = "France and Québec, New France"
summary = "The first bishop of Québec, who organized parishes and founded a seminary to form clergy in New France."
biography = [
  "François de Laval was born in France in 1623 and was ordained a priest in 1647. He was appointed apostolic vicar of New France and arrived in Québec in 1659. The assignment placed him in charge of Catholic communities spread over a large territory. Travel between settlements was difficult, and much of the clergy’s work took place at a considerable distance from Québec.",
  "Laval founded the Séminaire de Québec in 1663. He used it to support the education of priests and to help maintain clergy working in separate parishes. He also established a school for younger students. The seminary gave the Church in New France a base from which it could educate clergy locally.",
  "His responsibilities brought him into disagreements with colonial officials. One dispute concerned the sale of alcohol to Indigenous people. Laval opposed the trade, which he regarded as harmful to communities. The dispute shows how pastoral concerns and colonial economic interests could bring the bishop and civil authorities into conflict.",
  "When Québec became a diocese in 1674, Laval was its first bishop. He resigned as bishop in 1688 and spent much of his remaining life at the seminary and in pastoral work. He died in 1708. Pope Francis canonized him in 2014 alongside Marie of the Incarnation, whose work with the Ursulines had begun before he reached Québec.",
]

[[saints.sources]]
title = "The Canadian Encyclopedia — François de Laval"
url = "https://thecanadianencyclopedia.ca/en/article/francois-de-laval"

[[saints.sources]]
title = "Canadian Conference of Catholic Bishops — Welcoming Canada’s Two New Saints"
url = "https://www.cccb.ca/letter/welcoming-canadas-two-new-saints-francois-de-laval-and-marie-of-the-incarnation/"

[[saints]]
id = "marguerite-bourgeoys"
name = "Saint Marguerite Bourgeoys"
aliases = ["Margaret Bourgeoys", "Mother Bourgeoys", "Marguerite Bourgeois", "Foundress of the Congregation of Notre Dame"]
years = "1620–1700"
vocation = "Educator and religious founder"
place = "Troyes, France, and Montréal, New France"
summary = "An educator who opened Montréal’s first school and founded the Congregation of Notre Dame."
biography = [
  "Marguerite Bourgeoys was born in Troyes in 1620. She took part in an association connected to the teaching work of religious women there. When Paul de Chomedey de Maisonneuve sought a teacher for the settlement of Ville-Marie, she took up the invitation and sailed to New France in 1653. The settlement later became Montréal.",
  "In 1658 Bourgeoys opened a school in a building that had served as a stable. Her work soon called for other teachers, and she returned to France to recruit women to join her. The community developed a form of religious life in which members could travel to teach. Their schools served children in Montréal and elsewhere in the colony.",
  "Bourgeoys also helped receive women arriving from France under the program that became known as the Filles du Roi. She and her companions offered them lodging and support as they settled. This ministry grew alongside the school work and brought the community into contact with families at different stages of life.",
  "The congregation she founded became known as the Congregation of Notre Dame of Montréal. Its rules received diocesan approval near the end of her life. Bourgeoys died in 1700. Pope John Paul II canonized her in 1982. The schools and houses that grew from her foundation preserved an approach to religious work organized around teaching in the places where pupils lived.",
]

[[saints.sources]]
title = "Holy See — Biography of Marguerite Bourgeoys"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_19821031_bourgeoys_en.html"

[[saints.sources]]
title = "The Canadian Encyclopedia — Marguerite Bourgeoys"
url = "https://thecanadianencyclopedia.ca/en/article/marguerite-bourgeoys"

[[saints]]
id = "marguerite-dyouville"
name = "Saint Marguerite d’Youville"
aliases = ["Marie-Marguerite Dufrost de Lajemmerais", "Mother d’Youville", "Marguerite dYouville", "Marie Marguerite d’Youville"]
years = "1701–1771"
vocation = "Widow and religious founder"
place = "Varennes and Montréal, Québec"
summary = "A Canadian-born widow who founded the Grey Nuns and led a Montréal hospital that served people in need."
biography = [
  "Marguerite Dufrost de Lajemmerais was born at Varennes in 1701. She married François d’Youville and became a mother. Several of her children died young. After her husband died in 1730, she had to support the family and address the debts he had left. Her two surviving sons later became priests.",
  "Marguerite began sharing her home and resources with people in need. Several women joined her, forming a community in 1737. Their work grew out of the need to provide continuing care and lodging. It also drew criticism from people who doubted the women’s intentions and their ability to maintain the work.",
  "In 1747 Marguerite took charge of the General Hospital of Montréal. The hospital housed people in need of different kinds of care, including those who lacked family or other support. Managing it involved finding supplies, arranging regular care, and keeping the institution open. After a fire destroyed the hospital in 1765, Marguerite and her companions undertook its reconstruction.",
  "The community became the Sisters of Charity of Montréal, widely known as the Grey Nuns. Marguerite died in 1771. Pope John Paul II canonized her in 1990. She was the first person born in what is now Canada to be canonized by the Catholic Church.",
]

[[saints.sources]]
title = "Holy See — Biography of Marie Marguerite d’Youville"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_19901209_youville_en.html"

[[saints.sources]]
title = "Canadian Medical Hall of Fame — Sainte Marguerite d’Youville"
url = "https://www.cdnmedhall.ca/laureates/margueritedyouville"

[[saints]]
id = "theodore-guerin"
name = "Saint Théodore Guérin"
aliases = ["Mother Theodore Guerin", "Anne-Thérèse Guérin", "Saint Mother Theodore"]
years = "1798–1856"
vocation = "Religious founder and educator"
place = "Brittany, France, and Indiana, United States"
summary = "A Sister of Providence who founded her congregation’s Indiana community and established schools for girls."
biography = [
  "Anne-Thérèse Guérin was born in Brittany in 1798. She cared for members of her family before entering the Sisters of Providence at Ruillé-sur-Loir. In France she gained experience teaching and caring for others through the congregation. Poor health would continue to affect her throughout her religious life.",
  "In 1840 Guérin traveled to Indiana with five other Sisters of Providence. They settled at what became Saint Mary-of-the-Woods, near Terre Haute. The sisters arrived with few resources. They had to secure shelter, establish a community, and find a way to support the educational work for which they had come.",
  "They opened an academy for young women in 1841. Guérin also took responsibility for forming new sisters and establishing schools in other communities. The academy eventually developed into Saint Mary-of-the-Woods College. Maintaining the congregation required fundraising, correspondence with France, and negotiation with church authorities in Indiana.",
  "Guérin was still in Indiana when she died in 1856. By then the sisters were teaching in several locations and caring for people through other ministries. Pope Benedict XVI canonized her in 2006. The community at Saint Mary-of-the-Woods preserves the name she took as a Sister of Providence and the educational foundation she established.",
]

[[saints.sources]]
title = "Holy See — Biography of Théodore Guérin"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20061015_guerin_en.html"

[[saints.sources]]
title = "Saint Mary-of-the-Woods College — Saint Mother Theodore Guerin"
url = "https://www.smwc.edu/faith/saint-mary-theodore-guerin/"

[[saints]]
id = "narcisa-de-jesus"
name = "Saint Narcisa de Jesús Martillo Morán"
aliases = ["Narcisa de Jesús", "Narcisa Martillo", "Niña Narcisa", "Narcisa de Nobol"]
years = "1832–1869"
vocation = "Lay catechist and seamstress"
place = "Nobol and Guayaquil, Ecuador, and Lima, Peru"
summary = "An Ecuadorian laywoman who supported herself by sewing and combined prayer with teaching the faith and helping people in need."
biography = [
  "Narcisa was born in 1832 near Nobol, Ecuador. She grew up in a farming family and learned to sew. Her mother died while she was a child. After the death of her father, she moved to Guayaquil, where she stayed with a family near the cathedral. Needlework gave her a means of supporting herself.",
  "In Guayaquil, Narcisa met priests who guided her in prayer. Much of that prayer took place alongside work in ordinary households. The accounts used in her cause describe her teaching the faith to children and tending to people who were ill. She took an interest in the example of Mariana de Jesús de Paredes, another laywoman from Ecuador.",
  "In 1868 Narcisa traveled to Lima and lived as a lay member at the Dominican convent of Patrocinio. The community gave her a setting for religious life during her final illness. She died in Lima in 1869. The sisters preserved her memory, and her remains were later taken to Ecuador. Nobol became a center of devotion to her.",
  "Pope Benedict XVI canonized Narcisa in 2008. She is remembered for work that was mostly carried out within homes and local communities. Her biography also connects places on the Pacific coast that shared religious ties, from the Dominican parish of her childhood to the community that received her in Peru.",
]

[[saints.sources]]
title = "Holy See — Biography of Narcisa de Jesús Martillo Morán"
url = "https://www.vatican.va/news_services/liturgy/saints/2008/ns_lit_doc_20081012_narcisa_en.html"

[[saints]]
id = "mariana-de-jesus-de-paredes"
name = "Saint Mariana de Jesús de Paredes"
aliases = ["Mariana de Paredes y Flores", "Mariana of Quito", "Lily of Quito", "Azucena de Quito"]
years = "1618–1645"
vocation = "Laywoman and Franciscan tertiary"
place = "Quito, present-day Ecuador"
summary = "The Lily of Quito, remembered for a life of prayer and care for her neighbors during a period of crisis."
biography = [
  "Mariana de Paredes y Flores was born in Quito in 1618 into a family of Spanish origin. She lost her parents while still young and grew up within her extended family. Biographical accounts describe an early interest in prayer and religious life. She spent much of her adult life in her family’s home, where she set aside space and time for devotion.",
  "Mariana received spiritual direction from Jesuit priests and was associated with the Third Order of Saint Francis. She practiced a demanding religious discipline. The Franciscan account also remembers her aiding people in poverty and offering spiritual comfort to others in Quito. Her service took place in the city where she had grown up.",
  "In 1645 Quito suffered an earthquake and an outbreak of disease. According to the tradition of her life, Mariana offered herself in prayer for the people of the city during that crisis. She died that year. Accounts of the offering belong to the history of devotion to her, alongside the record of the disasters and her death.",
  "Mariana became known as the Lily of Quito. Pope Pius XII canonized her in 1950, and his address to the pilgrims who came for the canonization used that title. She was the first person from what is now Ecuador to be canonized.",
]

[[saints.sources]]
title = "Vatican, Pius XII — Address on the Canonization of Mariana de Jesús de Paredes"
url = "https://www.vatican.va/content/pius-xii/es/speeches/1950/documents/hf_p-xii_spe_19500710_mariana-paredes.html"

[[saints.sources]]
title = "Secular Franciscan Order — Mariana’s life and ministry in Quito"
url = "https://ciofs.info/2026/05/01/saint-of-month-mariana-of-jesus-de-paredes-1618-1645/"

[[saints]]
id = "pedro-de-san-jose-de-betancur"
name = "Saint Pedro de San José de Betancur"
aliases = ["Peter of Saint Joseph Betancur", "Pedro de Betancourt", "Peter de Betancurt", "Hermano Pedro", "Brother Pedro"]
years = "1626–1667"
vocation = "Franciscan tertiary and hospital founder"
place = "Tenerife, Canary Islands, and Guatemala"
summary = "Known as Brother Pedro, he established a place for people recovering from illness and a school for children in Guatemala."
biography = [
  "Pedro de Betancur grew up in Vilaflor on Tenerife, where he worked as a shepherd. Around the age of twenty-four, he left for Central America. He passed through Havana and continued to Guatemala with limited money. Illness and his own experience of needing help gave him direct knowledge of the people he would later serve.",
  "Pedro hoped at first to become a priest. He had difficulty with the studies required for ordination and took a different path. He joined the Franciscan Third Order and ministered as a layman. Accounts of his work describe visits to hospitals and prisons and help for people living with little material support.",
  "He founded a house dedicated to Our Lady of Bethlehem where people could continue to recover after hospital care. He also provided lodging for people without shelter and organized a school for children. Men and women joined the work. Religious communities known as the Bethlehemites grew from this foundation.",
  "Pedro died in 1667. Pope John Paul II canonized him in Guatemala City in 2002. The devotion to the child Jesus at Bethlehem that gave his foundation its name also shaped his approach to care. He is remembered in Guatemala as Hermano Pedro, or Brother Pedro.",
]

[[saints.sources]]
title = "Holy See — Biography of Saint Peter de Betancurt"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20020730_betancurt_en.html"

[[saints.sources]]
title = "Franciscan Media — Saint Pedro de San José Betancur"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-pedro-de-san-jose-betancur/"

[[saints]]
id = "juan-macias"
name = "Saint Juan Macías"
aliases = ["John Macias", "Juan Macías of Lima", "John Macías of Lima", "Brother Juan Macías", "Juan de Arcas Sánchez"]
years = "1585–1645"
vocation = "Dominican lay brother"
place = "Extremadura, Spain, and Lima, Peru"
summary = "A Spanish-born Dominican lay brother who found food, supplies, and practical help for people who came to his convent in Lima."
biography = [
  "Juan Macías was born in Ribera del Fresno, in Extremadura, in 1585. He lost his parents while young and worked as a shepherd. Pope Paul VI’s homily at his canonization drew attention to this period, when Juan learned to pray in solitude and began to give part of what he earned to people in need.",
  "As an adult Juan crossed the Atlantic and reached Cartagena. He continued overland to Lima, where he found work with a livestock merchant. He eventually entered the Dominicans as a lay brother at the convent of Saint Mary Magdalene. His community assigned him to serve at its door.",
  "The porter met the people who came to ask the convent for assistance. Juan collected food and supplies with the help of donors around Lima and distributed them to those who came. He also listened to visitors and encouraged their prayer. Dominican accounts connect his work with that of Martin de Porres, who served in a different convent in the same city.",
  "Juan died in Lima in 1645. Pope Paul VI canonized him in 1975. The homily at his canonization connected his ministry as porter to the religious life that sustained it. The responsibilities of that job gave him daily contact with people who had little access to other assistance.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Juan Macías"
url = "https://www.causesanti.va/it/santi-e-beati/juan-macias.html"

[[saints.sources]]
title = "Vatican, Paul VI — Homily at the Canonization of Juan Macías"
url = "https://www.vatican.va/content/paul-vi/es/homilies/1975/documents/hf_p-vi_hom_19750928.html"

[[saints]]
id = "rafael-guizar-y-valencia"
name = "Saint Rafael Guízar y Valencia"
aliases = ["Rafael Guízar Valencia", "Bishop Rafael of Veracruz"]
years = "1878–1938"
vocation = "Bishop and missionary"
place = "Michoacán and Veracruz, Mexico, and Havana, Cuba"
summary = "A Mexican bishop who traveled throughout Veracruz and maintained priestly formation during restrictions on public Catholic ministry."
biography = [
  "Rafael Guízar y Valencia was born in Cotija, Michoacán, in 1878. He studied at the seminary in Zamora and was ordained a priest in 1901. His early work included preaching missions and helping form seminarians. The upheaval of the Mexican Revolution brought periods when he had to carry out his work away from the places he had first served.",
  "Rafael spent time outside Mexico, including in Cuba, where he preached missions. While there he was appointed bishop of Veracruz and consecrated in Havana in 1919. He took possession of his diocese in 1920. He devoted much of his first years as bishop to visiting communities and carrying out sacramental and teaching work throughout the diocese.",
  "The formation of priests remained a priority. Government restrictions disrupted the work of the seminary in Veracruz. Rafael moved the seminary’s work to Mexico City, where it continued in other premises for years. His ministry took place during a conflict that imposed severe limits on public Catholic activity.",
  "Rafael continued in ministry despite worsening health and died in 1938. Pope Benedict XVI canonized him in 2006. He is remembered in Mexico for the distances he traveled as a bishop and for his effort to sustain the education of priests through periods of upheaval.",
]

[[saints.sources]]
title = "Holy See — Biography of Rafael Guízar Valencia"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20061015_valencia_en.html"

[[saints.sources]]
title = "Marians of the Immaculate Conception — Saint Rafael Guízar y Valencia"
url = "https://marian.org/articles/north-american-sanctity-bishop-poor-st-rafael-guizar-y-valencia"
