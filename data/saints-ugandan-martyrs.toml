[[saints]]
id = "matthias-mulumba"
name = "Saint Matthias Mulumba"
aliases = ["Matthias Mulumba Kalemba","Mathias Kalemba Mulumba","Mathias Mulumba","Matia Mulumba"]
years = "c. 1836–1886"
vocation = "Assistant county chief, catechist, and martyr"
place = "Busoga and Buganda, present-day Uganda"
summary = "An assistant county chief and the oldest of the canonized Ugandan martyrs, named alongside Charles Lwanga at their canonization."
biography = [
  "Matthias was born in Bunya, in Busoga, around 1836. The Uganda Martyrs Shrine records that he and his mother were taken into Buganda during a raid. A man named Magatto received him into his household and gave him the clan name Kalemba. As an adult, he held posts as assistant county chief in Bulemeezi and Ssingo.",
  "His duties included supervising work on royal buildings. According to the shrine’s account, he came into contact with Catholic missionaries while overseeing the construction of their early dwellings. The accounts of his life describe a long period of religious inquiry before his baptism. His decision to be baptized also brought changes to his household and to how he provided for his family.",
  "Matthias remained in public service and took on work as a catechist. He helped establish centers for Christian instruction and traveled to teach in the communities he served. His responsibilities reached beyond the young attendants at the royal court. They placed him in contact with people in outlying districts who were also preparing for baptism.",
  "He was arrested in 1886 and died at Old Kampala on May 30. About fifty years old, he was the oldest of the twenty-two Catholic martyrs. The title of Pope Paul VI’s 1964 canonization homily names Matthias Mulumba Kalemba and Charles Lwanga before referring to their twenty companions.",
]

[[saints.sources]]
title = "Uganda Martyrs Shrine, Namugongo — The saints of Uganda, Matthias Mulumba"
url = "https://www.ugandamartyrsshrine.org.ug/index.php/about-the-martyrs/saints"

[[saints.sources]]
