[[saints]]
id = "james-buuzaabalyaawo"
name = "Saint James Buuzaabalyaawo"
aliases = ["James Buuzaabalyawo","James Buuzabalyawo","James Buzabaliawo"]
years = "Died 1886"
vocation = "Royal guard, catechist, and martyr"
place = "Kingdom of Buganda, present-day Uganda"
summary = "A member of Buganda’s royal guard and band who helped teach the Christian faith before his death at Namugongo."
biography = [
  "James grew up in a household connected to the court of Kabaka Muteesa I. He entered royal service as a page, later joined the guard, and played in the band led by Andrew Kaggwa. The court thus brought James into contact with a man who became both his teacher and his colleague in Christian instruction.",
  "Kaggwa helped prepare James to teach other people as an assistant catechist. Among those James tried to instruct was the young prince Mwanga, before he became king. The surviving accounts remember James as quick-witted in ordinary company and willing to speak about his faith even when his listener held a higher position in the household.",
  "After Mwanga came to power, his attitude toward Christians at court changed. During the persecution of 1886, James was arrested and questioned by the king. According to the account in Notre Dame’s Church Life Journal, he openly identified himself as a Christian when asked whether he led the group. The king remembered their earlier conversations and ordered him put to death.",
  "James was taken with the other prisoners to Namugongo and killed there on June 3, 1886. The Kampala Archdiocese includes him in its roster of the twenty-two Catholic martyrs canonized by Pope Paul VI in 1964. His activities in the guard, band, and catechism circle show how closely the lives of many of the martyrs were connected before their arrests.",
]

[[saints.sources]]
title = "Kampala Archdiocese — The twenty-two Catholic martyrs of Uganda"
url = "https://www.kampalarchdiocese.org/the-account-of-the-twenty-two-catholic-uganda-martyrs-a-history-of-faith-and-sacrifice/"

[[saints.sources]]
