[[saints]]
id = "denis-ssebuggwawo"
name = "Saint Denis Ssebuggwawo"
aliases = ["Denis Ssebuggwaawo","Denis Ssebugwawo"]
years = "c. 1870–1886"
vocation = "Royal page, catechist, and martyr"
place = "Lukumbi and Munyonyo, Kingdom of Buganda"
summary = "A teenage page who taught the Christian faith at the court of Buganda and was killed during the persecution of 1886."
biography = [
  "Denis was born around 1870 at Lukumbi in Bulemeezi County, in the Kingdom of Buganda. He and his twin brother entered royal service as teenagers and were assigned to the private part of the court of Kabaka Mwanga II. The Uganda Martyrs Shrine remembers Denis as a musician with a distinctive singing voice.",
  "The brothers received Christian instruction from Joseph Mukasa Balikuddembe, one of the Catholic leaders among the court attendants. Joseph’s execution in November 1885 prompted several pages to ask for baptism. Denis was among them. He stayed in royal service and continued sharing what he had learned, particularly with a fellow page named Mwafu.",
  "In May 1886 Mwanga confronted Denis about teaching Mwafu the Christian faith. Accounts agree that Denis acknowledged what he had done and that the king attacked him. The Kampala Archdiocese dates his death to May 25. The local shrine’s account places the attack on that date and his execution at Munyonyo the following day.",
  "The persecution soon reached many other members of the court. Denis is among the twenty-two Catholic martyrs whom Pope Paul VI canonized in 1964. His part in the group’s story preserves the work of the young pages as catechists, a responsibility they shared through ordinary friendships within the court.",
]

[[saints.sources]]
title = "Uganda Martyrs Shrine, Namugongo — The saints of Uganda, Denis Ssebuggwaawo"
