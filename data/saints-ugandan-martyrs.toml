url = "https://www.vatican.va/content/paul-vi/la/homilies/1964/documents/hf_p-vi_hom_19641018_martiri-uganda.html"

[[saints]]
id = "bruno-sserunkuuma"
name = "Saint Bruno Sserunkuuma"
aliases = ["Bruno Sserunkuma","Bruno Serunkuuma","Bruno Sserunkuuma of Buganda"]
years = "Died 1886"
vocation = "Royal guard and martyr"
place = "Buddu and Namugongo, Kingdom of Buganda"
summary = "A royal guard who declared his Christian faith when others at the court of Buganda were being arrested."
biography = [
  "Bruno came from Buddu and began serving Kabaka Muteesa I as a page. The Uganda Martyrs Shrine describes him as a gatekeeper by 1876. He later served as a royal guard. His work placed him among the attendants and officials who carried out the king’s orders in and around the court.",
  "Bruno encountered Christianity through the circle of Joseph Mukasa Balikuddembe and received baptism in 1885. Accounts describe how his responsibilities at court and his conduct challenged the commitments he had made. Christian friends, including Charles Lwanga and Andrew Kaggwa, urged him to change. He withdrew for periods of prayer while continuing to serve the court, and became known for teaching and works of mercy.",
  "When Mwanga had other Christians in the royal household summoned, Bruno was on duty. According to the individual account published by Notre Dame’s Church Life Journal, he stepped forward and identified himself as Christian even though he had not been called. He was arrested with those who refused to renounce their faith.",
  "On the journey to Namugongo he encouraged younger prisoners. He was killed there on June 3, 1886. Pope Paul VI canonized him with Charles Lwanga and the other Catholic martyrs in 1964. The remembered sequence of his life includes support he received from other Christians and the encouragement he in turn offered them.",
]

