[[saints]]
id = "andrew-kaggwa"
name = "Saint Andrew Kaggwa"
aliases = ["Andrew Kagwa","Andrew Kaggwa of Buganda"]
years = "c. 1856–1886"
vocation = "Royal bandmaster, catechist, and martyr"
place = "Bunyoro and Buganda, present-day Uganda"
summary = "The royal bandmaster of Buganda, whose household became a place of Christian instruction before his death at Munyonyo."
biography = [
  "Andrew grew up in Bunyoro. According to the Uganda Martyrs Shrine, raiders took him from his home district and brought him into Buganda, where he entered the service of Kabaka Muteesa I as a page. He learned to play instruments used at court and eventually became a master drummer and leader of the royal band.",
  "His work brought him close to the royal household, including the future Kabaka Mwanga II. Andrew met Catholic missionaries and enrolled for instruction in 1880. He was baptized two years later. He married Clare Batudde, and their home became a place where people could receive instruction in the faith.",
  "He taught other people in royal service, including James Buuzaabalyaawo, who became an assistant catechist. Accounts also remember Andrew caring for the sick during an outbreak of plague and baptizing people in danger of death while the missionaries were away. He continued to hold responsibility at court after Mwanga became king.",
  "During the persecution of 1886, a senior official pressed for Andrew’s death. He was executed at Munyonyo on May 26. Pope Paul VI canonized him with the other Catholic martyrs of Uganda in 1964. The sources remember a musician whose place at court gave him responsibilities in public life and opportunities to teach other members of the household.",
]

