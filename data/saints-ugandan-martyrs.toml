url = "https://churchlifejournal.nd.edu/articles/the-ugandan-martyrs/"

[[saints]]
id = "mbaga-tuzinde"
name = "Saint Mbaga Tuzinde"
aliases = ["Mbaaga Tuzinde","Mbaga of Buganda","Mbaaga of Uganda"]
years = "c. 1869–1886"
vocation = "Royal page and martyr"
place = "Ruyonga and Namugongo, Kingdom of Buganda"
summary = "A page whose family tried to spare his life after he declared himself Christian during the persecution in Buganda."
biography = [
  "Mbaga grew up in Ruyonga, in Busiro County. He entered the service of Kabaka Mwanga II and took care of food for visitors in the audience hall. He also carried items for the king on journeys by canoe. The Uganda Martyrs Shrine describes a longstanding bond between his family and the household of Mukaajanga, the chief executioner, who treated him as a son.",
  "When Mwanga ordered Christian attendants to identify themselves in May 1886, Mbaga joined them. Mukaajanga urged him to step away and offered to hide him if he renounced his faith. Mbaga remained with the Christians. Charles Lwanga baptized him during the persecution, along with others who had been preparing to enter the Church.",
  "Mukaajanga arranged for relatives to see Mbaga and persuade him to change his mind. He continued to identify himself as Christian through several days of appeals. He was killed at Namugongo on June 3, 1886, at about seventeen. The accounts remember both his refusal and the grief of the man who had tried to save him.",
  "Pope Paul VI canonized Mbaga in 1964 among the twenty-two Catholic martyrs of Uganda. The group’s memorial includes the teenagers who served at court as well as older people who held positions of authority there. Mbaga’s account shows how the persecution reached into families and households that were themselves bound to the king’s service.",
]

