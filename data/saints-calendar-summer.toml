[[saints]]
id = "marcellinus-of-rome"
name = "Saint Marcellinus of Rome"
aliases = ["Marcellinus the Priest", "Marcellinus and Peter"]
years = "Died c. 304"
vocation = "Priest and martyr"
place = "Rome, Italy"
summary = "A Roman priest executed with Peter the Exorcist during the persecution under Diocletian."
biography = [
  "Little is known about Marcellinus before his imprisonment. The Church remembers him as a priest of Rome who died with Peter, an exorcist, during the early fourth-century persecutions.",
  "Pope Damasus later composed an epitaph for the pair, drawing on a report attributed to their executioner. Their names also entered the Roman Canon, now known as Eucharistic Prayer I.",
]

