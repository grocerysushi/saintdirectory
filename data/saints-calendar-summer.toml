[[saints]]
id = "marcellinus-of-rome"
name = "Saint Marcellinus of Rome"
aliases = ["Marcellinus the Priest", "Marcellinus and Peter"]
years = "Died c. 304"
vocation = "Priest and martyr"
place = "Rome, Italy"
summary = "A Roman priest executed with Peter the Exorcist during the persecution under Diocletian."
biography = [
  "Marcellinus was a priest of the Church of Rome around the beginning of the fourth century. The surviving accounts begin with his imprisonment during the persecution under Diocletian. An imperial order directed against Christian ministers brought bishops, priests, and deacons before Roman authorities. Tradition places Marcellinus in prison with Peter, an exorcist of the same community.",
  "Pope Damasus, who lived several decades later, composed an epitaph that described the men being taken to an isolated place for execution. He attributed the account to someone involved in their deaths. Later stories add conversions and healings in the prison. These details belong to the saints’ remembered life in the Church, and their historical circumstances are difficult to establish.",
  "The burial place on the Via Labicana became a center of veneration. A basilica rose above their burial crypt, and their names were included together in the Roman Canon, preserved today as Eucharistic Prayer I. The inscription, burial site, and liturgical remembrance explain how a priest whose personal history is mostly unknown remained part of Rome’s Christian memory.",
]

[[saints.sources]]
title = "Vatican News — Saints Marcellinus and Peter"
url = "https://www.vaticannews.va/en/saints/06/02/sts--marcellinus--priest--and-peter--exorcist--martyrs-on-the-vi.html"

[[saints.sources]]
title = "Franciscan Media — Saints Marcellinus and Peter"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-marcellinus-and-peter/"

[[saints]]
id = "peter-the-exorcist"
name = "Saint Peter the Exorcist"
aliases = ["Peter of Rome", "Peter the Martyr of Rome", "Marcellinus and Peter"]
years = "Died c. 304"
vocation = "Exorcist and martyr"
place = "Rome, Italy"
summary = "An exorcist of the Roman Church remembered alongside the priest Marcellinus."
biography = [
  "Peter is known from the early memory of the Roman Church as an exorcist. In that period the term designated a recognized ministry in the Christian community. The sources preserve his title and his association with Marcellinus, a priest. Peter’s family, origins, and the details of his ordinary duties are unknown.",
  "The two men died during Diocletian’s persecution, traditionally dated around 304. Pope Damasus later commemorated them in verse and attributed his information about their execution to a person who had taken part. The wider account tells how a woman named Lucilla recovered their bodies and arranged a new burial. The names and places were carried forward in Roman tradition.",
  "Their tomb on the Via Labicana gave its name to a complex of catacombs. The Church also remembered them side by side in the Roman Canon. In both the burial tradition and the liturgy, Peter’s ministry remained identifiable alongside that of his companion, despite the scarcity of individual records.",
]

[[saints.sources]]
title = "Vatican News — Saints Marcellinus and Peter"
url = "https://www.vaticannews.va/en/saints/06/02/sts--marcellinus--priest--and-peter--exorcist--martyrs-on-the-vi.html"

[[saints.sources]]
title = "Franciscan Media — Saints Marcellinus and Peter"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-marcellinus-and-peter/"

[[saints]]
id = "boniface"
name = "Saint Boniface"
aliases = ["Boniface of Mainz", "Winfrid", "Wynfrith", "Apostle to the Germans"]
years = "c. 675–754"
vocation = "Benedictine missionary, bishop, and martyr"
place = "England, German lands, and Frisia"
summary = "An English Benedictine who helped organize the Church in the German lands and died on a mission to Frisia."
biography = [
  "Boniface was born in Anglo-Saxon Wessex around 675 and was baptized Winfrid. He entered monastic life while young and became a priest after years of study. He taught Latin grammar and wrote in Latin before turning to overseas missions. His first attempt to preach in Frisia, in 716, met opposition from a local ruler, and he returned to England.",
  "He sought guidance in Rome in 718. Pope Gregory II gave him the name Boniface and commissioned him to preach among the peoples of the German lands. The pope later consecrated him as a regional bishop. Papal backing and cooperation with Frankish leaders gave him room to establish churches, organize dioceses, and hold councils that addressed problems in clerical life and governance.",
  "Boniface asked monasteries in England to send men and women who could help. Their communities extended his work by providing places for prayer, education, and the training of missionaries. The monastery of Fulda became a major center. His surviving correspondence shows how much the mission depended on keeping ties with its supporters and coordinating work over great distances.",
  "Late in life he returned to Frisia, where he and members of his party were killed in 754 as they prepared to meet converts. His body was later taken to Fulda. Christian communities in several countries remember him both for his missionary work and for the institutions that continued it after his death.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Boniface"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-boniface/"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Boniface"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2009/documents/hf_ben-xvi_aud_20090311.html"

[[saints]]
id = "norbert-of-xanten"
name = "Saint Norbert of Xanten"
aliases = ["Norbert", "Norbert of Magdeburg", "Norbert of Prémontré"]
years = "c. 1080–1134"
vocation = "Archbishop and founder of the Premonstratensians"
place = "Prémontré, France, and Magdeburg, Germany"
summary = "The founder of the Norbertines, whose common life joined prayer to service in local churches."
biography = [
  "Norbert founded a community at Prémontré in twelfth-century France. It became the center of the order known as the Premonstratensians, or Norbertines. The community gave its members a household and a schedule of prayer in common while allowing them to undertake ministry beyond the house.",
  "Devotion to the Eucharist stood at the center of Norbert’s preaching. He wanted people whose religious practice had grown weak to take it seriously again. Eucharistic teaching was also disputed in his time, and he took part in those debates as a preacher. He worked to reconcile people in conflict, making pastoral care a substantial part of his followers’ work.",
  "The order’s form of life put the demands of common prayer and parish work side by side. Some of its members lived at a central house during the week and served local parishes on weekends. That pattern gave them the support of a community while giving smaller churches access to regular pastoral care.",
  "Norbert later became archbishop of Magdeburg, east of many of the communities shaped by his early work. He continued preaching and reform there until his death in 1134. The order carries the name of its first house as well as the name of its founder, reflecting the importance of the community as a home for the work he began.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Norbert"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-norbert/"

[[saints]]
id = "romuald"
name = "Saint Romuald"
aliases = ["Romuald of Ravenna", "Romuald of Camaldoli"]
years = "c. 950–1027"
vocation = "Benedictine monk and monastic founder"
place = "Ravenna and Camaldoli, Italy"
summary = "A monk whose foundations helped shape the Camaldolese tradition of communal and solitary prayer."
biography = [
  "Romuald came from the region of Ravenna and entered a monastery nearby. His early life is known chiefly from religious biography, which places his turn toward monastic life after a violent dispute in his family. He eventually left that first house and spent years moving between monasteries and hermitages in Italy.",
  "During those journeys Romuald helped establish and reform communities. A monastery gave its members a common rule, shared worship, and regular work. A hermitage placed a greater part of the day under the responsibility of the individual monk, who prayed and worked in seclusion. Romuald encouraged forms of life in which both practices could support sustained attention to God.",
  "Camaldoli in Tuscany became the most enduring of the sites associated with him. It developed a Benedictine community with room for the more solitary vocation of the hermit. The Camaldolese tradition takes its name from Camaldoli, and its combination of community and solitude is still the feature most closely associated with Romuald’s work.",
  "His interest extended beyond Italy. A biographical account says he sought permission to preach in Hungary, but illness prevented him from continuing. He died in 1027 after decades of monastic work. The communities associated with his name carried forward a pattern he had tested repeatedly in his own life.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Romuald"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-romuald/"

[[saints]]
id = "aloysius-gonzaga"
name = "Saint Aloysius Gonzaga"
aliases = ["Luigi Gonzaga", "Aloysius of Gonzaga"]
years = "1568–1591"
vocation = "Jesuit religious"
place = "Castiglione delle Stiviere and Rome, Italy"
summary = "A young Jesuit who gave up his inheritance and cared for patients during an epidemic in Rome."
biography = [
  "Aloysius was born in 1568 into a branch of the Gonzaga family. As the eldest son he was expected to inherit a title, and his father anticipated a military career for him. Life in a noble household also exposed him to the expectations of the Italian courts. Aloysius committed himself to prayer and eventually asked to enter the Society of Jesus.",
  "His decision met strong resistance at home because it meant giving up the rights of the heir. He ultimately renounced his claim and entered the Jesuits. His training joined prayer, study, and preparation for priesthood. The ordinary obligations of community life became part of a vocation he had previously tried to pursue largely by himself.",
  "When epidemic disease struck Rome in 1591, the Jesuits opened a hospital and assigned members of their community to help. Aloysius took on nursing tasks such as washing patients and making their beds. He became ill himself. After the initial illness, a persistent fever left him too weak to continue his normal routine.",
  "Aloysius died in June 1591, aged twenty-three, while still preparing for priesthood. His remembered life brings together two decisions separated by only a few years. As a young heir he left a career arranged for him, and as a Jesuit he accepted practical care for sick people as part of the vocation he had chosen.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Aloysius Gonzaga"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-aloysius-gonzaga/"

[[saints]]
id = "paulinus-of-nola"
name = "Saint Paulinus of Nola"
aliases = ["Paulinus of Bordeaux", "Paulinus, Bishop of Nola"]
years = "c. 354–431"
vocation = "Bishop, poet, and letter writer"
place = "Bordeaux, Roman Gaul, and Nola, Italy"
summary = "A Roman public official who embraced a life of prayer and charity and became bishop of Nola."
biography = [
  "Paulinus was born near Bordeaux into a wealthy Roman family. The poet Ausonius taught him, and he acquired the literary education expected of someone entering public life. He became governor of Campania while still young. The steady traffic of pilgrims to the nearby shrine of Saint Felix caught his attention, and he used his office to improve access and provide lodging for poor visitors.",
  "Paulinus was baptized in Bordeaux and married Therasia, a Christian from Spain. After the death of their infant son, the couple agreed to give much of their property to people in need and to adopt a more austere way of life. Paulinus was ordained a priest in Barcelona. He and Therasia later settled beside the shrine of Felix at Nola, where a community grew around their household.",
  "Care for pilgrims and other visitors was a regular part of the community’s work. Paulinus eventually became bishop of Nola, around 409. He contributed to the shrine as its bishop and as a writer. In an expanded basilica he used paintings and captions to teach visitors biblical stories, providing a form of instruction people could follow as they moved through the building.",
  "His literary work continued through his years of ministry. Some surviving poems were written for the annual celebration of Saint Felix, and his correspondence connects him with figures such as Augustine of Hippo. Together, these texts show how patronage, hospitality, poetry, and preaching could all form part of a bishop’s work in the later Roman Empire.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Paulinus of Nola"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-paulinus-of-nola/"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Paulinus of Nola"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20071212.html"

[[saints]]
id = "anthony-mary-zaccaria"
name = "Saint Anthony Mary Zaccaria"
aliases = ["Antonio Maria Zaccaria", "Anthony Zaccaria"]
years = "1502–1539"
vocation = "Priest, physician, and founder"
place = "Cremona and Milan, Italy"
summary = "A physician who became a priest and helped found the Barnabites during the Catholic reform of Italy."
biography = [
  "Antonio Maria Zaccaria was born in Cremona in 1502. He studied medicine and returned home to practice. The later Barnabite account treats those years as part of his religious formation, since his medical work gave him a practical way to serve people he would eventually know as a priest. He received priestly ordination at Cremona Cathedral in 1529.",
  "His work took him to Milan and into contact with people seeking reform of Catholic life. He and his collaborators formed the Clerics Regular of Saint Paul, a community of priests. They acquired the name Barnabites through their association with the church of Saint Barnabas in Milan. Their work included preaching and instruction as well as the discipline of a shared life.",
  "Zaccaria helped form two related communities, the Angelic Sisters of Saint Paul and a group for lay people. Each had a different place in the project. Using the life and letters of Saint Paul as a common reference, the groups sought to carry their commitments into households and neighborhoods as well as religious houses.",
  "He also encouraged public Eucharistic prayer, especially the devotion known as the Forty Hours. Zaccaria died in Cremona in 1539, while the communities he had helped establish were still young. His order continued that work, and in 1897 the Church canonized him.",
]

[[saints.sources]]
title = "Barnabite Fathers — Life of Saint Anthony Mary Zaccaria"
url = "https://www.barnabites.com/life/"

[[saints]]
id = "maria-goretti"
name = "Saint Maria Goretti"
aliases = ["Maria Goretti", "Mary Goretti"]
years = "1890–1902"
vocation = "Virgin and martyr"
place = "Corinaldo and Nettuno, Italy"
summary = "An eleven-year-old Italian girl remembered as a martyr and for the forgiveness she expressed before her death."
biography = [
  "Maria Goretti was born in Italy in 1890 into a family that earned its living through farm work. She grew up with little opportunity for schooling. Household responsibilities took much of her time. Her First Communion, which came shortly before her death, was a milestone the people who later told her story remembered distinctly.",
  "In July 1902, when Maria was eleven, a young man named Alessandro Serenelli attempted to sexually assault her. He stabbed her when she resisted. Maria was taken to a hospital and died about a day later. Accounts of her final hours record her concern for her mother and her decision to forgive Serenelli before she died.",
  "Her family lived to see the Church publicly recognize her as a martyr. When Pope Pius XII beatified her in 1947, her mother and several siblings took part in the events in Rome. Her canonization followed in 1950, drawing a large crowd to Saint Peter’s. Serenelli, who had served a prison sentence for the killing, was among those present.",
  "The accounts of Maria’s youth were preserved through the testimony of people who had known her and through the process of her beatification and canonization. Her own recorded words are few. The decision she made in the hospital, to forgive despite what she had suffered, became central to her remembrance.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Maria Goretti"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-maria-goretti/"

[[saints]]
id = "augustine-zhao-rong"
name = "Saint Augustine Zhao Rong"
aliases = ["Augustine Zhao", "Agostino Zhao Rong", "Zhao Rong"]
years = "Died 1815"
vocation = "Diocesan priest and martyr"
place = "China"
summary = "A former soldier who became a Chinese diocesan priest and died in custody during the Qing period."
biography = [
  "Augustine Zhao Rong served as a soldier before his baptism. In the account prepared by the Holy See for his canonization, he encountered Bishop John Gabriel Taurin Dufresse while assigned to escort him. Dufresse’s conduct made an impression on Zhao, who asked to begin preparing for baptism. He later attended a seminary and was ordained a Chinese diocesan priest.",
  "His ministry took place during the Qing dynasty, in a period when the court imposed new restrictions on Catholic life. The Holy See’s account describes orders directed at men preparing for priesthood and priests who continued to preach. Zhao Rong was one of the Christians arrested in the ensuing persecution. He died after ill treatment while in custody in 1815.",
  "John Paul II canonized Zhao Rong and 119 companions on October 1, 2000. The title of the group gathers people whose lives and deaths span nearly three centuries. They include Chinese clergy, catechists, families, and other laypeople, alongside priests and religious who came to China from abroad.",
  "Zhao Rong’s name gives the group a named point of reference in the Roman calendar. The details of his life also point to a particular history within that larger remembrance. His path from military service to diocesan ministry unfolded through encounters in China itself and belongs to the history of Chinese Catholic communities.",
]

[[saints.sources]]
title = "Holy See — Augustine Zhao Rong and 119 companions, martyrs in China"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20001001_zhao-rong-compagni_en.html"

[[saints.sources]]
title = "Franciscan Media — Saint Augustine Zhao Rong and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-augustine-zhao-rong-and-companions/"

[[saints]]
id = "henry-ii"
name = "Saint Henry II"
aliases = ["Henry II, Holy Roman Emperor", "Henry of Bavaria", "Heinrich II"]
years = "c. 973–1024"
vocation = "Holy Roman emperor"
place = "Bavaria and the Holy Roman Empire"
summary = "A ruler of the Holy Roman Empire who supported the reform and development of churches and monasteries."
biography = [
  "Henry was born into Bavaria’s ruling family around 973 and spent part of his youth under the care of churchmen while his father was in exile. He received an education connected to the cathedral school at Hildesheim. He became duke of Bavaria in the 990s. When Otto III died in 1002, Henry had to secure the support of other German rulers before he could establish himself as king.",
  "The kingdom required the ruler to travel continually, hearing disputes and asserting royal power in different regions. Henry also intervened in Italy, where his authority was contested. In 1014 Pope Benedict VIII crowned him emperor in Rome. Relations with the papacy formed an important part of his rule, alongside the ordinary work of maintaining alliances and dealing with rivals.",
  "Henry drew bishops into royal administration and used public authority to support church institutions. A lasting example was the bishopric of Bamberg, which he endowed from his own property and secured through an agreement with the bishops at Frankfurt in 1007. Bamberg’s cathedral, learning, and arts benefited from the support of Henry and his wife, Cunigunde.",
  "He continued discussing church reform with Benedict VIII late in his life, though he died in 1024 before their planned council at Pavia could take place. Pope Eugene III canonized Henry in 1146. Henry’s career shows how closely the responsibilities of a medieval ruler could intersect with the appointment of bishops, patronage of religious life, and the government of the Church.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Henry"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-henry/"

[[saints.sources]]
title = "Encyclopaedia Britannica — Henry II, Holy Roman emperor"
url = "https://www.britannica.com/biography/Henry-II-Holy-Roman-emperor"

[[saints]]
id = "apollinaris-of-ravenna"
name = "Saint Apollinaris of Ravenna"
aliases = ["Apollinaris", "Apollinaris of Classe", "Apollinare"]
years = "Early Christian era, dates uncertain"
vocation = "Bishop and martyr"
place = "Ravenna and Classe, Italy"
summary = "An early bishop honored as a martyr and traditionally remembered as Ravenna’s first bishop."
biography = [
  "Apollinaris is venerated as an early bishop and martyr associated with Ravenna. Later tradition counts him as the city’s first bishop and says that Saint Peter sent him there. The age of the cult is easier to establish than the chronology in those stories. His lifetime and the circumstances of his death remain uncertain.",
  "In the traditional narrative, Apollinaris preached in Ravenna, was driven away, and returned more than once. Accounts place his death in the area of Classe, Ravenna’s ancient port. These details belong to the received story through which later Christians remembered their beginnings.",
  "The basilica in Classe dedicated to him was built in the sixth century. Its presence gives a concrete sense of the place Apollinaris occupied in the life of the local Church long after the events described in his biography. Later generations knew him both as the saint of a particular place and as a figure in Ravenna’s account of its first bishops.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Apollinaris"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-apollinaris/"

[[saints]]
id = "sharbel-makhluf"
name = "Saint Sharbel Makhluf"
aliases = ["Charbel Makhlouf", "Sharbel Makhlūf", "Youssef Antoun Makhlouf"]
years = "1828–1898"
vocation = "Maronite priest, monk, and hermit"
place = "Bekaa Kafra and Annaya, Lebanon"
summary = "A Lebanese Maronite monk who spent his later years in prayer and solitude at the hermitage in Annaya."
biography = [
  "Sharbel was born in 1828 in a mountain village in Lebanon. He entered the Lebanese Maronite Order in 1851 and took his vows at the monastery of Saint Maron at Annaya. He was ordained a priest in 1859. His vocation developed within the Maronite Catholic tradition, which has its own liturgical and monastic life.",
  "For years after ordination he lived with the other monks. Their shared life established the pattern of work, worship, and obedience from which his later vocation grew. He eventually moved to the nearby hermitage and spent twenty-three years there. The hermitage provided space for sustained solitude while keeping him connected to the monastery.",
  "He died at Annaya on Christmas Eve in 1898. Devotion to him spread after his death, and people began visiting the site of his burial. Reports of healings attributed to his intercession helped draw pilgrims beyond his immediate community. Pope Paul VI beatified him in 1965 and canonized him in 1977.",
  "The monastery and hermitage remain associated with his life. In an interview with Vatican News, a monk at Annaya described how his tomb draws visitors across different religious communities in Lebanon. That shared place of pilgrimage carries forward the memory of a man whose life was spent largely in one small monastic setting.",
]

[[saints.sources]]
title = "Vatican News — Saint Charbel Makhlouf and the monastery at Annaya"
url = "https://www.vaticannews.va/en/church/news/2025-11/pope-leo-xiv-lebanon-saint-charbel-monastery-annaya.html"

[[saints]]
id = "peter-chrysologus"
name = "Saint Peter Chrysologus"
aliases = ["Peter of Ravenna", "Peter of Imola", "Peter of the Golden Words"]
years = "Died c. 450"
vocation = "Bishop and Doctor of the Church"
place = "Imola and Ravenna, Italy"
summary = "A bishop of Ravenna known for the short sermons that earned him the name Chrysologus."
biography = [
  "Peter came from Imola and became bishop of Ravenna around 433, when the city was an imperial capital in the West. The court’s presence gave the local church unusual prominence. Peter promoted the building of churches with support from Galla Placidia, mother of the emperor Valentinian III, while attending to the teaching of his own congregation.",
  "Many of his short sermons survive. They explain central Christian teachings in language suited to the needs of worshipers and connect those teachings to everyday duties. The sermons also offer a view of preaching in fifth-century Ravenna. Later readers referred to him as Chrysologus, a name that describes his eloquence and is often translated as golden orator.",
  "Peter also took part by correspondence in the disputes of the wider Church. When the monk Eutyches appealed to him after a controversy about the nature of Christ, Peter directed him to heed Pope Leo. The surviving letter places a bishop best remembered for his local preaching in the midst of a debate involving churches in both East and West.",
  "Peter died around 450, after returning to Imola. The tradition of reading his sermons continued, though some pieces in the collected works are of disputed authorship. In 1729 Benedict XIII declared him a Doctor of the Church, recognizing the value of the teaching preserved in his authentic work.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Peter Chrysologus"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-peter-chrysologus/"

[[saints.sources]]
title = "Encyclopaedia Britannica — Saint Peter Chrysologus"
url = "https://www.britannica.com/biography/Saint-Peter-Chrysologus"

[[saints]]
id = "eusebius-of-vercelli"
name = "Saint Eusebius of Vercelli"
aliases = ["Eusebius, Bishop of Vercelli", "Eusebio di Vercelli"]
years = "c. 300–371"
vocation = "Bishop"
place = "Sardinia and Vercelli, Italy"
summary = "A fourth-century bishop who lived in community with his clergy and defended the Nicene faith in exile."
biography = [
  "Eusebius was born in Sardinia near the beginning of the fourth century. He served as a lector in Rome before becoming bishop of Vercelli around 345. He brought his clergy together in a household shaped by the practices of monastic life. Its members shared prayer and other obligations while serving the Christian communities of the region.",
  "As bishop he defended the profession of Christ’s full divinity articulated at Nicaea. When the bishops met at Milan in 355, Emperor Constantius II pressed for the condemnation of Athanasius of Alexandria, a leading defender of Nicaea. Eusebius withheld his consent and was sent into exile. His enforced absence took him first to Scythopolis, in Palestine, and later to other parts of the eastern empire.",
  "One of his surviving letters from Scythopolis addresses the Christians of Vercelli, Novara, Ivrea, and Tortona. The letter shows that communities beyond his episcopal city already had an identity of their own, and that he still understood himself to have duties toward them while separated from them. He also formed a small religious community in exile.",
  "He was able to return after Constantius died. Eusebius took part in the Council of Alexandria in 362 and eventually resumed his ministry in Vercelli, where he died in 371. His work continued to influence northern Italian bishops, for whom the common life of their clergy could be a means of formation as well as a practical way to share responsibility.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Eusebius of Vercelli"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-eusebius-of-vercelli/"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Eusebius of Vercelli"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20071017.html"

[[saints]]
id = "peter-julian-eymard"
name = "Saint Peter Julian Eymard"
aliases = ["Pierre-Julien Eymard", "Peter-Julian Eymard"]
years = "1811–1868"
vocation = "Priest and founder of Eucharistic congregations"
place = "La Mure and Paris, France"
summary = "A French priest who founded communities devoted to prayer before the Eucharist and its place in ordinary Christian life."
biography = [
  "Peter Julian Eymard was born in 1811 in La Mure, in southeastern France. He was ordained a priest for the Diocese of Grenoble in 1834, then entered the Marists in 1839. His work with the Marists took him beyond his first diocesan assignments and eventually included responsibility for other members of the community.",
  "He often preached during parish celebrations of the Forty Hours, an extended period of prayer before the Eucharist. This experience helped shape his decision to start a community devoted to Eucharistic life. He came to emphasize that sustained prayer before the Eucharist should draw people into a closer relationship with Christ and encourage more active participation in the life of the Church.",
  "In 1856 he founded the Congregation of the Blessed Sacrament. Its members combined periods of prayer with practical work directed toward that purpose. He helped build a women’s community as well. With Marguerite Guillot he founded the Servants of the Blessed Sacrament, whose name preserves the same focus.",
  "Obtaining approval for his work took time, and Eymard faced illness and financial difficulty during the years when the communities developed. He died in 1868. Pope John XXIII canonized him in 1962, just after the first session of the Second Vatican Council.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Peter Julian Eymard"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-peter-julian-eymard/"

[[saints]]
id = "john-vianney"
name = "Saint John Vianney"
aliases = ["Jean-Marie Vianney", "Curé of Ars", "Curé d’Ars"]
years = "1786–1859"
vocation = "Parish priest and confessor"
place = "Dardilly and Ars-sur-Formans, France"
summary = "The parish priest of Ars, whose ministry in the confessional drew visitors from across France."
biography = [
  "John Mary Vianney was born into a farming family in Dardilly in 1786. He worked on the land as a boy and had little opportunity for formal education. When he sought the priesthood, the academic demands of his training, particularly study through Latin, presented a serious obstacle. Encouragement and private instruction helped him persist, and he was ordained in 1815.",
  "He became the priest of Ars, a small village where he tried to rebuild habits of worship and religious instruction after years of upheaval in France. Celebrating Mass and praying before the Eucharist were central to his daily work. He also preached to people whose lives and concerns he knew through the parish.",
  "Word spread about his ministry in the confessional, and visitors came to Ars to speak with him. He devoted long hours to hearing confessions and giving spiritual counsel. With two women from the community, Catherine Lassagne and Benedicta Lardet, he also helped establish La Providence, a home for girls.",
  "Vianney died in Ars in 1859 after decades of parish ministry. Pope Pius XI canonized him in 1925, and he is honored as a patron of parish priests. His association with Ars is so strong that his traditional title simply names his role there, the Curé d’Ars or parish priest of Ars.",
]
patronage = ["Patron of parish priests"]

