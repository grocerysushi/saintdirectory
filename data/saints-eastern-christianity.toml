[[saints]]
id = "marie-alphonsine-danil-ghattas"
name = "Saint Marie-Alphonsine Danil Ghattas"
aliases = ["Marie-Alphonsine Ghattas", "Mary Alphonsine Danil Ghattas", "Maria Alfonsina Danil Ghattas", "Sultaneh Maria Ghattas", "Mother Alphonsine", "Sultana Maria Danil Ghattas"]
years = "1843–1927"
vocation = "Religious sister and co-founder"
place = "Jerusalem and the Holy Land"
summary = "A Jerusalem-born religious sister who helped establish the Sisters of the Rosary for education and pastoral service."
biography = [
  "Marie-Alphonsine was born in Jerusalem in 1843 and entered the Sisters of Saint Joseph of the Apparition as a young woman. She taught girls and worked in Christian communities in the Holy Land. Her early ministry gave her practical experience of education and the needs of families in the places where she served.",
  "In writings later preserved by her congregation, Marie-Alphonsine describes experiences of prayer that she understood as a call from Mary to establish a new institute. With the priest Joseph Tannous and other women, she took part in founding the Sisters of the Rosary. The young community drew its members from Arabic-speaking Christian families.",
  "The sisters undertook teaching and pastoral work where local communities needed it. Marie-Alphonsine served in several houses and helped develop a form of common life that could sustain that work. Her own tradition emphasized prayer of the rosary, which gave the institute both its name and a shared devotion.",
  "She died in 1927 at Ein Karem, near Jerusalem. Francis canonized her on May 17, 2015, alongside Mariam Baouardy and two other women. The congregation she helped form is commonly called the Rosary Sisters. Its history preserves Marie-Alphonsine’s connection with Arabic-speaking Christians and with the communities where she spent her religious life.",
]

[[saints.sources]]
title = "Latin Patriarchate of Jerusalem — Feast of Saint Marie-Alphonsine in Jerusalem"
url = "https://www.lpj.org/en/news/feast-of-st-marie-alphonsine-in-jerusalem-a-model-of-humility-and"

[[saints.sources]]
title = "University of Notre Dame — Mother Marie Alphonsine Danil Ghattas"
url = "https://ace.nd.edu/news/moments-multicultural-saints-mother-marie-alphonsine-danil-ghattas"

[[saints.sources]]
title = "Francis — Homily at the canonization of Mariam Baouardy and Marie-Alphonsine Danil Ghattas"
url = "https://www.vatican.va/content/francesco/en/homilies/2015/documents/papa-francesco_20150517_omelia-canonizzazioni.html"

[[saints]]
id = "john-maron"
name = "Saint John Maron"
aliases = ["John Maroun", "Youhana Maron", "Yuhanna Marun", "John Maron of Antioch", "Mar Yuhanna Maroun"]
years = "Late seventh to early eighth century"
vocation = "Monk and Maronite patriarch"
place = "Syria and Lebanon"
summary = "Maronite tradition remembers John Maron as the first patriarch of the Maronite Church."
biography = [
  "Maronite tradition places John Maron in the late seventh and early eighth centuries. He is remembered as a monk and the first patriarch of the Maronite Church. The surviving early evidence about his life is limited, and later accounts provide much of the detail about his origins, formation, and public ministry.",
  "The patriarchal title ties John’s memory to Antioch, one of the earliest centers of Christianity. Maronite communities also took root in the mountains of Lebanon, where monasteries and villages sustained worship and teaching. The tradition about John speaks of a community retaining its religious life under the pastoral care of its own patriarch during a period of change.",
  "Some accounts connect John’s patriarchal ministry with Kfarhay in the Batroun region. The Maronite Church has preserved that association in its local memory. The saint named John Maron is a separate figure from the earlier ascetic Maron, whose name became attached to the monastic tradition from which the Maronite Church grew.",
  "Maronite Catholics celebrate John Maron on March 2. Their remembrance has continued through patriarchal and parish communities in Lebanon and across the diaspora. It honors the responsibilities of a patriarch in preserving the life of a church, as well as the early traditions by which the Maronites remember their origins.",
]

[[saints.sources]]
title = "Eparchy of Saint Maron of Brooklyn — Maronite history and spirituality"
url = "https://www.stmaron.org/spirituality"

[[saints.sources]]
title = "Maronite Book of Offering — Feast of Saint John Maron, reproduced by the Family of Saint Sharbel"
url = "https://www.familyofsaintsharbel.org/saint-john-maron.html"
