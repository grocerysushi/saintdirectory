[[saints]]
id = "raphael-the-archangel"
name = "Saint Raphael the Archangel"
aliases = ["Archangel Raphael", "Raphael the Archangel", "San Rafael Arcángel"]
years = "Scriptural figure"
vocation = "Archangel and companion in the Book of Tobit"
place = "Nineveh and Media in the Book of Tobit"
summary = "An angel in the Book of Tobit who accompanies Tobiah and helps bring healing to Tobiah’s household."
biography = [
  "Raphael appears in the Book of Tobit. Tobit sends his son Tobiah from Nineveh to Media to recover money he left in trust. Tobiah needs someone who knows the route. Raphael meets him and agrees to travel with him, using the name Azariah. Tobiah does not realize at first that his companion is an angel.",
  "During the journey, Raphael guides Tobiah through difficulties and instructs him to keep parts of a fish they catch. In Media, Tobiah meets and marries Sarah, who has suffered deeply. Tobit 8 describes the couple praying together and Raphael driving away the demon that threatened her.",
  "On the return journey Raphael tells Tobiah how to use the fish gall to restore his father’s eyesight. Tobit 12 then describes Raphael revealing his identity when father and son discuss how to pay him. He tells them he carried their prayers before God and urges them to give thanks for what has happened.",
  "The narrative’s ties to travel, prayer, and recovery explain why Catholics have traditionally asked Raphael’s intercession for travelers and people seeking healing. Religious art sometimes shows him walking with Tobiah or carrying the fish. The Roman Rite celebrates Raphael with Michael and Gabriel on September 29.",
]

