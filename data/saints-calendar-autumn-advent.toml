[[saints]]
id = "cornelius"
name = "Saint Cornelius"
aliases = ["Pope Cornelius", "Cornelius of Rome"]
years = "Died 253"
vocation = "Pope and martyr"
place = "Rome and Centumcellae, Italy"
summary = "A bishop of Rome who defended the reconciliation of Christians who had abandoned the faith under persecution."
biography = [
  "Cornelius was elected bishop of Rome in 251 after the death of Fabian and a long vacancy during persecution. By the time the Roman Church could elect a successor, it faced practical questions about the many Christians who had yielded to pressure to sacrifice to the Roman gods or had obtained documents attesting to compliance.",
  "Cornelius held that people who had renounced their faith could return to communion after suitable penance. A Roman priest named Novatian was consecrated as a rival bishop and rejected that policy. Cyprian of Carthage supported Cornelius. Their correspondence shows communities in Rome and North Africa wrestling with similar questions about responsibility, restoration, and the treatment of Christians under pressure.",
  "A surviving letter attributed to Cornelius gives a glimpse of the Roman Church during his episcopate. It describes priests, deacons, and other ministers as well as people receiving material support from the community. The letter is a reminder of how much organization was required to sustain a growing Church even as its leaders faced exile.",
  "The emperor Trebonianus Gallus banished Cornelius to Centumcellae, now Civitavecchia. He died in exile in 253. The Roman Rite honors him as a martyr and commemorates him with Cyprian on September 16. Both names are also preserved in the Roman Canon.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Cornelius"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-cornelius"

[[saints]]
id = "cyprian-of-carthage"
name = "Saint Cyprian of Carthage"
aliases = ["Thascius Caecilius Cyprianus", "Cyprian of Africa"]
years = "c. 210–258"
vocation = "Bishop, Christian writer, and martyr"
place = "Carthage, present-day Tunisia"
summary = "A bishop whose letters and treatises record how the Church in Roman Africa responded to persecution and division."
biography = [
  "Cyprian was educated in Roman Africa and entered the Christian community as an adult. He became bishop of Carthage within a few years. His training in rhetoric is visible in the letters and treatises he wrote to address disagreements among Christians and the problems facing his diocese.",
  "During the persecution under Decius, Cyprian withdrew from Carthage and continued directing the Church by letter. After the persecution, communities disputed how to receive Christians who had renounced their faith. Cyprian opposed an indiscriminate readmission and favored a path back through penance. He supported Cornelius of Rome against the rival bishop Novatian.",
  "Cyprian later wrote On the Unity of the Catholic Church. His writings and letters also show him urging Christians to care for people during an epidemic, including neighbors who opposed them. In other disputes, such as the treatment of people baptized outside Catholic communion, he differed with Roman leaders. His correspondence preserves evidence of how bishops tried to act together despite disagreements.",
  "Authorities sent Cyprian into exile during the persecution under Valerian, then returned him to Carthage for judgment. He was executed in 258. His writings continued to be read for what they reveal about the Christian life of Roman Africa. The Roman Rite remembers him with Cornelius on September 16.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Cyprian"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-cyprian"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Cyprian"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070606.html"

[[saints]]
id = "januarius"
name = "Saint Januarius"
aliases = ["San Gennaro", "Januarius of Benevento", "Januarius of Naples"]
years = "Died traditionally c. 305"
vocation = "Bishop and martyr"
place = "Benevento, Pozzuoli, and Naples, Italy"
summary = "A martyr traditionally identified as a bishop of Benevento and long venerated in Naples."
biography = [
  "Januarius is traditionally identified as a bishop of Benevento who died in the Roman persecutions early in the fourth century. Devotion associates his martyrdom with Pozzuoli and honors several companions. The precise circumstances are not securely known. Stories of an arena and of his eventual execution belong to later accounts of the saint.",
  "From the history of his veneration, a clearer picture emerges. His relics are honored in Naples, where he became known as San Gennaro and is invoked as a patron of the city. Naples Cathedral is a center of that devotion. Ceremonies there include the presentation of a sealed container holding a substance handed down as his blood.",
  "Reports of liquefaction during some ceremonies are part of the local religious tradition. The devotion has a history quite apart from what can be established about the martyr himself. The Roman Rite commemorates Januarius on September 19, and observances in Naples have long connected his memory to the life of the city.",
]
patronage = ["Venerated as a patron of Naples"]

[[saints.sources]]
title = "Franciscan Media — Saint Januarius"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-januarius"

[[saints]]
id = "andrew-kim-tae-gon"
name = "Saint Andrew Kim Tae-gŏn"
aliases = ["Andrew Kim Taegon", "Andrew Kim Tae-gon", "Kim Dae-geon", "김대건"]
years = "1821–1846"
vocation = "Priest and martyr"
place = "Joseon Korea, Macao, and Shanghai"
summary = "The first Korean Catholic priest served his country’s clandestine Catholic community and was executed in 1846."
biography = [
  "Andrew Kim Tae-gŏn grew up in a Korean Catholic family during the Joseon dynasty. Korean lay people had formed Christian communities before there were priests resident in the country. During Andrew’s childhood and youth, Catholics gathered under conditions in which identifying as a Christian could bring punishment. Members of his own family were among those killed.",
  "Andrew left Korea to study for the priesthood in Macao. He traveled extensively before being ordained in Shanghai in 1845. His ordination made him the first Korean Catholic priest. He returned to a community that had relied for decades on lay leaders and on the occasional arrival of clergy from abroad.",
  "He ministered in Korea and helped identify ways for missionaries to travel into the country. The authorities captured him in 1846, and he was imprisoned and executed that year. He had been a priest for about a year. Accounts of the period preserve his work alongside that of the lay women and men who sheltered clergy, maintained ties between communities, and taught the faith.",
  "Pope John Paul II canonized Andrew and 102 other Korean martyrs in Seoul in 1984. The group spans several periods of persecution. Andrew and Paul Chŏng Ha-sang are named in the Roman Rite memorial on September 20 as two members of that larger community.",
]

[[saints.sources]]
title = "Franciscan Media — Saints Andrew Kim Taegon, Paul Chong Hasang, and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-andrew-kim-taegon-paul-chong-hasang-and-companions"

[[saints.sources]]
title = "John Paul II — Homily at the Canonization of the Korean Martyrs"
url = "https://www.vatican.va/content/john-paul-ii/en/homilies/1984/documents/hf_jp-ii_hom_19840506_martiri-coreani.html"

[[saints]]
id = "paul-chong-ha-sang"
name = "Saint Paul Chŏng Ha-sang"
aliases = ["Paul Chong Hasang", "Paul Chong Ha-sang", "Paul Jeong Ha-sang", "정하상"]
years = "1795–1839"
vocation = "Lay catechist and martyr"
place = "Joseon Korea and Beijing, China"
summary = "A Korean lay Catholic who helped sustain the local Church and petitioned for clergy to serve it."
biography = [
  "Paul Chŏng Ha-sang was born into a Korean Catholic family during the Joseon dynasty. His father was killed during the persecution of 1801. Paul grew up at a time when the Catholic community in Korea had lost many leaders and relied on laypeople to maintain worship, religious instruction, and contact between households.",
  "As an adult he made repeated journeys to Beijing. He used the opportunities offered by diplomatic travel to make contact with church leaders and seek help for Korean Catholics who had little access to clergy. His work contributed to the organization of the Catholic mission and to bringing priests into Korea.",
  "During the persecution of 1839, Paul prepared a written defense addressed to the authorities. He explained Catholic teaching and appealed for an end to the persecution. The text is remembered as an early example of a Korean Catholic making the case for his community in writing. Paul was arrested and executed later that year, and other members of his family also died during the persecution.",
  "The Catholic Church canonized Paul with the Korean martyrs in Seoul in 1984. The memorial that names him and Andrew Kim Tae-gŏn recognizes both the work of Korea’s first priest and the organizing and teaching done by lay Catholics before and alongside the clergy.",
]

[[saints.sources]]
title = "Franciscan Media — Saints Andrew Kim Taegon, Paul Chong Hasang, and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-andrew-kim-taegon-paul-chong-hasang-and-companions"

[[saints.sources]]
title = "Catholic Culture — Stories of the Korean Martyrs"
url = "https://www.catholicculture.org/culture/library/view.cfm?id=4740"

[[saints]]
id = "pius-of-pietrelcina"
name = "Saint Pius of Pietrelcina"
aliases = ["Padre Pio", "Pio of Pietrelcina", "Pio da Pietrelcina", "Francesco Forgione"]
years = "1887–1968"
vocation = "Capuchin priest"
place = "Pietrelcina and San Giovanni Rotondo, Italy"
summary = "A Capuchin priest known for hearing confessions and for helping establish a hospital in San Giovanni Rotondo."
biography = [
  "Francesco Forgione was born in Pietrelcina in southern Italy and entered the Capuchin Franciscans as a young man. He took the name Pio and was ordained in 1910. Ill health affected his early assignments. He eventually settled in the friary at San Giovanni Rotondo, where he spent much of his priesthood.",
  "Pio became known for saying Mass, hearing confessions for long periods, and offering spiritual direction. Reports of wounds understood by devotees as stigmata brought him public attention. Church authorities examined and at times restricted aspects of his ministry. Over the years, many visitors traveled to San Giovanni Rotondo to seek confession or counsel.",
  "Pio helped organize support for a hospital, the Casa Sollievo della Sofferenza, which opened in 1956. It gave practical form to his concern for people who were sick. He also encouraged prayer groups associated with the work. Both the hospital and the groups continued beyond his lifetime.",
  "He died in 1968. Pope John Paul II canonized him in 2002. In Italy and elsewhere he is widely known as Padre Pio, the name used by people who came to him as a priest. His ministry in confession and spiritual direction, and the hospital he helped establish, remain central to how the Catholic Church remembers him on September 23.",
]

[[saints.sources]]
title = "Holy See — Padre Pio da Pietrelcina"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20020616_padre-pio_en.html"

[[saints]]
id = "cosmas"
name = "Saint Cosmas"
aliases = ["Cosmas of Syria", "Kosmas", "Cosmas the Unmercenary"]
years = "Late Roman antiquity, dates uncertain"
vocation = "Physician in Christian tradition and martyr"
place = "Roman Syria, in traditions of his veneration"
summary = "An early martyr remembered with Damian as a physician who treated the sick without charging them."
biography = [
  "Cosmas and Damian were honored together as early Christian martyrs. Later traditions describe them as brothers who studied and practiced medicine in regions of the eastern Roman Empire. Some place their work in Cilicia and associate an important center of their cult with Syria. Little can be established independently about the life of Cosmas or the circumstances of his death.",
  "The best-known account remembers them offering treatment without taking fees. That practice gave rise to the title often translated as the unmercenary healers. Their refusal of payment became a way Christian communities remembered care for people who could not otherwise afford it. Their reported execution is usually placed in the persecution under Diocletian.",
  "Devotion to the pair spread among Christians in East and West. Rome gave a church their names, and both appear in the Roman Canon. Their long association with medicine explains why Cosmas is invoked with Damian as a patron of physicians. The Roman Rite commemorates them together on September 26.",
]
patronage = ["Traditionally venerated as a patron of physicians"]

[[saints.sources]]
title = "Encyclopaedia Britannica — Saints Cosmas and Damian"
url = "https://www.britannica.com/biography/Saint-Cosmas"

[[saints]]
id = "damian"
name = "Saint Damian"
aliases = ["Damian of Syria", "Damianos", "Damian the Unmercenary"]
years = "Late Roman antiquity, dates uncertain"
vocation = "Physician in Christian tradition and martyr"
place = "Roman Syria, in traditions of his veneration"
summary = "An early martyr whose cult with Cosmas became associated with medical care offered freely."
biography = [
  "Damian is recalled as a physician and martyr alongside Cosmas, whom tradition describes as his brother. The traditions give few details that distinguish Damian’s work from that of Cosmas. The memory of the pair was preserved chiefly through the stories of their shared service and death.",
  "Later Christian accounts place their medical work in the eastern Roman Empire and remember them caring for people without requesting payment. Stories that attached to their shrines sometimes give dramatic accounts of healing and of the brothers’ resistance to persecution. These traditions reveal how communities understood their intercession, while the chronology and details of their lives remain uncertain.",
  "Their names are preserved together in the Roman Canon, and they have long been honored as patrons of physicians. In the Roman Rite they are commemorated on September 26. The early martyrial devotion and the later stories of healing can be traced separately even though they became closely associated in worship and art.",
]
patronage = ["Traditionally venerated as a patron of physicians"]

[[saints.sources]]
title = "Encyclopaedia Britannica — Saints Cosmas and Damian"
url = "https://www.britannica.com/biography/Saint-Cosmas"

[[saints]]
id = "lawrence-ruiz"
name = "Saint Lawrence Ruiz"
aliases = ["Lorenzo Ruiz", "Lorenzo Ruiz of Manila", "Lawrence Ruiz and Companions", "San Lorenzo Ruiz"]
years = "c. 1600–1637"
vocation = "Layman and martyr"
place = "Manila, Philippines, and Nagasaki, Japan"
summary = "A married lay Catholic from Manila who died with companions during the persecution of Christians in Japan."
biography = [
  "Lawrence Ruiz grew up in Manila in a Christian family. His father was Chinese and his mother Filipino. He learned languages that were spoken in the city’s different communities and worked with the Dominicans as a church assistant and a skilled copyist. He married and had children before circumstances took him far from Manila.",
  "Ruiz sailed with Dominican missionaries in 1636. Their journey brought them to Okinawa during a time when Japan’s rulers had placed severe restrictions on Christian practice. Existing Japanese communities and missionaries from abroad both faced arrest. Ruiz and his traveling companions were taken into custody and brought to Nagasaki.",
  "Officials sought to have the prisoners renounce Christianity. Christian accounts remember Ruiz refusing, and he and several companions were executed in 1637. The group included people from different countries and religious communities. Their stories preserve the reach of Catholic activity across East and Southeast Asia as well as the violence used against it.",
  "Pope John Paul II canonized Ruiz and fifteen fellow martyrs in 1987. Ruiz was the first Filipino to be canonized and is known in the Philippines as San Lorenzo Ruiz. His memorial in the Roman Rite falls on September 28. His life before the journey, as a married man and church worker in Manila, is part of the history of lay Catholic communities in the Philippines.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Lorenzo Ruiz and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-lorenzo-ruiz-and-companions"

[[saints]]
id = "michael-the-archangel"
name = "Saint Michael the Archangel"
aliases = ["Archangel Michael", "Michael the Archangel", "San Miguel Arcángel"]
years = "Scriptural figure"
vocation = "Archangel"
place = "Scriptural visions in Daniel and Revelation"
summary = "An archangel portrayed in Scripture as a defender of God’s people and the leader of angels in battle against the dragon."
biography = [
  "Michael appears in biblical accounts of conflict and protection. In Daniel 10 he is named as one of the chief princes who comes to the aid of a heavenly messenger. Daniel 12 gives Michael a role in protecting God’s people in a time of distress. These visions identify his place in the story of God’s care for Israel.",
  "The Letter of Jude calls Michael an archangel in a short account of a dispute over the body of Moses. Michael leaves judgment to the Lord. Revelation 12 presents a different scene. There Michael and his angels fight the dragon, identified in the passage with the ancient serpent and the devil, and the dragon is cast out of heaven.",
  "The Catechism describes angels as spiritual creatures with intelligence and will who serve God. Scripture’s scenes involving Michael belong to that understanding of an angelic ministry. The named passages give readers different ways to approach that ministry, including guardianship in Daniel and conflict with evil in Revelation.",
  "Christians have long invoked Michael for protection in spiritual struggle. Art often depicts him overcoming the dragon, drawing on Revelation. The Roman Rite honors Michael, Gabriel, and Raphael together on September 29. The feast gives a liturgical setting to images and prayers that developed over centuries.",
]

[[saints.sources]]
title = "USCCB Bible — Revelation, chapter 12"
url = "https://bible.usccb.org/bible/revelation/12"

