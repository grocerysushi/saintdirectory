[[saints]]
id = "faustina-kowalska"
name = "Saint Maria Faustina Kowalska"
aliases = ["Faustina Kowalska", "Helena Kowalska", "Maria Faustyna Kowalska", "Sister Faustina"]
years = "1905–1938"
vocation = "Religious sister and diarist"
place = "Poland and Vilnius, Lithuania"
summary = "A Polish religious sister whose diary helped spread Catholic devotion to the Divine Mercy."
biography = [
  "Helena Kowalska grew up in Poland in a large family and worked in domestic service before entering the Congregation of the Sisters of Our Lady of Mercy. She took the religious name Maria Faustina. Her duties included ordinary work such as cooking, gardening, and attending to people who came to the door. She lived in several houses of the congregation, including in Vilnius and Kraków.",
  "Faustina reported experiences she understood as encounters with Jesus. With encouragement from her spiritual advisers, including Father Michał Sopoćko, she kept a diary. Its entries describe her life in the congregation and her attention to trust in God’s mercy. The image and prayers associated with the Divine Mercy devotion developed in connection with those accounts.",
  "Faustina’s health declined and she died in Kraków in 1938. The diary had readers beyond her community as the devotion spread. Its place in Catholic life developed gradually as church authorities examined and interpreted what she had written.",
  "Pope John Paul II canonized Faustina in 2000. The observance of Divine Mercy on the Second Sunday of Easter made the theme familiar to many Catholics who had never read her diary. Her own memorial recalls a life that was mostly spent within the daily work of a religious house, where she recorded the experiences for which she later became known.",
]

[[saints.sources]]
title = "Holy See — Maria Faustina Kowalska"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20000430_faustina_en.html"

[[saints.sources]]
title = "Franciscan Media — Saint Maria Faustina Kowalska"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-maria-faustina-kowalska"

[[saints]]
id = "bruno"
name = "Saint Bruno of Cologne"
aliases = ["Bruno of Cologne", "Bruno the Carthusian", "Bruno of Chartreuse"]
years = "c. 1030–1101"
vocation = "Priest and founder of the Carthusians"
place = "Cologne, Reims, the Chartreuse Mountains, and Calabria"
summary = "A teacher who established a community of hermits in the French Alps and shaped the Carthusian way of life."
biography = [
  "Bruno was born in Cologne and became a teacher at the cathedral school in Reims. He also held responsibility in the archdiocese and took part in efforts to address abuses in church leadership. Teaching and church administration occupied much of his life before he began forming a community devoted to solitude.",
  "In 1084 Bruno and several companions settled in a mountain valley near Grenoble with the help of Bishop Hugh. The hermits had separate dwellings and came together for parts of their daily prayer. The arrangement allowed sustained periods of silence, reading, and work within a common rule of life. The valley of Chartreuse eventually gave the Carthusians their name.",
  "Pope Urban II, who had studied under Bruno, summoned him to Italy as an adviser. Bruno later obtained permission to return to a more secluded life. He established another community in Calabria and died there in 1101. The foundation in France continued after his departure.",
  "Bruno left the beginnings of a way of life in which members shared a community while spending much of the day in solitude. Later Carthusians developed its practices into a formal order. The Roman Rite remembers Bruno on October 6. His years as a teacher and adviser help explain the experience he brought to the project even as he chose to leave public office.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Bruno"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-bruno"

[[saints]]
id = "denis-of-paris"
name = "Saint Denis of Paris"
aliases = ["Dionysius of Paris", "Denis the Martyr", "Saint Denis and Companions"]
years = "Third century, according to tradition"
vocation = "Bishop and martyr"
place = "Paris, France"
summary = "The early martyr venerated as the first bishop of Paris, where an abbey later grew around his shrine."
biography = [
  "Denis is venerated as an early bishop and martyr of Paris. Christian tradition remembers him with Rusticus and Eleutherius, who are said to have died with him. One historical proposal places Denis’s mission to Gaul in the third century and his execution in the persecution of Valerian. There is little contemporary evidence from which to reconstruct the details.",
  "A shrine at the place associated with his burial became an important center of devotion. The abbey and later basilica of Saint-Denis preserved his name in the history of Paris. The cult of Denis grew alongside traditions about the other martyrs and the origins of Christianity in the city.",
  "A later legend depicts Denis carrying his head after execution. That image became a way to recognize him in medieval sculpture and painting. Some medieval writers also identified him with other men named Dionysius. The Roman Rite commemorates Denis and his companions on October 9, while the evidence for his biography remains sparse.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Denis and Companions"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-denis-and-companions"

[[saints]]
id = "john-leonardi"
name = "Saint John Leonardi"
aliases = ["Giovanni Leonardi", "Giovanni di Matteo Leonardi"]
years = "1541–1609"
vocation = "Priest and religious founder"
place = "Lucca and Rome, Italy"
summary = "A former pharmacy apprentice who founded a community of priests devoted to religious education and reform."
biography = [
  "John Leonardi trained as an apothecary in Lucca before deciding to become a priest. In his early ministry he visited people in hospitals and prisons and organized religious instruction. Several laymen joined the work, and some later became priests. From that group Leonardi developed the community known as the Clerks Regular of the Mother of God.",
  "Leonardi lived in the decades after the Council of Trent, when Catholic communities sought to improve religious education and clergy formation. He established a confraternity to teach Christian doctrine and published a guide to that work. The growth of his community brought opposition in Lucca, and he spent much of his later life away from his home city.",
  "Working in Rome, he helped plan a college to train priests for missions abroad. The project grew out of the practical question of whether and how future missionaries could be prepared before leaving Italy. Leonardi continued pastoral responsibilities as well. He died in 1609 after caring for people who were ill.",
  "The Roman Rite commemorates him on October 9. Leonardi’s career connects work in hospitals and prisons with the formation of educators and missionaries. Much of his influence came through groups and institutions that could carry on work after his death. The connection to his early training remained, and the Church named him a patron of pharmacists in 2006.",
]

[[saints.sources]]
