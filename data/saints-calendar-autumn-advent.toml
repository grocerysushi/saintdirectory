summary = "A martyr traditionally identified as a bishop of Benevento and long venerated in Naples."
biography = [
  "Little is known securely about Januarius’s life. Tradition identifies him as a bishop of Benevento who was killed with fellow Christians near Pozzuoli during the Roman persecutions. Later accounts describe details of their trial and death.",
  "His relics are venerated in Naples. Local devotion includes ceremonies centered on a substance traditionally identified as his blood, whose liquefaction has been reported on occasions during the year.",
]
patronage = ["Venerated as a patron of Naples"]

