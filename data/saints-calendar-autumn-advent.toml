[[saints]]
id = "gabriel-the-archangel"
name = "Saint Gabriel the Archangel"
aliases = ["Archangel Gabriel", "Gabriel the Archangel", "San Gabriel Arcángel"]
years = "Scriptural figure"
vocation = "Archangel and divine messenger"
place = "Jerusalem and Nazareth in the Gospel of Luke"
summary = "The messenger who announces the births of John the Baptist and Jesus in the Gospel of Luke."
biography = [
  "Gabriel appears in the Book of Daniel as an interpreter. In Daniel 8 he is told to explain a vision involving a ram and a goat. In Daniel 9 he comes to Daniel during prayer and speaks about the meaning of a period described in the text as seventy weeks. In both chapters Gabriel helps a human listener understand a message that is difficult to grasp.",
  "Luke’s Gospel names Gabriel in two scenes. While Zechariah is serving as a priest at the Temple, Gabriel announces that Elizabeth will bear a son. The child will be named John and prepare people for the Lord. Zechariah asks for grounds to believe the message and loses his ability to speak until the time of the birth.",
  "Later in Luke 1, God sends Gabriel to Mary at Nazareth. Gabriel addresses her and announces that she will bear Jesus. His response to Mary’s question includes news about Elizabeth, connecting the two accounts. Mary gives her consent, and the Gospel proceeds to her visit to Elizabeth.",
  "Catholics commemorate Gabriel with Michael and Raphael on September 29. Scenes of the Annunciation often show Gabriel facing Mary because the Gospel places their conversation at the center of the event. The accounts in Daniel and Luke preserve the different settings in which Scripture presents him as a messenger.",
]

[[saints.sources]]
title = "USCCB Bible — Gospel of Luke, chapter 1"
url = "https://bible.usccb.org/bible/luke/1"

