[[saints]]
id = "cornelius"
name = "Saint Cornelius"
aliases = ["Pope Cornelius", "Cornelius of Rome"]
years = "Died 253"
vocation = "Pope and martyr"
place = "Rome and Centumcellae, Italy"
summary = "A bishop of Rome who defended the reconciliation of Christians who had abandoned the faith under persecution."
biography = [
  "Cornelius was elected bishop of Rome in 251, after a persecution had left Roman Christians divided over how to readmit those who had renounced their faith. Supported by Cyprian of Carthage, he held that the Church could restore them to communion after penance. Novatian organized a rival church that took a stricter position.",
  "Cornelius was exiled to Centumcellae, now Civitavecchia, under Emperor Trebonianus Gallus and died there in 253. His feast is shared with Cyprian, whose surviving letters help document the controversy.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Cornelius"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-cornelius"

[[saints]]
id = "cyprian-of-carthage"
name = "Saint Cyprian of Carthage"
aliases = ["Thascius Caecilius Cyprianus", "Cyprian of Africa"]
years = "c. 210–258"
vocation = "Bishop, Christian writer, and martyr"
place = "Carthage, present-day Tunisia"
summary = "A bishop whose letters and treatises record how the Church in Roman Africa responded to persecution and division."
biography = [
  "Cyprian entered the Christian community as an adult and became bishop of Carthage. After the persecution under Emperor Decius, he worked with Cornelius of Rome to readmit Christians who had denied their faith, with penance appropriate to their circumstances.",
  "The Roman authorities sent Cyprian into exile during the persecution under Valerian. He was later recalled to Carthage and executed in 258. His writings include a treatise on the unity of the Church.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Cyprian"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-cyprian"

