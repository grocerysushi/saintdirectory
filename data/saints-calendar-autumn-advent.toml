years = "Late Roman antiquity, dates uncertain"
vocation = "Physician in Christian tradition and martyr"
place = "Roman Syria, in traditions of his veneration"
summary = "An early martyr remembered with Damian as a physician who treated the sick without charging them."
biography = [
  "Christian tradition remembers Cosmas and Damian as brothers who used their skill in medicine to help the sick freely. A center of their early cult was Cyrrhus in Roman Syria.",
  "Their lives cannot be reconstructed in detail. Accounts of their execution belong to the tradition of their martyrdom, commonly set during the persecution under Diocletian. They are named together in the Roman Canon.",
]
patronage = ["Traditionally venerated as a patron of physicians"]

