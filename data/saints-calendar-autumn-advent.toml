summary = "An early martyr whose cult with Cosmas became associated with medical care offered freely."
biography = [
  "Damian is remembered alongside Cosmas, whom tradition identifies as his brother. Christian devotion to the pair spread widely, and healing became central to the stories told at shrines bearing their names.",
  "Independent historical details about Damian are scarce. The traditions share the memory of two martyrs and healers, and the Roman Canon preserves their names together.",
