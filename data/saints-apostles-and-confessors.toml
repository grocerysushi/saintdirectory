[[saints]]
id = "john-the-apostle"
name = "Saint John the Apostle"
aliases = ["John the Evangelist","John son of Zebedee","Saint John the Apostle","John the Beloved"]
years = "First century"
vocation = "Apostle and evangelist"
place = "Galilee"
summary = "One of the Twelve and the brother of James, John is traditionally associated with the Fourth Gospel."
biography = [
  "John was a son of Zebedee and the brother of James. Matthew places the brothers in their father’s fishing boat when Jesus calls them. Mark gives them a name meaning sons of thunder. Both brothers belonged to the Twelve, and several accounts place them with Peter at events witnessed by only a few disciples.",
  "At the Transfiguration, John sees Jesus with Moses and Elijah. In Gethsemane, Mark again names Peter, James, and John as the disciples Jesus takes with him apart from the others. The two scenes bring those disciples close to both the glory and suffering that the Gospel associates with Jesus.",
  "Later in the New Testament, Acts describes John going to the Temple with Peter. They encounter a man unable to walk, and both are called to answer for their public teaching. The story places John within the leadership and witness of the Jerusalem community after the Resurrection.",
  "Christian tradition associates John with the Fourth Gospel and its beloved disciple. The Gospel leaves that disciple unnamed. At the cross, Jesus entrusts Mary and the disciple to one another. Later he and Peter go to see the empty tomb. These scenes shaped Christian memory of John as a witness close to Jesus.",
  "Tradition also connects John’s later years with Ephesus. The relation between the apostle and the authors of other works carrying the name John is a separate historical question. The Church celebrates him as apostle and evangelist.",
]

