id = "james-the-less"
name = "Saint James the Less"
aliases = ["James son of Alphaeus","James the Lesser"]
years = "First century"
vocation = "Apostle"
place = "Galilee"
summary = "The apostle James son of Alphaeus is traditionally called James the Less."
biography = [
  "The clearest New Testament identification of this apostle appears in the lists of the Twelve. Matthew names both James son of Zebedee and James son of Alphaeus. Mark and Luke also list a son of Alphaeus. The names of their fathers allow readers to keep the two apostles separate.",
  "The title James the Less is a traditional designation. A related expression occurs in Mark’s account of the women near the cross, where Mary is identified as the mother of a James described as younger or lesser. The text does not explicitly identify her son with the apostle. Later Christian writers related these figures in different ways.",
  "Another James appears in accounts of the Church in Jerusalem. Paul refers to a James as the brother of the Lord, and Acts presents a James with a leading role at the council in Jerusalem. Some traditions identify that figure with James son of Alphaeus. Others distinguish them, in part because the ancient texts identify them differently.",
  "The Roman Rite celebrates James the Less with Philip the Apostle. The names of the pair in the liturgy preserve their place among the first witnesses, even though established details about James’s travels, family, and death remain few.",
]

