[[saints]]
id = "benedict-joseph-labre"
name = "Saint Benedict Joseph Labre"
aliases = ["Benoît-Joseph Labre","Benedict Labre"]
years = "1748–1783"
vocation = "Pilgrim"
place = "France and Rome"
summary = "A French pilgrim who spent his final years in Rome after attempts to enter religious life."
biography = [
  "Benedict Joseph Labre was born in 1748 in northern France. As a young man he sought admission to communities that lived by a strict rule of prayer and work. He approached more than one religious house, including communities whose life appealed to him for its austerity. Illness and difficulty adapting to their routine repeatedly brought these attempts to an end.",
  "Labre then began traveling as a pilgrim. He went on foot to shrines in France, Italy, and elsewhere in Europe. He carried few possessions and relied on hospitality or alms. His practice was closer to a life of continuous pilgrimage than to a short journey undertaken before returning to a settled home.",
  "He spent his last years in Rome. Accounts of those years describe him praying in churches and spending time near the Colosseum. He gave away some of what he received even when he himself had very little. His way of living drew attention because it placed him among people who were usually unnoticed.",
  "Labre became ill and died in Rome in 1783. Word of his death spread rapidly, and people began visiting the church where he was buried. He was canonized in 1881. His story is remembered for the religious meaning he gave to pilgrimage after his plans for a settled monastic life had failed.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Benedict Joseph Labre"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-benedict-joseph-labre/"

[[saints]]
id = "louis-ix-of-france"
name = "Saint Louis IX of France"
aliases = ["Louis of France","Louis IX","Louis the Saint","Saint Louis"]
years = "1214–1270"
vocation = "King"
place = "France"
summary = "A medieval French king remembered for his religious devotion, charitable works, and efforts to administer justice."
biography = [
  "Louis was born in 1214 and became king of France in 1226. He was still a child, and his mother, Blanche of Castile, governed as regent during the early years of his reign. The regency faced opposition from noble families. Louis inherited both those tensions and a monarchy whose authority had expanded considerably under earlier Capetian kings.",
  "As an adult, Louis took a close interest in the conduct of royal officials and the administration of justice. His government used inquiries to discover and remedy abuses. He supported religious houses and charitable institutions. The Sainte-Chapelle in Paris, built to house relics acquired by Louis, remains a prominent expression of the religious culture of his court.",
  "Louis led the Seventh Crusade. The expedition landed in Egypt and took Damietta before suffering defeat and the capture of the king. After his release for ransom, Louis spent several years in the eastern Mediterranean. He returned to France on learning of his mother’s death.",
  "The later part of his reign included administrative reforms and efforts to resolve disputes through negotiation. Louis also undertook another crusade, this time to Tunisia. Illness spread through the expedition, and he died near Tunis in 1270.",
  "Louis was canonized in 1297. Devotional accounts emphasize his prayer, his care for people in poverty, and his sense of personal responsibility for justice. His surviving record also belongs to the wider history of medieval kingship and the crusades. Those contexts help explain how he understood the responsibilities of a Christian ruler.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Louis of France"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-louis-of-france/"

[[saints.sources]]
title = "Encyclopaedia Britannica — Louis IX"
url = "https://www.britannica.com/biography/Louis-IX"

[[saints]]
id = "elizabeth-of-portugal"
name = "Saint Elizabeth of Portugal"
aliases = ["Isabel of Aragon","Elizabeth of Aragon","Rainha Santa Isabel"]
years = "1271–1336"
vocation = "Queen and Franciscan tertiary"
place = "Portugal"
summary = "A Portuguese queen noted for care of the poor and mediation in conflicts within her family."
biography = [
  "Elizabeth was born into the royal house of Aragon and married Denis of Portugal while still young. She became queen in a court where family relationships affected the government of the kingdom. She maintained a life of prayer and used the resources available to her to provide aid to people in need.",
  "Conflicts within the royal family placed demands on her that went beyond charity. Her husband Denis and their son, the future Afonso IV, came into serious conflict. Accounts of Elizabeth remember her intervening to prevent violence. Her reputation as a peacemaker rests on these efforts to negotiate within a family whose disputes could draw in armies and neighboring rulers.",
  "After Denis died, Elizabeth spent much of her remaining life near the Poor Clare convent at Coimbra. Her religious life took on greater simplicity. She continued to make use of her position and resources to assist others and to support charitable work.",
  "A final conflict drew her away from Coimbra. She set out to try to reconcile her son with the king of Castile and became ill during the journey. She died in 1336. Her burial at Coimbra gave the city a lasting place in the history of devotion to her.",
  "Elizabeth is sometimes called Isabel of Aragon. She was named for Elizabeth of Hungary, another royal woman remembered for charity. The Portuguese queen’s own reputation is especially connected with mediation and with service after the death of her husband.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Elizabeth of Portugal"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-elizabeth-of-portugal/"

[[saints]]
id = "bridget-of-sweden"
name = "Saint Bridget of Sweden"
aliases = ["Birgitta Birgersdotter","Birgitta of Sweden","Brigid of Sweden"]
years = "c. 1303–1373"
vocation = "Mystic and religious founder"
place = "Sweden and Rome"
summary = "A Swedish mother and widow whose religious visions and work helped give rise to the Bridgettine Order."
biography = [
  "Bridget was born into a prominent Swedish family around the beginning of the fourteenth century. She married Ulf Gudmarsson and raised a large family. Among their children was Catherine, who later joined in her mother’s religious work. Bridget’s years as a wife and mother formed the larger part of her early adulthood.",
  "Bridget and Ulf went on pilgrimage. After his death, her life took on a more public religious character. The visions and messages she reported were recorded and circulated under the title Revelations. They address subjects ranging from the life of Christ to the conduct of rulers and church leaders.",
  "Bridget traveled to Rome and remained there for much of the rest of her life. She urged reform of the Church and was concerned about the papacy’s residence at Avignon. Her years in Rome also involved ordinary work to support herself and her companions while she sought approval for a new religious community.",
  "The order Bridget envisioned was known as the Order of the Most Holy Savior. Its life combined prayer with an organization that included separate communities of women and men. The name Bridgettines recalls its founder. She also traveled to the Holy Land late in her life.",
  "Bridget died in Rome in 1373. Her reputation rests on the writings associated with her visions and on the religious communities that put her rule into practice. Her daughter Catherine helped carry that work forward.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Bridget of Sweden"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-bridget-of-sweden/"

[[saints.sources]]
title = "Vatican, Benedict XVI — Saint Bridget of Sweden"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20101027.html"

[[saints]]
id = "margaret-mary-alacoque"
name = "Saint Margaret Mary Alacoque"
aliases = ["Marguerite-Marie Alacoque","Margaret Mary"]
years = "1647–1690"
vocation = "Visitation nun and mystic"
place = "Paray-le-Monial, France"
summary = "A Visitation nun whose reported visions helped spread devotion to the Sacred Heart of Jesus."
biography = [
  "Margaret Mary Alacoque was born in Burgundy in 1647. She spent part of her childhood unwell and came to religious life after years in her family’s household. In 1671 she entered the Visitation monastery at Paray-le-Monial. Its daily life gave her a regular setting for prayer and communal work.",
  "At the monastery she reported experiences in prayer in which Christ’s heart was presented as a sign of his love. She understood the experiences as a call to respond to that love and to encourage others to do likewise. The practices she promoted were closely connected with the Eucharist.",
  "Her reports were received with caution within the community. The Jesuit Claude de la Colombière came to support her and helped bring the devotion to others. Its spread therefore depended on a religious community and on people who could explain and transmit it outside the setting of the original accounts.",
  "Margaret Mary died in 1690. The devotion continued to grow during the following centuries. Catholics came to associate it with practices such as receiving Communion on first Fridays and celebrating the feast of the Sacred Heart.",
  "Her biography is largely the story of a woman living within one convent and working through the doubts and judgments of those around her. The later public reach of the devotion grew from that much smaller setting.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Margaret Mary Alacoque"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-margaret-mary-alacoque/"

[[saints]]
id = "frances-of-rome"
name = "Saint Frances of Rome"
aliases = ["Francesca Romana","Francesca Bussa de’ Leoni","Francesca of Rome"]
years = "1384–1440"
vocation = "Lay religious founder"
place = "Rome, Italy"
summary = "A Roman wife and mother who organized women for prayer and service to people in need."
biography = [
  "Frances was born in Rome in 1384 and married Lorenzo de’ Ponziani when she was young. She had hoped for a life devoted to prayer. Marriage gave her responsibility for a large household, and it was within that household and its neighborhood that much of her religious work first took shape.",
  "Rome suffered from conflict, shortages, and disease during the years in which Frances raised her family. Accounts of her life describe her distributing food and visiting people who were ill. Her work depended on making practical use of the resources available to her and on obtaining help from other women.",
  "Frances gathered a community associated with the Benedictine Olivetan tradition. The women committed themselves to prayer and charitable service while retaining a form of life different from a strictly enclosed convent. A house in Rome gave the community a place where its members could live and carry on their work.",
  "After Lorenzo died, Frances joined the women she had helped bring together. She spent the last years of her life in their community and died in 1440. The foundation continued after her death.",
  "Later accounts of Frances include experiences of visions and guidance by a guardian angel. Those traditions belong to her devotional biography. The household duties and the community of women she organized are central to understanding her public work in Rome.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Frances of Rome"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-frances-of-rome/"

[[saints]]
id = "camillus-de-lellis"
name = "Saint Camillus de Lellis"
aliases = ["Camillo de Lellis","Camillus of Lellis"]
years = "1550–1614"
vocation = "Priest and religious founder"
place = "Italy"
summary = "A former soldier who founded a religious community dedicated to caring for the sick."
biography = [
  "Camillus was born in Italy in 1550. During his earlier years he served as a soldier and struggled with gambling. A recurring wound on his leg brought him into contact with hospitals both as a patient and as a worker. It also limited his ability to join a community whose life required different kinds of labor.",
  "He came to see care of the sick as a vocation. As he took responsibility for patients, he became concerned with the quality of their nursing and with the attitude of those assigned to them. His project took shape around a group willing to care for people who needed regular attention, including those approaching death.",
  "Camillus was ordained a priest and organized the community that became the Ministers of the Sick, commonly known as the Camillians. Its members provided physical and spiritual care. They accepted work during epidemics and in other settings where the need was great and caregivers were difficult to find.",
  "The congregation’s ministry gave durable form to the work of individual attendants in the hospitals. Camillus continued to care for patients even as he grew older and his own health declined. He died in Rome in 1614.",
  "His later association with hospitals reflects the character of the order he formed. He is remembered for treating nursing as a sustained responsibility that required skill, organization, and personal attention.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Camillus de Lellis"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-camillus-de-lellis/"

[[saints]]
id = "john-of-god"
name = "Saint John of God"
aliases = ["Juan de Dios","João de Deus"]
years = "1495–1550"
vocation = "Religious founder and caregiver"
place = "Granada, Spain"
summary = "A Portuguese-born caregiver whose hospital work in Granada gave rise to the Brothers Hospitallers."
biography = [
  "John of God is remembered as having been born in Portugal in 1495. The earlier part of his life included military service and travel, followed by several kinds of work. He eventually settled in Granada, where he sold religious books before the change in his life that led him into hospital work.",
  "A sermon by John of Ávila made a deep impression on him. His public response led people to believe that he was unwell, and he spent time in institutional care. That experience acquainted him with the conditions under which some people in distress were treated. John of Ávila subsequently helped direct his energy toward helping others.",
  "John began providing shelter and care in Granada for people who had nowhere else to go. As the work grew, it required bedding, food, supplies, and supporters willing to help pay for them. He collected money and brought people into a house where they could receive continuing care.",
  "Accounts of John remember him as personally involved in the day-to-day labor of the hospital. He continued that work until his final illness and died in 1550. Others organized themselves to continue the ministry, which developed into the Brothers Hospitallers of Saint John of God.",
  "The religious order carried his name and its model of care into hospitals in many places. His association with nursing and hospital life grew from the institutions he had begun with limited resources in Granada.",
]

[[saints.sources]]
title = "Franciscan Media — Saint John of God"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-john-of-god/"

[[saints]]
id = "rita-of-cascia"
name = "Saint Rita of Cascia"
aliases = ["Margherita of Cascia","Rita of Roccaporena"]
years = "c. 1381–1457"
vocation = "Augustinian nun"
place = "Cascia, Italy"
summary = "An Italian wife, mother, and widow who later joined an Augustinian convent."
biography = [
  "Rita is remembered as having been born in Roccaporena, near Cascia, toward the end of the fourteenth century. The details of her childhood and marriage are known chiefly through devotional biographies written after the events. Those accounts describe a woman whose plans for religious life developed through years of family responsibility and loss.",
  "Her husband was killed, and her sons died before she joined an Augustinian community. Later accounts place these deaths within a setting of family rivalries and retaliation. They remember Rita trying to bring the conflict to an end. Her reputation as a peacemaker draws on that part of the story.",
  "Rita entered the Augustinian convent of Saint Mary Magdalene at Cascia as a widow. She remained there for the rest of her life. The convent’s common life gave her a setting for prayer and service after the years in which she had lived with her family.",
  "Devotion to Rita places particular emphasis on her meditation on the Passion. A later account connects a wound on her forehead with a thorn from Christ’s crown. The rose associated with her in art and devotion likewise comes from a story told about her last illness. Such motifs preserve the religious meaning attached to her life by later generations.",
  "Rita died in 1457. Cascia became a center of devotion to her. People facing seemingly impossible circumstances have long sought her intercession, a practice that draws on the accounts of loss, forgiveness, and perseverance associated with her.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Rita of Cascia"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-rita-of-cascia/"

[[saints]]
id = "clare-of-assisi"
name = "Saint Clare of Assisi"
aliases = ["Chiara d’Assisi","Clare of San Damiano"]
years = "1194–1253"
vocation = "Religious founder"
place = "Assisi, Italy"
summary = "A follower of Francis of Assisi who founded a community of women at San Damiano."
biography = [
  "Clare was born into a prominent family in Assisi in 1194. As a young woman she heard Francis of Assisi preach about living the Gospel in poverty. She left her family home to take up religious life. After stays with other communities, she settled at San Damiano near Assisi, where women began to join her.",
  "The women shared a life of prayer and work. Clare’s sister Agnes was among those who came to San Damiano. The community eventually became the model for the religious family now known as the Poor Clares. Clare remained at San Damiano as other houses adopted aspects of its life.",
  "One of her most sustained concerns was the freedom of the sisters to live without property held for the community. For a house of women with few possibilities for earning money outside its walls, this involved practical risks. Clare sought and defended the privilege of poverty rather than accepting a rule that depended on fixed income.",
  "Her letters to Agnes of Prague show another side of her leadership. She writes about prayer, the life of Christ, and the desire to follow him in poverty. The letters reveal a network of women exchanging counsel about arrangements that were still new in the Church.",
  "Clare composed a rule for the sisters. Pope Innocent IV approved it shortly before her death in 1253. Her legacy includes the institutions that grew out of San Damiano and the surviving writings in which she explains the life she wanted those institutions to make possible.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Clare of Assisi"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-clare-of-assisi/"

[[saints.sources]]
title = "Vatican, Benedict XVI — Saint Clare of Assisi"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2010/documents/hf_ben-xvi_aud_20100915.html"

[[saints]]
id = "louis-de-montfort"
name = "Saint Louis de Montfort"
aliases = ["Louis-Marie Grignion de Montfort","Louis Mary Grignion de Montfort"]
years = "1673–1716"
vocation = "Priest and missionary"
place = "Western France"
summary = "A French preacher and writer whose works encouraged devotion to Jesus through Mary."
biography = [
  "Louis-Marie Grignion was born at Montfort in Brittany in 1673. He went to Paris for priestly formation and was ordained in 1700. His work took him back to western France, where he preached in towns and villages and served among people in poor health or with few resources.",
  "Much of his ministry took the form of parish missions. He taught and preached for a time in a community before moving on, using familiar practices of prayer to help people continue after the mission ended. His career took place largely outside the great centers of church government.",
  "His writing on Mary calls for a more complete dedication to Jesus Christ. The work commonly known in English as True Devotion to Mary describes Mary’s relationship to Christ and presents devotion to her as a way of renewing Christian commitment. It gave later readers access to themes Louis had developed in his preaching.",
  "Religious communities took shape through his work and that of his collaborators. The Company of Mary continued his preaching ministry. The Daughters of Wisdom, formed with Marie-Louise Trichet, carried forward work that included service to people who were sick or poor.",
  "Louis died in 1716 at Saint-Laurent-sur-Sèvre. His influence continued through communities that took up his work and through the later publication of his writings. His religious name preserves the name of his birthplace.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Louis Mary Grignion de Montfort"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-louis-mary-grignion-de-montfort/"

[[saints]]
id = "pius-x"
name = "Saint Pius X"
aliases = ["Pope Pius X","Giuseppe Sarto","Giuseppe Melchiorre Sarto"]
years = "1835–1914"
vocation = "Pope"
place = "Italy and Rome"
summary = "The pope who encouraged frequent Communion and lowered the customary age for children to receive it."
biography = [
  "Giuseppe Melchiorre Sarto was born at Riese in northern Italy in 1835. After ordination he worked in parish ministry. His later appointments took him to Mantua as bishop and to Venice as patriarch. These posts gave him experience of local government and pastoral work before he was elected pope in 1903.",
  "As Pius X he took a close interest in the formation of Christians. He supported religious instruction, worked on the training of priests, and made changes to the liturgy. His government encouraged the use of Gregorian chant and issued directions for sacred music.",
  "His most widely experienced reforms concerned Communion. He encouraged Catholics to receive more frequently. He also supported admitting children to Communion when they had reached the age of reason and had sufficient preparation, changing a practice that in many places had delayed their first reception.",
  "Pius began the work of bringing the Church’s laws into a single systematic code. The code was completed and promulgated after his death. His government also responded forcefully to theological and historical approaches it grouped under the term Modernism. The encyclical Pascendi Dominici Gregis sets out the analysis behind that policy.",
  "He died in 1914 as Europe entered the First World War. Pius XII canonized him in 1954. He is remembered both for reforms that affected ordinary parish life and for decisions about the boundaries of Catholic teaching and scholarship.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Pius X"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-pius-x/"

[[saints.sources]]
title = "Vatican — Pontificate of Pius X"
url = "https://www.vatican.va/content/pius-x/en.html"

[[saints.sources]]
title = "Vatican, Pius X — Pascendi Dominici Gregis"
url = "https://www.vatican.va/content/pius-x/en/encyclicals/documents/hf_p-x_enc_19070908_pascendi-dominici-gregis.html"

[[saints]]
id = "john-xxiii"
name = "Saint John XXIII"
aliases = ["Pope John XXIII","Angelo Giuseppe Roncalli","Angelo Roncalli"]
years = "1881–1963"
vocation = "Pope"
place = "Italy and Rome"
summary = "The pope who convened the Second Vatican Council."
biography = [
  "Angelo Giuseppe Roncalli was born near Bergamo in 1881. After ordination, he served in diocesan work and taught church history. He lived through the First World War and later entered the diplomatic service of the Holy See. That work took him to Bulgaria, Turkey and Greece, and France.",
  "Roncalli spent years working in settings where Catholics lived alongside people of other Christian traditions and religions. After being made patriarch of Venice, he returned to diocesan ministry in Italy. The cardinals elected him pope in 1958, and he took the name John XXIII.",
  "In 1959 John announced that he intended to call an ecumenical council. The Second Vatican Council opened in October 1962. It brought bishops to Rome to consider the Church’s worship, teaching, and relationship to contemporary society. John lived through its first session and died before the second.",
  "During his pontificate he also published encyclicals on social and political questions. Pacem in Terris, issued in 1963 during the Cold War, addressed human dignity and responsibilities, relations among nations, and conditions for peace. It was directed beyond the Catholic community as well as to Catholics.",
  "He died in 1963. Paul VI continued the council. John’s own contribution included the decision to call it and the pastoral terms in which he introduced its work. Pope Francis canonized him in 2014.",
]

[[saints.sources]]
title = "Franciscan Media — Saint John XXIII"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-john-xxiii/"

[[saints.sources]]
title = "Vatican — Pontificate of John XXIII"
url = "https://www.vatican.va/content/john-xxiii/en.html"

[[saints.sources]]
title = "Vatican, John XXIII — Pacem in Terris"
url = "https://www.vatican.va/content/john-xxiii/en/encyclicals/documents/hf_j-xxiii_enc_11041963_pacem.html"

[[saints]]
id = "paul-vi"
name = "Saint Paul VI"
aliases = ["Pope Paul VI","Giovanni Battista Montini","Giovanni Montini"]
years = "1897–1978"
vocation = "Pope"
place = "Italy and Rome"
summary = "The pope who led the Second Vatican Council after John XXIII’s death and oversaw its conclusion."
biography = [
  "Giovanni Battista Montini was born near Brescia in 1897. After becoming a priest he worked in the Holy See’s diplomatic and administrative service. He was appointed archbishop of Milan in the 1950s and was elected pope in 1963 after the death of John XXIII.",
  "Paul VI assumed leadership of the Second Vatican Council. He kept it in session through its remaining assemblies and brought it to a conclusion in December 1965. His government then took up the task of putting its decisions into practice, including the reform of Roman Rite worship and changes in the Church’s institutions and relationships.",
  "In 1964 Paul visited the Holy Land and met Ecumenical Patriarch Athenagoras in Jerusalem. The encounter had a public importance for relations between Catholics and Orthodox Christians. The following year the two churches issued a common declaration concerning historic excommunications. It marked a step toward renewed dialogue.",
  "Paul’s writing ranged from the social consequences of unequal development in Populorum Progressio to evangelization in Evangelii Nuntiandi. His encyclical Humanae Vitae, which restated Catholic teaching about marriage and contraception, prompted significant debate within and outside the Church.",
  "Paul died in 1978. Pope Francis canonized him in 2018. The council and the years of its implementation give his pontificate its place between the work begun by John XXIII and the period of international Catholic life associated with John Paul II.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Paul VI"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-paul-vi/"

