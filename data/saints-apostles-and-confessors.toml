[[saints]]
id = "philip-the-apostle"
name = "Saint Philip the Apostle"
aliases = ["Philip of Bethsaida","Saint Philip the Apostle"]
years = "First century"
vocation = "Apostle"
place = "Bethsaida, Galilee"
summary = "The disciple from Bethsaida who invited Nathanael to meet Jesus."
biography = [
  "John’s Gospel identifies Philip as coming from Bethsaida, the same Galilean town as Andrew and Peter. Jesus calls Philip directly. Philip then finds Nathanael and tells him what he has discovered. When Nathanael doubts that anything good could come from Nazareth, Philip invites him to come and see.",
  "John mentions Philip again when a crowd gathers and Jesus asks where they will find bread. Philip thinks about the cost and recognizes that the available money would buy too little. The question draws attention to the size of the crowd before the Gospel tells how the people were fed.",
  "Shortly before the Passion, Greek visitors approach Philip and ask to see Jesus. Philip consults Andrew, and the two pass the request along together. During the Last Supper, Philip asks Jesus to show the disciples the Father. The response becomes one of John’s principal statements about knowing the Father through Jesus.",
  "After the Gospels, the evidence for Philip’s later life comes mainly from tradition. Philip the Apostle is distinct from Philip the evangelist in Acts, who is associated with the account of the Ethiopian official. The Roman Rite commemorates this apostle with James the Less.",
]

