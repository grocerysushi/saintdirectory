[[saints]]
id = "joachim"
name = "Saint Joachim"
aliases = ["Joachim father of Mary","Saint Joachim of Nazareth"]
years = "Dates uncertain"
vocation = "Father of Mary in Christian tradition"
place = "Judea, by tradition"
summary = "Christian tradition honors Joachim as the father of Mary and the grandfather of Jesus."
biography = [
  "Christian tradition honors Joachim as the father of Mary. The canonical Gospels begin their accounts of Mary with events surrounding Jesus’ conception and birth. The name Joachim comes from an early Christian story known as the Protoevangelium of James, which takes an interest in Mary’s own childhood.",
  "In that story, Joachim and Anne have long been childless. Joachim withdraws after his offering is turned away, while Anne prays for a child. The narrative describes both receiving assurance that their prayer will be answered. Their reunion and the birth of Mary are central scenes in the traditional account.",
  "The story also presents Joachim and Anne bringing Mary to the Temple while she is still a child. Their decision is told as an act of dedication. The Presentation of Mary draws on this part of the account. The early text is a source for the history of this devotion, while the particulars of Joachim’s life remain uncertain.",
  "The Roman Rite remembers Joachim and Anne together as the parents of the Blessed Virgin Mary. The commemoration has made them especially familiar to families reflecting on the role of grandparents and on how religious life is first learned within a household.",
]

[[saints.sources]]
title = "Franciscan Media — Saints Joachim and Anne"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-joachim-and-anne/"

[[saints.sources]]
title = "New Advent — Protoevangelium of James"
url = "https://www.newadvent.org/fathers/0847.htm"

[[saints]]
id = "anne"
name = "Saint Anne"
aliases = ["Anna","Anne mother of Mary","Saint Ann"]
years = "Dates uncertain"
vocation = "Mother of Mary in Christian tradition"
place = "Judea, by tradition"
summary = "Christian tradition honors Anne as the mother of Mary and the grandmother of Jesus."
biography = [
  "Anne is remembered as the mother of Mary and the grandmother of Jesus. Her name is preserved in the early Christian text known as the Protoevangelium of James. The canonical Gospels give little information about Mary’s early family life, so most of the narrative associated with Anne is known through that later tradition.",
  "The Protoevangelium tells of Anne’s sorrow at having no child and her prayer that she might become a mother. When she receives the announcement that she will have a child, she promises to dedicate that child to God. The story follows Anne and Joachim to Mary’s birth and to the couple’s presentation of Mary at the Temple.",
  "The account’s interest in Mary’s upbringing helps explain why later Christian art often portrays Anne with Mary and Jesus. Some images show Anne teaching Mary. Such representations speak to the role of religious formation within a family, and their details belong to the history of devotion.",
  "Anne and Joachim are commemorated together in the Roman Rite. Their traditional story gives a place to the generation that preceded Mary in the family of Jesus. Established details about Anne’s place of birth, the dates of her life, and her death are scarce.",
]

[[saints.sources]]
title = "Franciscan Media — Saints Joachim and Anne"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-joachim-and-anne/"

[[saints.sources]]
title = "New Advent — Protoevangelium of James"
url = "https://www.newadvent.org/fathers/0847.htm"

[[saints]]
id = "timothy"
name = "Saint Timothy"
aliases = ["Timothy of Ephesus","Timotheus"]
years = "First century"
vocation = "Bishop and missionary"
place = "Lystra and Ephesus"
summary = "A younger co-worker of Paul, introduced in Acts as a disciple from Lystra."
biography = [
  "Acts introduces Timothy as a disciple from Lystra with a Jewish mother who was a believer and a Greek father. Other Christians speak well of him. Paul asks him to join his travels. The passage shows Timothy entering the mission from a family and region in which Jewish and Greek communities met.",
  "Timothy’s name appears with Paul’s in several letters. In Philippians, Paul says he hopes to send Timothy to the community and speaks of his dependable concern for its welfare. Letters and visits helped keep the scattered churches in touch with people who had taught them and could assist with questions that arose.",
  "The letters addressed to Timothy present him carrying responsibility for teaching and leadership. The First Letter places him at Ephesus and discusses the character expected of church leaders. The Second Letter recalls the faith of his grandmother Lois and his mother Eunice. The letters describe the importance of preserving teaching and transmitting it to others.",
  "Christian tradition remembers Timothy as a bishop associated with Ephesus. The clearest early evidence for his ministry is the repeated picture of him working alongside Paul and serving as a trusted representative. The Roman Rite commemorates him with Titus.",
]

