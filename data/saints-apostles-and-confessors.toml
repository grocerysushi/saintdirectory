[[saints]]
id = "john-paul-ii"
name = "Saint John Paul II"
aliases = ["Pope John Paul II","Karol Józef Wojtyła","Karol Wojtyla","JP II"]
years = "1920–2005"
vocation = "Pope"
place = "Poland and Rome"
summary = "A Polish archbishop who became pope in 1978 and traveled widely during his pontificate."
biography = [
  "Karol Józef Wojtyła was born in Wadowice, Poland, in 1920. He lost close members of his family before reaching adulthood. The German occupation disrupted his university studies, and he worked while preparing for the priesthood in a clandestine seminary. He was ordained in 1946.",
  "Wojtyła pursued further studies in Rome and then returned to Poland. He served in parish and academic work and became a bishop and later archbishop of Kraków. He took part in the Second Vatican Council. His experience as a priest and bishop under communist rule continued to inform the questions he addressed as pope.",
  "The cardinals elected him in 1978. He took the name John Paul II. A visit to Poland the following year brought him before large public gatherings in his homeland. From early in the pontificate, travel became an ordinary part of the way he met local churches and spoke to audiences outside Rome.",
  "He survived an assassination attempt in 1981 and later visited the man who had shot him. His public ministry continued for many years. He encouraged international gatherings of young Catholics that developed into World Youth Day. His teaching addressed human dignity, work, family life, and relations among Christian communities.",
  "Illness increasingly limited his movements in his final years. He died in 2005 after more than twenty-six years as pope. Pope Francis canonized him in 2014. His writings and visits remain sources for studying the Catholic Church’s public life during the last decades of the twentieth century.",
]

[[saints.sources]]
title = "Franciscan Media — Saint John Paul II"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-john-paul-ii/"

