[[saints]]
id = "mary-of-bethany"
name = "Saint Mary of Bethany"
aliases = ["Mary of Bethany","Mary sister of Martha","Mary sister of Lazarus"]
years = "First century"
vocation = "Disciple"
place = "Bethany, near Jerusalem"
summary = "The sister of Martha and Lazarus who listened to Jesus and anointed his feet at Bethany."
biography = [
  "Mary appears with her sister Martha in Luke’s account of Jesus visiting a household. Mary sits at his feet to listen as Martha attends to the work of receiving a guest. The Gospel gives little background about the two sisters. This first scene shows Mary in the posture of a disciple listening to a teacher.",
  "John presents Mary and Martha as the sisters of Lazarus. After her brother dies, Mary receives word that Jesus is asking for her. She goes to meet him with people who have come to console her. At his feet she speaks of her loss. John then describes Jesus weeping before he goes to the tomb.",
  "At a meal in Bethany six days before Passover, John says Mary takes costly perfume and anoints Jesus’ feet. Judas objects that the perfume could have been sold for the poor. Jesus connects what Mary has done to his coming burial. The episode puts her gesture in the setting of the approaching Passion.",
  "The USCCB’s account of the shared memorial notes that earlier tradition sometimes identified this Mary with other women in the Gospels. The liturgical observance now names her with her siblings Martha and Lazarus. John identifies Mary of Bethany through her household and its friendship with Jesus.",
]

