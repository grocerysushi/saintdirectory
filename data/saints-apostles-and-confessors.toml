[[saints]]
id = "lazarus-of-bethany"
name = "Saint Lazarus of Bethany"
aliases = ["Saint Lazarus","Lazarus of Bethany","Lazarus the Friend of Jesus"]
years = "First century"
vocation = "Disciple"
place = "Bethany, near Jerusalem"
summary = "The brother of Martha and Mary whom Jesus calls out of the tomb in John’s Gospel."
biography = [
  "Lazarus is introduced in John as a man of Bethany and the brother of Martha and Mary. When he becomes ill, his sisters send word to Jesus. Jesus remains away for a time. By the time he reaches Bethany, Lazarus has been in the tomb for four days.",
  "Much of the account follows Jesus’ conversations with the sisters before he goes to the tomb. Martha asks about what might have happened if he had come earlier, and the conversation turns toward resurrection. Mary comes out to meet him later. Jesus sees her grief and weeps.",
  "At the tomb Jesus asks for the stone to be moved, prays, and calls Lazarus outside. John treats the event as a sign. Some people who see it come to believe, and others report what happened to the authorities. The episode becomes part of the Gospel’s account of rising opposition to Jesus before the Passion.",
  "John later describes a meal at which Lazarus sits at the table and Martha serves. Crowds come because they have heard about Lazarus, and John says the chief priests then consider killing him as well. His later life is left uncertain.",
  "The Roman calendar honors Lazarus with Martha and Mary. He is distinct from the poor man named Lazarus in the parable told in Luke’s Gospel.",
]

