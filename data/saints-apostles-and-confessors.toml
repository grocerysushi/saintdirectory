[[saints]]
id = "matthew-the-apostle"
name = "Saint Matthew the Apostle"
aliases = ["Matthew the Evangelist","Levi","Saint Matthew"]
years = "First century"
vocation = "Apostle and evangelist"
place = "Galilee"
summary = "A tax collector called by Jesus and traditionally identified with the evangelist Matthew."
biography = [
  "Matthew first appears in the Gospel that bears his name as a man sitting at a tax booth. Jesus calls him, and Matthew gets up to follow. The Gospel gives little information about his family or about the particular taxes he collected. His occupation places him among people whom the religious critics in the story regard with suspicion.",
  "The call is followed by a meal at which tax collectors and other people described as sinners are present. When the Pharisees object, Jesus explains his choice of company by comparing his work to that of a physician who attends to people who are ill. Matthew’s occupation and the meal are central to the way the Gospel tells his story.",
  "Mark and Luke tell a similar story about a tax collector they call Levi. Christian tradition has usually identified Levi with Matthew. Matthew is named among the Twelve in the apostolic lists, while the relationship between the two names depends on how the parallel Gospel accounts are read.",
  "Early Christian tradition attributes the first Gospel in the New Testament to Matthew. Its text gives no personal name for its author. It repeatedly places Jesus’ actions and teaching in conversation with Israel’s Scriptures and includes extended collections of his teaching, such as the Sermon on the Mount.",
  "Independent sources give little detail about Matthew’s later life. The Church remembers him as both apostle and evangelist. The scene at the tax booth is the most sustained narrative in the Gospels that names him directly.",
]

