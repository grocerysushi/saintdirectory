[[saints]]
id = "mary-magdalene"
name = "Saint Mary Magdalene"
aliases = ["Mary of Magdala","Magdalene","Apostle to the Apostles"]
years = "First century"
vocation = "Disciple and witness to the Resurrection"
place = "Galilee and Jerusalem"
summary = "A disciple of Jesus and the first person to encounter the risen Christ in John’s Gospel."
biography = [
  "Mary Magdalene takes her name from Magdala. Luke lists her among women who traveled with Jesus and supported his ministry. The same passage recalls that she had been delivered from seven demons. It gives no account of her family or of her life before she became a disciple.",
  "John places Mary near the cross with other women and later depicts her coming to the tomb before daylight. Seeing that the stone has been moved, she goes to tell Peter and the beloved disciple. She remains near the tomb after the others leave.",
  "In John’s narrative Mary first takes the risen Jesus for the gardener. He addresses her by name, and she recognizes him. Jesus sends her to the disciples. Her declaration that she has seen the Lord is the basis of the title Apostle to the Apostles, which draws attention to her role in transmitting the news of the Resurrection.",
  "Mary Magdalene’s identity became entangled in some later Western preaching with that of other women in the Gospels. The texts name Mary of Bethany separately. They do not name the woman in Luke who anoints Jesus while he is dining with a Pharisee. Reading the accounts separately brings Mary Magdalene’s own role as a disciple and witness into clearer view.",
  "The Roman Rite now celebrates her observance as a feast. The Gospel accounts, especially the encounter at the tomb, provide the main evidence for her life.",
]

