[[saints]]
id = "titus"
name = "Saint Titus"
aliases = ["Titus of Crete","Saint Titus of Crete"]
years = "First century"
vocation = "Bishop and missionary"
place = "Crete and the eastern Mediterranean"
summary = "A co-worker whom Paul sent to Corinth and whom the Letter to Titus places in Crete."
biography = [
  "Titus appears in Paul’s letters as a co-worker who came from a Gentile background. In Galatians, Paul describes bringing him to Jerusalem and says that Titus was not required to take on circumcision. His presence makes the question of Gentile membership in the Church concrete in an otherwise large dispute about the law.",
  "Paul entrusted Titus with work in Corinth during a difficult period. The Second Letter to the Corinthians describes Paul anxiously awaiting him and feeling relief when Titus brings news of how the community responded. Titus’s visit helped reopen communication between Paul and the church.",
  "The same letter associates Titus with organizing a collection. The work required trust as well as practical oversight. Paul speaks of Titus’s eagerness to return and names him among those charged with carrying out the collection in a way that could be accounted for publicly.",
  "The Letter to Titus places him on Crete and charges him with appointing elders in the towns. Christian tradition remembers him as a bishop of Crete on the basis of that association. These sources give a picture of a church worker moving between cities, handling difficult conversations, and helping communities establish stable leadership.",
]

