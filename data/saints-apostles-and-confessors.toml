[[saints]]
id = "james-the-greater"
name = "Saint James the Greater"
aliases = ["James son of Zebedee","Saint James the Apostle","Santiago Apóstol"]
years = "First century"
vocation = "Apostle and martyr"
place = "Galilee and Jerusalem"
summary = "One of the Twelve, James left the family fishing boat with his brother John and was later killed on Herod’s orders."
biography = [
  "James was the son of Zebedee and the brother of John. Matthew depicts them in the fishing boat with their father, preparing their nets, when Jesus calls them. The two leave their work and become part of the group that accompanies Jesus through Galilee and later to Jerusalem.",
  "James, Peter, and John are singled out at several points in the Gospels. Mark places them at the raising of Jairus’s daughter and at the Transfiguration. The same three accompany Jesus more closely in Gethsemane. These episodes set moments of public promise beside the experience of fear and suffering.",
  "In one story, James and John ask for places of honor beside Jesus. He speaks instead about the cost of following him and tells the disciples that leadership involves service. The request is one of the few scenes that shows James actively taking part in a discussion rather than simply being named as a witness.",
  "Acts records that Herod Agrippa had James killed. He is the first member of the Twelve whose martyrdom is described in Acts. A later tradition takes his preaching to Spain and associates his burial with Santiago de Compostela. The shrine and its long pilgrimage routes have a well-documented history of their own.",
  "He is called James the Greater to distinguish him from James son of Alphaeus. The Santiago tradition and the image of a pilgrim with a shell became familiar ways of identifying him in Western devotion.",
]

