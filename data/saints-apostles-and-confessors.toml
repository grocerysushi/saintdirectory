[[saints]]
id = "thomas-the-apostle"
name = "Saint Thomas the Apostle"
aliases = ["Thomas Didymus","Thomas the Twin","Doubting Thomas","Saint Thomas the Apostle"]
years = "First century"
vocation = "Apostle"
place = "Galilee and, by tradition, India"
summary = "The apostle who met the risen Jesus after asking to see his wounds."
biography = [
  "Thomas belonged to the Twelve. John gives the Greek form of his name alongside the Semitic form, both carrying the sense of twin. The Gospel gives little information about his family. What it preserves are several exchanges in which he says openly what other disciples may be finding difficult to understand.",
  "When Jesus decides to return to Judea after the death of Lazarus, Thomas recognizes the danger and urges the others to go with him. During the Last Supper, Thomas points out that the disciples do not know where Jesus is going. His question leads to Jesus’ answer about being the way, the truth, and the life.",
  "Thomas is absent from the first appearance of the risen Jesus to the assembled disciples. He asks to see the wounds himself. When Jesus returns, he addresses Thomas directly and invites him to examine them. Thomas responds by calling Jesus his Lord and God. The scene closes by turning attention to those who will believe without having been present.",
  "A longstanding tradition connects Thomas with the beginnings of Christianity in India. The communities that preserve that association are known as Saint Thomas Christians. The Gospel evidence concerns his discipleship and witness to the Resurrection. His later journey and martyrdom come from the history and traditions of the churches that remember him.",
]

