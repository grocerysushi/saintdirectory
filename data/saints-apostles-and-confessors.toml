[[saints]]
id = "john-the-baptist"
name = "Saint John the Baptist"
aliases = ["John the Forerunner","John son of Zechariah","John the Baptizer"]
years = "First century"
vocation = "Prophet and martyr"
place = "Judea and the Jordan River"
summary = "The prophet who preached repentance, baptized Jesus, and was killed by order of Herod."
biography = [
  "Luke places John’s birth beside the story of Jesus’ infancy. John’s parents, Zechariah and Elizabeth, are an older couple who have long hoped for a child. John receives an unexpected name, and Zechariah’s canticle interprets his son’s life as preparation for the Lord’s coming.",
  "As an adult John preaches in the region of the Jordan. He calls people to repentance and baptizes them. When listeners ask what they should do, he speaks about sharing food and clothing and about honest conduct in collecting taxes and exercising authority. The demands of his preaching apply to ordinary work and dealings with other people.",
  "Jesus comes to be baptized by John. The Gospels connect this moment with testimony about Jesus and the beginning of his public ministry. In John’s Gospel the Baptist points other people toward Jesus. Some of his own disciples follow the person to whom he directs them.",
  "John challenges the conduct of Herod Antipas and is imprisoned. Matthew recounts how John, from prison, sends disciples to ask Jesus about his mission. Mark describes his death at Herod’s command and the burial of his body by his disciples.",
  "The Roman Rite keeps separate observances for John’s birth and for his death. The accounts of his preaching and baptism explain why Christians also call him the Forerunner.",
]

