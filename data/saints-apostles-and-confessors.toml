[[saints]]
id = "elizabeth-mother-of-john"
name = "Saint Elizabeth, Mother of John the Baptist"
aliases = ["Elizabeth of Judea","Elisabeth","Elizabeth mother of John"]
years = "First century"
vocation = "Mother of John the Baptist"
place = "Hill country of Judea"
summary = "Zechariah’s wife and the mother of John the Baptist, Elizabeth welcomed Mary in Luke’s account of the Visitation."
biography = [
  "Elizabeth is introduced in Luke as a descendant of Aaron and as the wife of Zechariah, a priest. Luke portrays both of them as faithful to God. They have grown old without children. After Zechariah’s service in the Temple, Elizabeth conceives and spends several months in seclusion.",
  "When Mary comes to visit, the child within Elizabeth moves. Elizabeth greets Mary with a blessing and recognizes the significance of the child Mary is carrying. Luke places the encounter in Elizabeth’s home, away from the more public scenes in the Temple. Mary replies with the canticle known as the Magnificat.",
  "Neighbors and relatives rejoice when Elizabeth’s child is born. At the naming of the child, they expect a name already used in the family. Elizabeth tells them that he is to be called John. They consult Zechariah, who gives the same answer in writing. Elizabeth’s part in that decision is recorded before her husband returns to speech.",
  "Luke’s account provides almost all the narrative evidence about Elizabeth. Her meeting with Mary became the focus of the Visitation, celebrated in the Roman Rite. The episode preserves Elizabeth’s own words of recognition and blessing, while the naming scene gives another glimpse of her role as John’s mother.",
]

[[saints.sources]]
title = "USCCB, New American Bible — Luke 1"
url = "https://bible.usccb.org/bible/luke/1"

[[saints.sources]]
title = "University of Notre Dame, FaithND — Saints Elizabeth and Zechariah"
url = "https://faith.nd.edu/saint/sts-elizabeth-and-zechariah/"

[[saints]]
id = "zechariah-father-of-john"
name = "Saint Zechariah, Father of John the Baptist"
aliases = ["Zachary","Zacharias","Zechariah father of John"]
years = "First century"
vocation = "Priest and father of John the Baptist"
place = "Judea and Jerusalem"
summary = "The priest in Luke’s Gospel who heard the announcement of John the Baptist’s birth at the Temple."
biography = [
  "Luke introduces Zechariah as a priest belonging to the division of Abijah. He and Elizabeth have lived to old age without a child. During a period of service at the Temple, Zechariah is chosen by lot to enter and offer incense, while the people wait outside in prayer.",
  "In the sanctuary, the angel Gabriel announces that Elizabeth will bear a son to be called John. Zechariah asks how he can be sure, given their ages. Luke tells how he leaves the sanctuary unable to speak, and the people waiting outside realize that something has happened to him.",
  "At the child’s naming, Elizabeth says his name will be John. The relatives turn to Zechariah, and he writes the same name on a tablet. His speech returns. Luke then gives the canticle he speaks in praise of God. Known as the Benedictus, it celebrates God’s faithfulness to Israel and turns to the work the child will do.",
  "Zechariah’s subsequent life is left largely outside Luke’s account. The Benedictus gives his story a continuing place in Christian prayer. The Church uses it in the morning prayer of the Liturgy of the Hours.",
]

