id = "simon-the-zealot"
name = "Saint Simon the Zealot"
aliases = ["Simon the Cananaean","Simon the Cananean","Saint Simon the Apostle"]
years = "First century"
vocation = "Apostle"
place = "Galilee"
summary = "The apostle called the Zealot in Luke and Acts."
biography = [
  "Simon appears among the Twelve in the lists in the Gospels and in Acts. Because the lists also include Simon Peter, the writers distinguish the two by additional names. Luke calls this Simon the Zealot. Matthew and Mark use a form often translated Cananaean, which is usually understood as referring to zeal.",
  "The designation has prompted questions about Simon’s background. It certainly sets him apart from Peter in the lists. It gives too little information to establish whether he had belonged to an organized political movement. The texts contain no account of his activities before Jesus chose him.",
  "Acts names Simon among those who gather in Jerusalem after the Ascension. They pray together with the women, Mary the mother of Jesus, and Jesus’ relatives. Simon’s presence places him within that community at the outset of the events Acts goes on to describe.",
  "Different Christian traditions tell of missionary journeys and martyrdom after those events. The Roman calendar honors him with Jude. His profile rests most securely on the early lists that remember him as one of the Twelve and on the account of the community in Jerusalem.",
]

