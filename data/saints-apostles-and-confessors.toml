[[saints]]
id = "luke-the-evangelist"
name = "Saint Luke the Evangelist"
aliases = ["Luke the Physician","Saint Luke"]
years = "First century"
vocation = "Evangelist"
place = "Eastern Mediterranean"
summary = "Christian tradition attributes both the Gospel of Luke and the Acts of the Apostles to Luke."
biography = [
  "Luke is traditionally credited with the third Gospel and the Acts of the Apostles. The two works address a reader named Theophilus. The Gospel’s opening describes an author who investigated earlier material and set out to present an orderly account. Acts continues the story from the point where the Gospel reaches the Resurrection and Ascension.",
  "The Gospel gives particular attention to people whose lives might otherwise be overlooked. Its accounts of the birth of John and Jesus include the voices of Elizabeth and Mary. It also preserves stories such as the Good Samaritan and the return of the younger son, told in the course of Jesus’ ministry.",
  "Acts begins in Jerusalem and follows the early Church outward through Judea, Samaria, and the wider Mediterranean. It describes the work of Peter, Stephen, Philip, Barnabas, and Paul, among others. The final chapters follow Paul as a prisoner traveling to Rome, where he continues to preach.",
  "The Letter to the Colossians sends greetings from Luke, a physician. Christian tradition identifies him with the author of the two works and remembers him as one of Paul’s companions. The Gospel and Acts themselves leave their author unnamed. The literary relationship between the two works is clearer than the details of his personal life.",
  "The paired books trace a movement from Jesus’ ministry toward the Church’s public witness in other places and languages. That narrative is the principal reason Luke is remembered as an evangelist.",
]

