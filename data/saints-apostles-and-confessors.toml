[[saints]]
id = "bartholomew-the-apostle"
name = "Saint Bartholomew the Apostle"
aliases = ["Bartholomew","Nathanael","Nathaniel"]
years = "First century"
vocation = "Apostle"
place = "Galilee"
summary = "One of the Twelve, often identified in Christian tradition with Nathanael."
biography = [
  "Bartholomew is named among the Twelve in the Synoptic Gospels. Those lists establish his place among the apostles without telling a separate story about him. The name is usually understood as a form meaning son of Tolmai. Acts also names him among the disciples in Jerusalem after the Ascension.",
  "Christian tradition has often identified him with Nathanael, a disciple named in John. Philip brings Nathanael to Jesus after Nathanael questions his origins in Nazareth. During the encounter Jesus speaks of having seen him beneath a fig tree. Nathanael responds by acknowledging Jesus in terms of Israel’s king and God’s Son.",
  "The identification is helped by the association with Philip, whose name appears beside Bartholomew’s in several apostolic lists. John does not give Nathanael the name Bartholomew. The association therefore belongs to the way Christian tradition reads the two sets of accounts together.",
  "Stories of Bartholomew’s later mission and martyrdom vary by region. Some traditions associate him with Armenia. Artists often identify him with a knife linked to one account of his death. Such details preserve later memories about the apostle, while the early texts give very few particulars of his career.",
]

