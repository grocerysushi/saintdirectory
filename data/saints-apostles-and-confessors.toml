[[saints]]
id = "barnabas-the-apostle"
name = "Saint Barnabas the Apostle"
aliases = ["Saint Barnabas","Joseph of Cyprus","Barnabas"]
years = "First century"
vocation = "Apostle and missionary"
place = "Cyprus and Antioch"
summary = "A Cypriot Christian who introduced Paul to the Jerusalem disciples and later traveled with him."
biography = [
  "Acts introduces Barnabas as Joseph, a Levite from Cyprus. The apostles give him the name Barnabas, which Acts interprets in terms of encouragement. He sells a field and gives the proceeds to the community in Jerusalem. The first episode associated with him concerns the practical support of the young Church.",
  "When Paul comes to Jerusalem after his conversion, the disciples are afraid of him because of his earlier persecution of Christians. Barnabas brings Paul to the apostles and speaks on his behalf. Later the Jerusalem church sends Barnabas to Antioch. He seeks Paul out in Tarsus and brings him to join the work there.",
  "The church at Antioch sends the two on mission. They preach in Cyprus and in communities of Asia Minor, and they return to Antioch to describe what happened. The account shows Barnabas working both as a traveling missionary and as someone accountable to the community that sent him.",
  "Barnabas and Paul later disagree about taking John Mark on another journey. Barnabas goes to Cyprus with Mark, while Paul travels with Silas. Acts records the disagreement plainly. Paul’s own letter to the Galatians also recalls a dispute in Antioch that involved Barnabas.",
  "Barnabas is often called an apostle because of his place in the early mission. Acts uses the title for him and Paul. His distinctive role in the sources is to connect people and communities that might otherwise have remained separate.",
]

