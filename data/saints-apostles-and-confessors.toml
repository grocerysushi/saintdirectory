[[saints]]
id = "matthias-the-apostle"
name = "Saint Matthias the Apostle"
aliases = ["Saint Matthias","Matthias"]
years = "First century"
vocation = "Apostle"
place = "Jerusalem"
summary = "The disciple chosen by lot to join the Twelve after the departure of Judas Iscariot."
biography = [
  "Matthias enters the account of Acts after the Ascension. The disciples have returned to Jerusalem. Peter speaks to an assembly about the vacancy left by Judas Iscariot. He explains that the person who fills it should have accompanied the group through Jesus’ public ministry and be able to testify to the Resurrection.",
  "The group proposes two men. One is Joseph called Barsabbas, who also bears the name Justus. The other is Matthias. The community prays for guidance and casts lots. The result adds Matthias to the Eleven and restores the group of the Twelve before the narrative reaches Pentecost.",
  "The qualifications Peter gives are the main clue to Matthias’s earlier life. He was remembered as one who had already accompanied Jesus and the disciples over a period of years. The account supplies no details about his family, hometown, or earlier occupation.",
  "Acts gives no separate narrative of Matthias’s later work. The places associated with his preaching and death in devotional accounts therefore belong to later tradition. His place in the early Church is clearest in the Jerusalem assembly and in the responsibility to bear witness that it gave him.",
]

[[saints.sources]]
