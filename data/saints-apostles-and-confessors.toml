[[saints]]
id = "joseph"
name = "Saint Joseph"
aliases = ["Joseph of Nazareth","Joseph the Worker","Spouse of the Blessed Virgin Mary"]
years = "First century"
vocation = "Spouse of Mary"
place = "Nazareth and Bethlehem"
summary = "The spouse of Mary who cares for Jesus in the infancy narratives."
biography = [
  "Joseph appears in Matthew and Luke as Mary’s spouse and the man who takes responsibility for Jesus in his early life. Matthew places Joseph within the line of David. When he learns that Mary is expecting a child, he plans to end their betrothal quietly. The angel’s message in a dream leads him to take Mary into his household and give the child the name Jesus.",
  "Matthew repeatedly presents Joseph receiving direction while the family is vulnerable. He takes Mary and Jesus to Egypt when Herod threatens the child. After Herod’s death he brings them back and settles in Nazareth. The story is told through Joseph’s decisions and movements.",
  "In Luke, Joseph and Mary travel to Bethlehem and later bring Jesus to the Temple. They return to Jerusalem when Jesus is twelve. After discovering that he is missing from their group, they search for him and find him among the teachers. Luke’s portrait of Joseph is closely bound to those shared responsibilities.",
  "The Gospels preserve Joseph’s actions, without recording any words spoken by him. Matthew later refers to Jesus as the carpenter’s son. This reference and the family’s life in Nazareth shape the way Catholics remember Joseph’s work as well as his place in the household.",
  "The Church celebrates Joseph as the spouse of Mary and also commemorates Saint Joseph the Worker. Pope Francis’s Patris Corde reflects on Joseph’s fatherhood, his work, and his courage in caring for the family. The letter was written for the anniversary of his proclamation as patron of the universal Church.",
]

