[[saints]]
id = "jude-thaddeus"
name = "Saint Jude Thaddeus"
aliases = ["Jude the Apostle","Saint Jude","Thaddaeus","Judas son of James"]
years = "First century"
vocation = "Apostle"
place = "Galilee"
summary = "A member of the Twelve traditionally identified with Thaddeus."
biography = [
  "Jude is the usual English form of the name Judas when it refers to this apostle. Luke lists Judas son of James among the Twelve. Matthew instead includes Thaddeus in the corresponding group. Christian tradition generally reads those lists as referring to the same apostle and uses the combined name Jude Thaddeus.",
  "In John’s account of the Last Supper, a man named Judas who is distinguished from Judas Iscariot asks a question about how Jesus will reveal himself. Jesus answers by speaking about love, keeping his word, and the presence of God with those who do so. It is the fullest Gospel exchange commonly associated with Jude.",
  "The short Letter of Jude begins by identifying its writer as a servant of Jesus Christ and brother of James. Christian readers have associated it with the apostle. The relationship between the identities given in the letter and in the Gospel lists is a question of interpretation. The letter itself calls for perseverance and care for people whose faith is unsettled.",
  "Details of Jude’s later ministry and death survive chiefly in tradition. The Roman calendar honors him with Simon the Zealot. The names Jude and Thaddeus help distinguish his place in Christian memory from that of Judas Iscariot.",
]

