[[saints]]
id = "martha-of-bethany"
name = "Saint Martha of Bethany"
aliases = ["Saint Martha","Martha of Bethany"]
years = "First century"
vocation = "Disciple"
place = "Bethany, near Jerusalem"
summary = "The sister of Mary and Lazarus who welcomed Jesus and professed faith in him after Lazarus’ death."
biography = [
  "Luke describes Martha welcoming Jesus into her home while Mary, her sister, sits listening to him. Martha is occupied with serving and asks Jesus to intervene. Jesus speaks to her about the many things leaving her anxious and draws attention to the importance of what Mary is doing. The scene begins with Martha’s hospitality.",
  "John places the sisters and their brother Lazarus in Bethany near Jerusalem. When Lazarus becomes ill, they send word to Jesus. Martha goes out to meet him after Lazarus has died. She speaks about what she believes might have happened if he had arrived sooner and about her hope that God still hears him.",
  "The conversation turns to resurrection. Martha speaks of her expectation that her brother will rise on the last day. Jesus speaks of resurrection and life in relation to himself. Martha’s declaration of faith comes before her brother leaves the tomb.",
  "At a later meal in John, Martha again serves. Lazarus is among those at the table, and Mary anoints Jesus’ feet. This second scene of hospitality is set close to Passover, with the events of Lazarus’s return from the tomb in the background.",
  "The Roman calendar celebrates Martha, Mary, and Lazarus together. Their shared observance draws on the Gospel picture of a household that opens its doors to Jesus and responds to him in different ways.",
]

