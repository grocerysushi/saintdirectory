[[saints]]
id = "mark-the-evangelist"
name = "Saint Mark the Evangelist"
aliases = ["John Mark","Saint Mark","Mark the Evangelist"]
years = "First century"
vocation = "Evangelist"
place = "Jerusalem and the Mediterranean world"
summary = "The evangelist traditionally associated with Peter’s preaching and the Gospel of Mark."
biography = [
  "Acts introduces a man called John Mark through the house of his mother, Mary, in Jerusalem. When Peter escapes from prison, he goes to that house, where members of the Christian community have gathered to pray. The passage gives a brief view of the households that supported the early Church.",
  "Mark went with Barnabas and Paul on a mission described in Acts. He left them at Perga and returned to Jerusalem. When Barnabas later wanted to take him again, Paul objected because of his earlier departure. Barnabas took Mark to Cyprus, while Paul chose another companion and traveled by a different route.",
  "The First Letter of Peter sends greetings from a Mark whom Peter calls his son. Christian tradition connects the evangelist with Peter and understands his Gospel as preserving material drawn from Peter’s preaching. The relationship between the people named Mark in these separate texts belongs to the traditional identification.",
  "The Gospel of Mark begins with the ministry of John the Baptist and moves quickly into Jesus’ public work. Much of the latter part leads toward Jerusalem and the Passion. The Gospel moves between accounts of healing, exchanges about Jesus’ identity, and the disciples’ difficulty understanding what they see.",
  "Christian traditions also connect Mark with Alexandria. The most immediate New Testament evidence concerns his association with the first Christian communities and missionaries. His lasting place in Christian worship comes principally through the Gospel attributed to him.",
]

