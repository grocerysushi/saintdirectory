[[saints]]
id = "peter-to-rot"
name = "Saint Peter To Rot"
aliases = ["Pietro To Rot","Peter ToRot"]
years = "1912–1945"
vocation = "Lay catechist and martyr"
place = "Rakunai, New Britain, Papua New Guinea"
summary = "A husband, father, and lay catechist who cared for Catholic communities in New Britain during the Second World War."
biography = [
  "Peter grew up in Rakunai on the island of New Britain. His parents, Angelo To Puia and Maria Ia Tumul, were among the early adult converts to Catholicism in their community. Peter trained as a catechist and returned to Rakunai in 1933. He married Paula Ia Varpit in 1936, and together they had three children.",
  "Japanese forces occupied part of what is now Papua New Guinea in 1942 and detained foreign missionaries. Peter took on greater responsibility for Catholics in Rakunai and nearby villages. He visited people who were sick, baptized children, led prayer, helped couples prepare for marriage, buried the dead, and distributed Communion when consecrated hosts could be obtained.",
  "As occupation authorities restricted religious activity, Peter continued his work. His defense of Christian marriage also drew opposition when officials supported a return to polygamy. The Dicastery for the Causes of Saints records that he was arrested for persevering in his ministry and killed by poisoning while in detention in 1945.",
  "Local Catholics honored him as a martyr and made his grave a place of prayer. John Paul II beatified him in 1995. Pope Leo XIV canonized him on October 19, 2025. The recognition brought wider attention to a lay catechist whose responsibilities for his family and village continued even when priests could no longer minister openly there.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Peter To Rot"
url = "https://www.causesanti.va/it/santi-e-beati/pietro-to-rot.html"

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Canonizations of October 19, 2025"
url = "https://www.causesanti.va/it/celebrazioni/canonizzazioni/2025/10/19.html"

[[saints]]
id = "pedro-calungsod"
name = "Saint Pedro Calungsod"
aliases = ["Peter Calungsod","Pietro Calungsod","San Pedro Calungsod"]
years = "c. 1654–1672"
vocation = "Lay catechist and martyr"
place = "Visayas, Philippines, and Guam, Mariana Islands"
summary = "A teenage Filipino catechist who traveled with a Jesuit mission to the Mariana Islands and was killed in Guam."
biography = [
  "Pedro Calungsod came from the Visayas in the Philippines and was born around 1654. The sources used by the Church record more about his work as a catechist than about his family or early childhood. He received instruction from Jesuit missionaries and joined other young lay catechists in preparing to teach the faith.",
  "In 1668 Pedro accompanied the Jesuit priest Diego Luis de San Vitores to the Mariana Islands. Their mission brought the catechists into contact with Chamorro communities in Guam. Pedro helped teach people the basic beliefs and practices of Christianity. The surviving accounts place him in the daily work of the mission and describe him continuing his service when hostility against it grew.",
  "Pedro and San Vitores were killed in Guam on April 2, 1672. At Pedro’s canonization, Benedict XVI referred to witnesses who said that Pedro could have fled but stayed with the priest. The accounts preserve that decision even though many ordinary details of Pedro’s short life were never recorded.",
  "John Paul II beatified Pedro in 2000, and Benedict XVI canonized him on October 21, 2012. Remembered in the Philippines and the Marianas, he was a young lay member of a mission whose religious instruction depended in part on the work of catechists like him.",
]

[[saints.sources]]
title = "Benedict XVI — Homily at the canonization of Pedro Calungsod"
url = "https://www.vatican.va/content/benedict-xvi/en/homilies/2012/documents/hf_ben-xvi_hom_20121021_canonizzazioni.html"

[[saints.sources]]
title = "Archdiocese of Washington — Saint Pedro Calungsod"
url = "https://adw.org/wp-content/uploads/sites/2/2024/03/2024-St.-Pedro-Calungsod-brief-profile-feb27.pdf"

[[saints]]
id = "joseph-vaz"
name = "Saint Joseph Vaz"
aliases = ["José Vaz","Joseph Vaz of Goa","Apostle of Sri Lanka","Apostle of Ceylon"]
years = "1651–1711"
vocation = "Oratorian priest and missionary"
place = "Goa, India, and Kandy, Sri Lanka"
summary = "A Goan Oratorian priest who served Catholic communities in Sri Lanka and cared for people during a smallpox epidemic."
biography = [
  "Joseph Vaz was born in Goa in 1651 and trained for the priesthood there. After working in Mangalore he joined a group of Goan priests who adopted the rule of Saint Philip Neri’s Oratory. They elected him their first superior. His desire to serve Catholics in Sri Lanka led him to leave Goa again and arrive in Jaffna in 1687.",
  "Dutch authorities restricted Catholic ministry in the areas they controlled. Vaz traveled in disguise and relied on local Catholic families for shelter and introductions. He met small groups of worshipers, often at night, to celebrate Mass and administer the sacraments. When his presence was discovered he went to Kandy, where he was initially imprisoned under suspicion of serving Portuguese interests.",
  "Vaz was eventually allowed greater freedom. During a smallpox epidemic in Kandy he nursed people who lacked care and helped provide shelter and supplies. Pope Francis later noted that his work with the sick helped earn the king’s trust. Other Goan Oratorians came to join him, giving the mission a lasting community of priests.",
  "Vaz died in Kandy in 1711. Pope Francis canonized him in Colombo on January 14, 2015. In the homily Francis emphasized the care Vaz gave to people across religious divides. His ministry is remembered both for restoring regular sacramental life to Catholic communities and for the help he offered to their neighbors.",
]

[[saints.sources]]
title = "Toronto Oratory — Saint Joseph Vaz"
url = "https://oratory-toronto.org/heroes/saint-joseph-vaz/"

[[saints.sources]]
title = "Francis — Homily at the canonization of Joseph Vaz in Colombo"
url = "https://www.vatican.va/content/francesco/en/homilies/2015/documents/papa-francesco_20150114_srilanka-filippine-omelia-canonizzazione.html"

[[saints]]
id = "devasahayam-pillai"
name = "Saint Devasahayam Pillai"
aliases = ["Devasahayam","Lazarus Devasahayam Pillai","Lazzaro Devasahayam Pillai","Neelakanta Pillai"]
years = "1712–1752"
vocation = "Lay Catholic and martyr"
place = "Kingdom of Travancore, southern India"
summary = "A married official of Travancore who became Catholic and was imprisoned and executed after refusing to give up his faith."
biography = [
  "Devasahayam was born into a Hindu family in Nattalam in the kingdom of Travancore in 1712. Known before baptism as Neelakanta Pillai, he served at the royal court. He became friends with Eustachius de Lannoy, a Catholic military officer who entered the king’s service after the defeat of the Dutch at Colachel.",
  "The account preserved by the Dicastery for the Causes of Saints recalls that De Lannoy spoke with him about the story of Job at a time of family hardship. Devasahayam sought instruction from a Jesuit priest. He was baptized in 1745 and took the name Devasahayam, rendered as Lazarus in church records. His wife also received baptism, taking the name Gnanappoo.",
  "His conversion drew opposition at court. He was arrested in 1749. According to the Church’s account, officials pressed him to return to his former religious practices, and he continued to profess his Christian faith through years of imprisonment. He was executed near Aralvaimozhy in January 1752. Local Catholics recovered his remains and buried him at the church that became the cathedral of Kottar.",
  "The faithful in southern India continued to honor him as a martyr. Pope Francis canonized him on May 15, 2022. His recognition was significant for Indian Catholics as the canonization of a layman whose life had been spent among his family and in public service.",
]

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Lazarus Devasahayam Pillai"
url = "https://www.causesanti.va/it/santi-e-beati/devasahayam-pillai.html"

[[saints.sources]]
title = "Dicastery for the Causes of Saints — Canonizations of May 15, 2022"
url = "https://www.causesanti.va/it/celebrazioni/canonizzazioni/2022/05/15.html"

[[saints]]
id = "gonsalo-garcia"
name = "Saint Gonsalo Garcia"
aliases = ["Gonçalo Garcia","Gonzalo García","Gonsalvo Garcia","Gonsalo Garcia of Bassein"]
years = "c. 1556–1597"
vocation = "Franciscan lay brother, interpreter, and martyr"
place = "Bassein, India, Manila, Philippines, and Nagasaki, Japan"
summary = "An Indian-born Franciscan brother and interpreter executed with Paul Miki and their companions at Nagasaki."
biography = [
  "Gonsalo Garcia was born around 1556 in the fortified port of Bassein, now Vasai, on India’s west coast. His father was Portuguese and his mother came from the local population. He received an education with the Jesuits and traveled with missionaries to Japan, where he learned Japanese and worked as a catechist.",
  "After a period in commerce, Garcia joined the Franciscans and spent time with them in Manila. His knowledge of Japanese made him useful as an interpreter. In 1593 he accompanied a delegation that went from Manila to Japan. His work required him to move between religious communities, merchants, and officials across several ports.",
  "The climate for foreign missionaries and local Christians changed in the 1590s. Garcia was arrested with members of the Franciscan mission under the ruler Toyotomi Hideyoshi. In February 1597 he was one of twenty-six Christians taken to Nagasaki and executed. The group included Franciscan missionaries, Japanese laypeople, and Jesuits, among them Paul Miki.",
  "Pope Pius IX canonized the group in 1862. The General Roman Calendar commemorates them as Saint Paul Miki and Companions. Garcia’s record preserves the story of a brother whose work in Japan depended on language skills and relationships acquired over years of travel between India, the Philippines, and Japan.",
]

[[saints.sources]]
title = "Archdiocese of Chicago Asian Catholic Initiative — Saint Gonsalo Garcia"
url = "https://aci.archchicago.org/asian-icons/st-gonsalo-garcia"

[[saints.sources]]
title = "Commission on the Franciscan Intellectual Tradition — Memorializing the first Japanese martyrs"
url = "https://www.franciscantradition.org/blog/memorializing-the-first-japanese-martyrs-cvrawb/"

[[saints]]
id = "joseph-mukasa-balikuddembe"
name = "Saint Joseph Mukasa Balikuddembe"
aliases = ["Joseph Mukasa","Mukasa Balikuddembe","Joseph Balikuddembe"]
years = "c. 1860–1885"
vocation = "Court steward and martyr"
place = "Kingdom of Buganda, present-day Uganda"
summary = "A Catholic leader and steward at the court of Buganda who was the first of the twenty-two canonized Ugandan martyrs to die."
biography = [
  "Joseph Mukasa entered the royal court of Buganda as a page and rose to serve as a steward under Kabaka Muteesa I. At court he encountered Catholic teaching. He became a Christian and helped instruct others. When foreign missionaries were absent for a period, he was one of the lay leaders who kept catechesis and prayer going.",
  "Joseph remained at court after Mwanga II succeeded his father. The Kampala Archdiocese describes Joseph as a senior adviser. Accounts of the court remember his efforts to protect younger pages from abuse. He also objected to the king’s decision to have the Anglican missionary bishop James Hannington killed.",
  "Joseph was executed at Nakivubo on November 15, 1885. The accounts remember a message he entrusted to others before his death, offering forgiveness to the king and asking him to repent. Charles Lwanga later took responsibility for Christian pages at court. Many of them were killed in 1886, months after Joseph’s death.",
  "Pope Paul VI canonized Joseph with the Catholic martyrs of Uganda on October 18, 1964. He is part of the group commemorated as Charles Lwanga and Companions. His earlier death and the teaching he carried out among the pages show how the community developed before the executions for which the group is collectively remembered.",
]

[[saints.sources]]
title = "Kampala Archdiocese — The twenty-two Catholic martyrs of Uganda"
url = "https://www.kampalarchdiocese.org/the-account-of-the-twenty-two-catholic-uganda-martyrs-a-history-of-faith-and-sacrifice/"

[[saints.sources]]
title = "Notre Dame Church Life Journal — The personal stories of the Ugandan martyrs"
url = "https://churchlifejournal.nd.edu/articles/the-ugandan-martyrs/"

[[saints]]
id = "kizito"
name = "Saint Kizito"
aliases = ["Kizito of Uganda","Kizito of Buganda"]
years = "c. 1872–1886"
vocation = "Royal page and martyr"
place = "Kingdom of Buganda, present-day Uganda"
summary = "The youngest of the twenty-two Catholic martyrs of Uganda, baptized shortly before he was killed at Namugongo."
biography = [
  "Kizito was a page in the royal court of Buganda. He was about fourteen when he died, the youngest among the twenty-two Catholic martyrs. Much of what survives about him concerns the short interval between his repeated requests to be baptized and the final persecution of the court’s Christians.",
  "The pages learned about Christianity from older members of the household and through the mission. Accounts of Kizito recall how persistently he asked the missionaries for baptism. As killings at the court began in May 1886, Charles Lwanga baptized young people who were still preparing to enter the Church, including Kizito.",
  "Kizito and other pages refused to abandon their faith when questioned by Kabaka Mwanga II. They were taken toward Namugongo, where Kizito was killed on June 3, 1886. Later accounts remember Charles comforting Kizito before they died. The recollection gives one detail about the care older members of the group offered those who were young and frightened.",
  "Pope Paul VI canonized Kizito and the other Catholic martyrs in 1964. The memorial of Charles Lwanga and Companions includes him. Many pilgrims continue to travel to Namugongo each June, where a shrine preserves the memory of Kizito and others who died during the persecution.",
]

[[saints.sources]]
title = "Kampala Archdiocese — The twenty-two Catholic martyrs of Uganda"
url = "https://www.kampalarchdiocese.org/the-account-of-the-twenty-two-catholic-uganda-martyrs-a-history-of-faith-and-sacrifice/"

[[saints.sources]]
title = "Notre Dame Church Life Journal — The personal stories of the Ugandan martyrs"
url = "https://churchlifejournal.nd.edu/articles/the-ugandan-martyrs/"

[[saints]]
id = "daniel-comboni"
name = "Saint Daniel Comboni"
aliases = ["Daniele Comboni","Bishop Daniel Comboni"]
years = "1831–1881"
vocation = "Missionary bishop and religious founder"
place = "Limone sul Garda, Italy, and Khartoum, Sudan"
summary = "A bishop and founder who argued that African Christians should have a leading role in the Church’s work in Africa."
biography = [
  "Daniel Comboni grew up in a family of farmworkers near Lake Garda in northern Italy. He studied at the institute of Nicola Mazza in Verona, where he heard accounts of Catholic missions in Africa. He was ordained a priest in 1854. Three years later he joined a group that set out for the mission of Central Africa.",
  "After returning to Europe he began developing a different approach to missionary work. In 1864 he drew up a plan that called for preparing African Christians to lead the work of evangelization and education among their own communities. He also traveled to raise support and started a magazine to keep people in Italy informed about the mission.",
  "Comboni founded missionary institutes for men in 1867 and women in 1872. They became the Comboni Missionaries and the Comboni Missionary Sisters. Appointed vicar apostolic of Central Africa and ordained a bishop in 1877, he served during a severe drought and famine. He also opposed the slave trade and continued to argue for the responsibilities of African members of the Church.",
  "He died in Khartoum in 1881. John Paul II canonized him on October 5, 2003. The institutes he founded carried forward his work. His plan remains a record of how he tried to rethink the place of local people in the institutions and day-to-day work of a nineteenth-century mission.",
]

[[saints.sources]]
title = "Holy See — Daniel Comboni’s canonization biography"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20031005_comboni_en.html"

[[saints.sources]]
title = "Francis — General audience on Saint Daniel Comboni"
url = "https://www.vatican.va/content/francesco/en/audiences/2023/documents/20230920-udienza-generale.html"

[[saints]]
id = "benedict-the-moor"
name = "Saint Benedict the Moor"
aliases = ["Benedict the African","Benedict of San Fratello","Benedict of Palermo","Benedetto da Palermo"]
years = "c. 1525–1589"
vocation = "Franciscan lay brother and spiritual guide"
place = "San Fratello and Palermo, Sicily"
summary = "A Sicilian Franciscan of African descent whose community entrusted him with leadership after years of service as a cook."
biography = [
  "Benedict was born at San Fratello in Sicily in the 1520s. His family was of African descent and had experienced slavery. Franciscan accounts describe him as free from birth. He worked with livestock as a young man and later entered a community of hermits near his home. That community followed the Franciscan rule and placed great emphasis on prayer and solitude.",
  "He spent years as a hermit before becoming a lay brother at the Friars Minor’s house of Santa Maria di Gesù in Palermo. He worked in the kitchen and was known for the welcome he gave people who sought help. The friars later chose him as their guardian and entrusted him with the formation of novices, despite his lack of formal schooling.",
  "Benedict became known in Palermo as a spiritual adviser. He eventually returned to kitchen work after serving in leadership. He died in Palermo in 1589. Veneration spread through Sicily and beyond, especially among communities of African descent in the Americas.",
  "Pope Pius VII canonized him in 1807. He is also known as Benedict the African or Benedict of Palermo. The name Benedict the Moor reflects an older Italian description of his appearance, while the other names identify his African ancestry and the Sicilian city where he spent much of his religious life.",
]

[[saints.sources]]
title = "Order of Friars Minor — Saint Benedict the Moor"
url = "https://ofm.org/en/saint-benedict-the-moor.html"

[[saints.sources]]
title = "Commission on the Franciscan Intellectual Tradition — Benedict the African"
url = "https://www.franciscantradition.org/blog/benedict-the-african-38lmaa/"

[[saints]]
id = "alphonsa-of-the-immaculate-conception"
name = "Saint Alphonsa of the Immaculate Conception"
aliases = ["Alphonsa","Alphonsa Muttathupadathu","Anna Muttathupadathu","Annakutty","Annakkutty"]
years = "1910–1946"
vocation = "Franciscan Clarist sister and teacher"
place = "Kudamalur and Bharananganam, Kerala, India"
summary = "A Syro-Malabar Catholic sister who taught children and served her community in Kerala through years of illness."
biography = [
  "Alphonsa was born in Kudamalur in 1910 and baptized in the Syro-Malabar Church. Her baptismal name, Annakutty, is a familiar form of Anne. Her mother died when she was an infant, and she spent part of her childhood with her grandparents. She remembered family evening prayer and her first Communion as important parts of those early years.",
  "She wanted to enter religious life despite pressure from relatives to marry. With the guidance of a priest, she came into contact with the Franciscan Clarist Congregation at Bharananganam. She began her postulancy in 1928 and took the name Alphonsa of the Immaculate Conception. Illness delayed her admission to the novitiate, and she made her perpetual profession in 1936.",
  "Alphonsa taught children for a time at Vakakkad. As her health worsened, she continued with work she could manage, including helping with catechesis and writing letters for the community. Her own surviving correspondence records how she understood her vocation and the effects of repeated illness on her life as a sister.",
  "She died at Bharananganam in 1946. Her tomb became a place of prayer. John Paul II beatified her in Kerala in 1986, and Benedict XVI canonized her on October 12, 2008. Catholics in India remember her especially within the Syro-Malabar Church in which she grew up and entered religious life.",
]

[[saints.sources]]
title = "Holy See — Alphonsa of the Immaculate Conception’s canonization biography"
url = "https://www.vatican.va/news_services/liturgy/saints/2008/ns_lit_doc_20081012_alfonsa_en.html"

[[saints.sources]]
title = "Benedict XVI — Homily at the canonization of Alphonsa of the Immaculate Conception"
url = "https://www.vatican.va/content/benedict-xvi/en/homilies/2008/documents/hf_ben-xvi_hom_20081012_canonizzazioni.html"
