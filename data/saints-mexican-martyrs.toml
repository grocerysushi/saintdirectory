[[saints]]
id = "luis-batis-sainz"
name = "Saint Luis Batis Sáinz"
aliases = ["Luis Bátiz Sáinz", "José Luis Amado Batis Sáinz", "Luis Batis of Chalchihuites"]
years = "1870–1926"
vocation = "Diocesan priest and martyr"
place = "Zacatecas and Durango, Mexico"
summary = "A parish priest who helped organize Catholic youth in Chalchihuites and died with three lay members of his parish."
biography = [
  "Luis Batis Sáinz was born in 1870 at San Miguel del Mezquital, now Miguel Auza, in Zacatecas. An older brother who was already a priest encouraged him to enter the diocesan seminary. Batis was ordained in Durango in 1894 and began his ministry in San Juan de Guadalupe. He later spent about twenty years serving the parish of San Diego de Alcalá in Canatlán.",
  "In Canatlán he set up a hospital for people who could not afford care, developed catechism programs, and organized parish schools. He also served as spiritual director at the diocesan seminary in Durango. After he became pastor of San Pedro in Chalchihuites in 1925, he revived its local chapter of a Catholic youth association and helped young parishioners take on responsibilities of their own.",
  "When the bishops suspended public worship in 1926 amid the enforcement of new penalties on religious activity, Batis continued to live near his parishioners. Soldiers arrested him on the night of August 14. They took him away the following day with three lay Catholics from the parish, Manuel Morales, Salvador Lara Puente, and David Roldán Lara.",
  "The Holy See’s account records that Batis pleaded for Morales because he had a wife and children. When the soldiers refused, Batis gave him absolution. The four were killed outside Chalchihuites on August 15, 1926. John Paul II beatified them in 1992 and canonized them in 2000 among Christopher Magallanes and Companions.",
]

[[saints.sources]]
title = "Holy See — Canonization biography of Luis Batis Sáinz"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20000521_batis-sainz_sp.html"

[[saints.sources]]
title = "Diccionario de Historia Cultural de la Iglesia en América Latina — Luis Batis Sáinz"
url = "https://www.dhial.org/diccionario/index.php?title=BATIS_S%C3%81INZ,_San_Luis"

[[saints]]
id = "manuel-morales"
name = "Saint Manuel Morales"
aliases = ["Manuel Morales Cervantes", "Manuel Morales of Chalchihuites"]
years = "1898–1926"
vocation = "Lay Catholic organizer and martyr"
place = "Mesillas and Chalchihuites, Zacatecas, Mexico"
summary = "A father of three who organized locally for religious freedom and was killed after seeking his parish priest’s release."
biography = [
  "Manuel Morales was born in Mesillas in 1898 and grew up with his grandparents in Chalchihuites, Zacatecas. He attended the seminary in Durango for several years. His grandfather’s death brought him back home to support his grandmother. He married Consuelo Loera in 1921, and they had three children.",
  "Morales led a Catholic workers’ association and belonged to the Catholic Action of Mexican Youth. He also headed the local committee of the National League for the Defense of Religious Liberty. The Vatican’s biography describes the league’s work as a peaceful effort to repeal the laws restricting religious practice. These responsibilities brought Morales into close cooperation with his parish priest, Luis Batis Sáinz.",
  "On August 15, 1926, Morales learned that Batis had been arrested. He gathered a group of young people to discuss how to seek his release. Soldiers arrived during the gathering and called for Morales by name. They took him into custody and transported him outside town with Batis and two other lay parishioners, Salvador Lara Puente and David Roldán Lara.",
  "Batis asked the soldiers to spare Morales because of his family. According to the canonization account, Morales answered that he trusted God to care for his wife and children. All four men were killed that day. Morales was among the three laypeople canonized with Christopher Magallanes in 2000. His work in Chalchihuites shows how much parish life depended on lay organizers as well as priests.",
]

[[saints.sources]]
title = "Holy See — Canonization biography of Manuel Morales"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20000521_morales_sp.html"

[[saints.sources]]
title = "Diccionario de Historia Cultural de la Iglesia en América Latina — The martyrs of Chalchihuites"
url = "https://www.dhial.org/diccionario/index.php?title=BATIS_S%C3%81INZ,_San_Luis"

[[saints]]
id = "mateo-correa-magallanes"
name = "Saint Mateo Correa Magallanes"
aliases = ["Matthew Correa Magallanes", "Mateo Correa", "Mateo Correa Megallanes"]
years = "1866–1927"
vocation = "Diocesan priest and martyr"
place = "Zacatecas, Jalisco, and Durango, Mexico"
summary = "A parish priest executed in Durango after refusing to disclose what prisoners had told him in confession."
biography = [
  "Mateo Correa Magallanes was born in Tepechitlán, Zacatecas, in 1866. With financial help he was able to finish his early schooling in Guadalajara and enter the seminary in Zacatecas in 1881. He was ordained in 1893. His first assignments included chaplaincies on rural estates and ministry in the district of Valparaíso.",
  "Correa later served several parishes in Zacatecas and Jalisco, including Concepción del Oro and Colotlán. He helped form seminarians during a later appointment at Colotlán and supported local chapters of the Catholic Action of Mexican Youth. Preaching and hearing confessions were continuing parts of his work as he moved between assignments.",
  "During the conflict over religious restrictions, Correa was detained more than once. After his final arrest in early 1927 the authorities held him in Fresnillo and transferred him to Durango. General Eulogio Ortiz directed him to hear the confessions of prisoners who were to be executed. After Correa visited them, Ortiz demanded that he disclose what they had said.",
  "Correa refused because a priest is bound to keep the contents of a sacramental confession confidential. His captors had him shot outside Durango on February 6, 1927. The Church remembers him especially for keeping the seal of confession when lives were at stake. He was canonized in 2000 as one of the companions of Christopher Magallanes.",
]

[[saints.sources]]
title = "Holy See — Canonization biography of Mateo Correa Magallanes"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20000521_correa-megallanes_sp.html"

[[saints.sources]]
title = "Knights of Columbus — Saint Mateo Correa Magallanes"
url = "https://www.kofc.org/es/recursos/fe-formacion/recursos-de-fe/martires-mexicanos/san-mateo/"

[[saints]]
id = "jose-maria-robles-hurtado"
name = "Saint José María Robles Hurtado"
aliases = ["José María Robles", "Father Robles of Tecolotlán"]
years = "1888–1927"
vocation = "Diocesan priest, religious founder, and martyr"
place = "Jalisco and Zacatecas, Mexico"
summary = "A pastor in Tecolotlán who founded a congregation of sisters and continued to serve his parish in hiding."
biography = [
  "José María Robles Hurtado was born in Mascota, Jalisco, in 1888. He entered the seminary in Guadalajara and spent time in missionary work in Tehuantepec, Oaxaca, before his ordination in 1913. His devotion to the Sacred Heart of Jesus informed both the short works he wrote for parish readers and the religious community he founded.",
  "In Nochistlán he founded the institute now known as the Sisters of the Eucharistic Heart of Jesus. He became pastor of Tecolotlán in 1920. A Knights of Columbus account credits his time there with projects that included schools, a hospital, and circles for workers. His ministry gave parishioners places to learn, organize, and care for one another.",
  "When public worship was suspended, Robles remained in Tecolotlán and took refuge in private homes. Soldiers arrested him on June 25, 1927, as he prepared to celebrate Mass. Neighbors sought legal protection for him. His breviary, which a guard handed back to parishioners, contained a recent poem in which he linked his devotion to the Sacred Heart with his expectation of death.",
  "He was taken into the Sierra de Quila and hanged that June. The Archdiocese of Guadalajara records that his remains were taken to Guadalajara in 1932 and are now venerated by the congregation he founded. In 2000 John Paul II canonized him among the twenty-five Mexican martyrs known as Christopher Magallanes and Companions.",
]

[[saints.sources]]
title = "Holy See — Canonization biography of José María Robles Hurtado"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20000521_robles-hurtado_sp.html"

[[saints.sources]]
title = "Archdiocese of Guadalajara — José María Robles Hurtado"
url = "https://arquidiocesisgdl.org/beatos.php?id=45"

[[saints.sources]]
title = "Knights of Columbus — Saint José María Robles Hurtado"
url = "https://www.kofc.org/es/recursos/fe-formacion/recursos-de-fe/martires-mexicanos/san-jose/"

[[saints]]
id = "sabas-reyes-salazar"
name = "Saint Sabás Reyes Salazar"
aliases = ["Sabás Reyes", "Father Reyes of Tototlán"]
years = "1883–1927"
vocation = "Diocesan priest and martyr"
place = "Cocula and Tototlán, Jalisco, Mexico"
summary = "A parish vicar who taught young people in Tototlán and stayed with the parish during the persecution of priests."
biography = [
  "Sabás Reyes Salazar was born in Cocula, Jalisco, in 1883 and was ordained in 1911. He served as a parish vicar at Tototlán. The biography prepared for his canonization records his devotion to the Trinity and his regular prayers for the dead. It also recalls his attention to the daily responsibilities of parish ministry.",
  "Reyes devoted much of his work to children and young people. He taught catechism and encouraged education in science, trades, and the arts, with a particular interest in music. His concern for teaching extended beyond preparation for the sacraments. It belonged to the parish’s work of forming young people who would spend their lives in the community.",
  "As the enforcement of religious restrictions made it dangerous for priests to remain at their posts, friends urged Reyes to leave Tototlán. He stayed. During Holy Week in 1927, federal troops and local agrarian fighters came looking for the parish pastor, Francisco Vizcarra, and his assistants. Reyes was the priest they found. They imprisoned him in the parish church and tortured him over several days.",
  "On April 13, the Wednesday of Holy Week, Reyes was taken to the cemetery and shot. The Holy See’s biography records that he acclaimed Christ the King before dying. His ministry and death in Tototlán form part of the history of Christopher Magallanes and Companions, the group that John Paul II canonized in May 2000.",
]

[[saints.sources]]
title = "Holy See — Canonization biography of Sabás Reyes Salazar"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20000521_reyes-salazar_sp.html"

[[saints.sources]]
title = "Santi e Beati — Sabás Reyes Salazar, priest and martyr"
url = "https://www.santiebeati.it/dettaglio/90129"

[[saints]]
id = "toribio-romo-gonzalez"
name = "Saint Toribio Romo González"
aliases = ["Toribio Romo", "Santo Toribio", "Father Toribio of Tequila"]
years = "1900–1928"
vocation = "Diocesan priest and martyr"
place = "Santa Ana de Guadalupe and Tequila, Jalisco, Mexico"
summary = "A young priest who continued preparing children for Communion and administering the parish of Tequila during religious restrictions."
biography = [
  "Toribio Romo González was born in 1900 in Santa Ana de Guadalupe, a village belonging to the parish of Jalostotitlán in Jalisco. He was ordained in December 1922. When he was given charge of the parish of Tequila during the Cristero conflict, priests there faced active pursuit by civil and military authorities.",
  "Romo found refuge near the ranch of Agua Caliente in a disused tequila distillery. He used it as a base for his parish work and for celebrating Mass. The Archdiocese of Guadalajara records that he personally prepared a group of children to receive their first Communion. During that celebration he asked the children to pray for peace for the Church.",
  "His brother Román was also a priest. The diocesan account records that the brothers celebrated Mass together shortly before Toribio died and that Toribio left Román a letter asking him to care for their family. The next day Toribio worked well into the night at Agua Caliente to bring the parish’s baptism and marriage records up to date.",
  "On February 25, 1928, soldiers and local agrarian fighters entered his refuge and shot him. His sister María was there when he died. About twenty years later his remains were returned to a chapel he had helped build in his home village. In 2000 he was canonized among the companions of Christopher Magallanes.",
]

[[saints.sources]]
title = "Holy See — Canonization biography of Toribio Romo González"
url = "https://www.vatican.va/news_services/liturgy/saints/ns_lit_doc_20000521_romo-gonzalez_sp.html"

[[saints.sources]]
title = "Archdiocese of Guadalajara — Toribio Romo González"
url = "https://arquidiocesisgdl.org/beatos.php?id=57"
