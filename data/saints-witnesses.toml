[[saints]]
id = "lawrence-of-rome"
name = "Saint Lawrence of Rome"
aliases = ["Laurence of Rome", "Laurentius", "San Lorenzo"]
years = "Died 258"
vocation = "Deacon and martyr"
place = "Rome, Italy"
summary = "A Roman deacon executed during the persecution of Christians under Emperor Valerian."
biography = [
  "Lawrence served as a deacon in Rome under Pope Sixtus II. In 258, Emperor Valerian’s persecution reached the clergy of the city. Sixtus was executed, and Lawrence died a few days later. Early Christian communities preserved the names of the martyrs even though few securely documented details about Lawrence’s life or his execution have survived.",
  "A tradition associated with Lawrence’s service as deacon tells of an official who demanded the Church’s property. Lawrence is said to have distributed what was available and then presented the people receiving the Church’s aid. The story locates the Church’s wealth in the people it cares for. Later writers told it as an example of the obligations that come with overseeing a community’s resources.",
  "Another tradition says that he was killed on a gridiron. The image became familiar in Christian art, where the object often identifies him. Accounts of his final words and the precise method used to kill him belong to the literary tradition surrounding his martyrdom.",
  "Rome honored Lawrence at his grave on the Via Tiburtina. The basilica built at the site became one of the city’s principal pilgrim churches. His annual feast, observed on August 10, shows how quickly the memory of an otherwise little-documented Roman deacon could take root far from his own congregation.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Lawrence"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-lawrence"

[[saints]]
id = "agnes-of-rome"
name = "Saint Agnes of Rome"
aliases = ["Agnes the Virgin", "Agnes of the Via Nomentana", "Sant’Agnese"]
years = "Died in antiquity; traditionally c. 304"
vocation = "Virgin and martyr"
place = "Rome, Italy"
summary = "An early Roman martyr remembered for her youth and fidelity to Christ."
biography = [
  "Agnes was a young Christian martyr of Rome. Evidence for her early veneration comes from the burial site on the Via Nomentana and from writers of late antiquity. Ambrose of Milan held up her youth and conviction in his writing on virginity. The survival of early testimony makes it possible to trace her reputation even though a continuous account of her life is unavailable.",
  "Ancient and later authors relate her death in different ways. Christian tradition remembers her as refusing to give up her faith or her commitment to virginity. The exact year, her precise age, and the circumstances of her execution are uncertain. The familiar stories of threats made against her belong to accounts written to commemorate her courage.",
  "The church of Sant’Agnese fuori le Mura grew around her burial place. Her name entered the Roman Canon, the historic Eucharistic prayer of the Roman Rite. In art she is often shown with a lamb, a symbol connected to her name in Latin devotional tradition. Her memorial falls on January 21.",
]

