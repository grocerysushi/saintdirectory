[[saints]]
id = "lucy-of-syracuse"
name = "Saint Lucy of Syracuse"
aliases = ["Saint Lucia", "Lucia of Syracuse", "Santa Lucia"]
years = "Died c. 304"
vocation = "Virgin and martyr"
place = "Syracuse, Sicily, Italy"
summary = "A Sicilian martyr whose ancient cult spread widely through the Church."
biography = [
  "Lucy was honored as a martyr in Syracuse, Sicily. The ancient devotion and the preservation of her name provide more reliable evidence than the detailed accounts told about her later. Tradition places her execution around 304, during the persecution of Christians in the reign of Diocletian.",
  "One account describes Lucy as a young woman who decided to remain unmarried and devote her resources to people in need. When a disappointed suitor denounced her as a Christian, she refused to surrender her faith. The trial and the familiar details about injuries to her eyes come from later tradition.",
  "Her memorial falls on December 13. Devotion to Lucy has spread through the Roman Canon, churches bearing her name, and the customs that surround her feast in various countries. Her name became associated with light, and depictions often show her holding a pair of eyes. Catholics have long invoked her in connection with eye disorders and the loss of sight.",
]
patronage = ["Traditionally invoked by people with eye disorders"]

