summary = "A Franciscan sister who led hospitals and cared for people with Hansen’s disease in Hawaiʻi."
biography = [
  "Born in Germany and raised in New York, Marianne joined the Sisters of Saint Francis of Syracuse and helped oversee hospitals in central New York. In 1883 she led a group of sisters to Hawaiʻi after a request for help caring for people with Hansen’s disease.",
  "Marianne eventually moved to Kalaupapa on Molokaʻi. There the sisters cared for girls and women and helped provide continuity of care as Father Damien’s health failed. Marianne remained at the settlement until her death.",
]

