url = "https://eucharisticcongress.org/post/do-this-in-remembrance-of-me-part-55-saint-names-epi/"

[[saints]]
id = "sebastian"
name = "Saint Sebastian"
aliases = ["Sebastian of Rome", "Sebastianus", "San Sebastiano"]
years = "Died in late Roman antiquity"
vocation = "Martyr"
place = "Rome, Italy"
summary = "An early Roman martyr whose burial site on the Appian Way became a place of veneration."
biography = [
  "Sebastian’s burial was associated with the Appian Way outside Rome. His name appears in an early Roman calendar of martyrs, evidence that Christians had begun to mark his death within the life of the city. The catacombs and basilica that bear his name preserve a place in Rome’s pilgrimage tradition.",
  "The most familiar story comes from a later passion narrative. It presents Sebastian as a Roman soldier who used his position to sustain Christians facing arrest. According to that account, he survived being shot with arrows and was eventually killed after confronting the emperor. There is little secure evidence for these episodes beyond the tradition that carried them.",
  "The image of Sebastian bound and pierced by arrows spread through medieval and Renaissance art. Devotions in Christian communities also associated him with appeals for protection during plague. The Roman Rite places his observance on January 20, the same date as the commemoration of Pope Fabian. The early burial tradition and the later imagery illuminate different parts of Sebastian’s long reception.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Sebastian"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-sebastian"

[[saints.sources]]
title = "Encyclopaedia Britannica — Saint Sebastian"
url = "https://www.britannica.com/biography/Saint-Sebastian"

[[saints]]
id = "fabian"
name = "Saint Fabian"
aliases = ["Pope Fabian", "Pope Saint Fabian", "Fabianus"]
years = "Died 250"
vocation = "Pope and martyr"
place = "Rome, Italy"
summary = "A bishop of Rome who died during the persecution under Emperor Decius."
biography = [
  "Fabian became bishop of Rome in 236, when Roman Christians still met within a society that periodically treated their religious allegiance as suspect. Eusebius, writing much later, recounts that Fabian was visiting the city when a dove settled on him during the assembly choosing a bishop. In the story, the community took it as a sign and elected Fabian. The episode records a tradition about his election.",
  "Fabian served for about fourteen years. His death came in 250 during the persecution associated with Emperor Decius. Cyprian of Carthage later wrote with admiration of his conduct and death, an indication that the Roman community’s loss was known beyond the city.",
  "A grave inscription from the catacomb of Saint Callistus identifies Fabian in Greek as a bishop and martyr. The surviving stone gives a physical point of reference for a figure whose earlier life is otherwise sparsely documented. The Roman Rite remembers him on January 20, the same date as the observance of the martyr Sebastian.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Fabian"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-fabian"

[[saints]]
id = "polycarp"
name = "Saint Polycarp of Smyrna"
aliases = ["Polycarp", "Polykarpos", "Polycarp of İzmir"]
years = "Died in the mid-second century"
vocation = "Bishop, early Christian writer, and martyr"
place = "Smyrna, now İzmir, Türkiye"
summary = "An early bishop whose letter to the Philippians and whose community’s account of his martyrdom survive."
biography = [
  "Polycarp led the Christian community of Smyrna, a city on the coast of Roman Asia. Ignatius of Antioch wrote to him while being taken to Rome, and Polycarp’s own letter to the Philippians survives. The correspondence shows leaders of communities at considerable distances exchanging news, advice, and copies of letters.",
  "In his letter Polycarp urges the Philippians to persevere in faith and gives counsel to widows, deacons, presbyters, and others. He asks the community to share any further news of Ignatius and his companions. The letter is also evidence of how early Christian writers used texts that would become part of the New Testament in their pastoral teaching.",
  "The Church at Smyrna circulated an account of Polycarp’s arrest and death. It describes an old man who was asked to deny Christ and refused. The account draws attention to the congregation’s desire to preserve his memory and honor the anniversary of his death. Its dramatic scenes belong to the ancient community’s testimony and have shaped later pictures of martyrdom.",
  "The exact year of his execution is debated, with dates in the middle decades of the second century most often proposed. Polycarp’s place in early Christian memory rests both on his own surviving words and on how his community recorded his death.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Polycarp"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-polycarp"

[[saints.sources]]
title = "Polycarp — Epistle to the Philippians"
url = "https://www.newadvent.org/fathers/0136.htm"

[[saints.sources]]
title = "Church of Smyrna — Martyrdom of Polycarp"
url = "https://www.newadvent.org/fathers/0102.htm"

[[saints]]
id = "ignatius-of-antioch"
name = "Saint Ignatius of Antioch"
aliases = ["Ignatius Theophorus", "Ignatios of Antioch", "Ignatius of Syria"]
years = "Died in the early second century"
vocation = "Bishop, early Christian writer, and martyr"
place = "Antioch, now Antakya, Türkiye, and Rome"
summary = "A bishop whose letters from custody are early witnesses to Christian worship and church leadership."
biography = [
  "Ignatius served as bishop in Antioch, an important city in Roman Syria where a Christian community had formed early. What can be said about him with the greatest confidence comes from the letters he wrote after his arrest, when he was under guard on the way to Rome. Christian tradition places his martyrdom in the early second century.",
  "Seven letters are widely accepted as his. From Smyrna he addressed the churches of Ephesus, Magnesia, Tralles, and Rome. Further along the journey he wrote to Philadelphia and Smyrna and sent a personal letter to Polycarp. The collection shows a prisoner who remained in active conversation with communities meeting and worshipping across Roman Asia.",
  "Ignatius urged his readers to hold together around their bishops and to pursue a common life of prayer and worship. He insisted on the reality of Christ’s human suffering and wrote of the Eucharist in close connection with that belief. His letter to Rome takes a different tone, asking the community there to refrain from acting to prevent his death.",
  "The later historian Eusebius records the tradition that Ignatius was executed in Rome. The letters matter independently of the details of that final event. Their language offers an early witness to the emergence of the term Catholic Church and to how a bishop understood his responsibility for unity.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Ignatius of Antioch"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-ignatius-of-antioch"

[[saints.sources]]
title = "Benedict XVI — General audience on Saint Ignatius of Antioch"
url = "https://www.vatican.va/content/benedict-xvi/en/audiences/2007/documents/hf_ben-xvi_aud_20070314.html"

[[saints]]
id = "blaise"
name = "Saint Blaise of Sebaste"
aliases = ["Blaise", "Blase", "Blasius", "Vlasios"]
years = "Died traditionally c. 316"
vocation = "Bishop and martyr"
place = "Sebaste, now Sivas, Türkiye"
summary = "A bishop and martyr whose traditional association with throat ailments is remembered in the blessing of throats."
biography = [
  "Blaise is remembered as a bishop of Sebaste, an ancient city at the site of modern Sivas in Türkiye. Tradition places his death during the Roman persecutions in the early fourth century. Much of what is told about him survives in accounts composed after that period, so few details of his ministry or death can be independently established.",
  "One tradition has him withdrawing from danger to a place where wild animals gathered. Another recounts his helping a child who was choking. These stories helped shape devotion to Blaise as a protector of those suffering from ailments of the throat.",
  "The Roman Rite commemorates him on February 3. In the blessing associated with his feast, two candles are held in the form of a cross as a prayer is said for protection from illnesses of the throat and other harm. The blessing remains the way many Catholics first encounter a saint whose ancient biography is largely lost.",
]
patronage = ["Traditionally invoked against throat ailments"]

[[saints.sources]]
title = "Franciscan Media — Saint Blaise"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-blaise"

[[saints]]
id = "george"
name = "Saint George"
aliases = ["George the Martyr", "George of Lydda", "Giorgio", "Jorge"]
years = "Died in late Roman antiquity"
vocation = "Martyr"
place = "Lydda, now Lod, Israel, in traditions of his burial"
summary = "A martyr widely honored in Eastern and Western Christianity and remembered in a later story about a dragon."
biography = [
  "George is venerated as a martyr in both Eastern and Western Christianity. One ancient center of his cult was Lydda, now Lod, where pilgrims honored a place associated with his burial. Tradition describes him as a soldier during the Roman persecutions. The date and circumstances of his death and the details of his service remain uncertain.",
  "Different versions of George’s passion were already circulating in antiquity. The story of a town threatened by a dragon belongs to a much later phase of his devotion. In medieval retellings, George defeats the dragon and saves a young woman offered to it. Christian artists used the scene to portray courage and deliverance.",
  "The cult of George developed its own local forms across the Christian world. In England his name became attached to national patronage and to the red cross on a white ground. His Roman Rite memorial falls on April 23. The breadth of the devotion is well attested even where the surviving evidence for George’s life is limited.",
]
patronage = ["Traditionally venerated as a patron of England"]

[[saints.sources]]
title = "Franciscan Media — Saint George"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-george"

