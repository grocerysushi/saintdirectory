[[saints]]
id = "perpetua-of-carthage"
name = "Saint Perpetua"
aliases = ["Vibia Perpetua", "Perpetua of Carthage"]
years = "Died 203"
vocation = "Early Christian martyr"
place = "Carthage, present-day Tunisia"
summary = "A young mother executed for her Christian faith in Roman Africa, whose account of prison survives in an early passion narrative."
biography = [
  "Perpetua belonged to a group of Christians imprisoned near Carthage in Roman North Africa. The ancient Passion of Perpetua and Felicity includes an account narrated in her voice. The surviving work also contains material from another prisoner, Saturus, and a narrator who describes the events the prisoners could no longer record themselves.",
  "The section attributed to Perpetua describes her as a young mother who is still nursing her child. She recounts the anxiety of being separated from the baby and the relief of securing permission to keep the child with her for a time. Her father visits and pleads with her to spare the family further grief by yielding. At her hearing, Perpetua continues to identify herself as a Christian.",
  "The account includes dreams and visions in which she makes sense of what is happening. A ladder guarded by a dragon becomes an image of danger and the way forward. In another vision, her dead brother Dinocrates passes from suffering to a condition of relief. These episodes show what Perpetua and the community that preserved her testimony thought prayer could mean under extreme pressure.",
  "An anonymous narrator recounts Perpetua’s death with Felicity and their companions at the public games in 203. Their joint memorial on March 7 and their names in the Roman Canon preserve the connection between two women whose circumstances differed and whose imprisonment brought them together.",
]

[[saints.sources]]
title = "Franciscan Media — Saints Perpetua and Felicity"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-perpetua-and-felicity"

[[saints.sources]]
title = "Fordham University Medieval Sourcebook — The Passion of Saints Perpetua and Felicity"
url = "https://sourcebooks.fordham.edu/source/perpetua.asp"

[[saints.sources]]
title = "National Eucharistic Congress — Saint Names in Eucharistic Prayer I"
url = "https://eucharisticcongress.org/post/do-this-in-remembrance-of-me-part-55-saint-names-epi/"

[[saints]]
id = "felicity-of-carthage"
name = "Saint Felicity of Carthage"
aliases = ["Felicitas of Carthage", "Felicity the Martyr"]
years = "Died 203"
vocation = "Early Christian martyr"
place = "Carthage, present-day Tunisia"
summary = "An enslaved Christian who gave birth in prison and was executed with Perpetua and their companions."
biography = [
  "Felicity, or Felicitas, was an enslaved member of a group arrested for their Christian faith near Carthage. The group included Perpetua, whose first-person account survives as part of the ancient Passion of Perpetua and Felicity. Felicity’s story is told principally by the narrator who completes that text.",
  "According to the Passion, Felicity was pregnant and feared that she would be kept behind when the other prisoners died, since the law barred the execution of a pregnant woman. The prisoners prayed together. She gave birth in custody shortly before the appointed day, and the narrator says that another Christian woman raised her daughter.",
  "The narrator records an exchange in which a guard mocks Felicity’s pain in childbirth. Felicity replies that Christ will share her suffering when the time comes to face death. The scene is an example of how the text presents Felicity as able to speak and act for herself under conditions that sharply restricted her freedom.",
  "Felicity and Perpetua were executed with their companions in 203. Their stories show different experiences of motherhood, social standing, and imprisonment within the same Christian community. The Church remembers both women together on March 7 and names them in the Roman Canon. The Passion itself remains the most important evidence for the details preserved about Felicity.",
]

[[saints.sources]]
title = "Franciscan Media — Saints Perpetua and Felicity"
url = "https://www.franciscanmedia.org/saint-of-the-day/saints-perpetua-and-felicity"

[[saints.sources]]
title = "Fordham University Medieval Sourcebook — The Passion of Saints Perpetua and Felicity"
url = "https://sourcebooks.fordham.edu/source/perpetua.asp"

