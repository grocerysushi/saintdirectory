years = "1840–1889"
vocation = "Priest and missionary"
place = "Kalaupapa, Molokaʻi, Hawaiʻi"
summary = "A Belgian priest who lived and worked among people forcibly isolated because they had Hansen’s disease."
biography = [
  "Damien, born Jozef de Veuster, joined the Congregation of the Sacred Hearts of Jesus and Mary and traveled to Hawaiʻi. In 1873 he volunteered to serve at the settlement on Molokaʻi where the Hawaiian government had sent people with Hansen’s disease.",
  "He lived with the residents, served their parishes, and helped improve living conditions and care for the dead. Damien developed the disease himself and remained at the settlement until his death in 1889.",
]

