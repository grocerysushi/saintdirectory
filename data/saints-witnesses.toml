summary = "A survivor of enslavement who gained her freedom in Italy and became a Canossian sister."
biography = [
  "Bakhita was kidnapped as a child in Darfur and sold into slavery. An Italian diplomat brought her to Italy, where she came to know the Canossian sisters. When she resisted attempts to make her leave Italy, Italian authorities determined that she was free.",
  "She was baptized Josephine and entered the Canossian congregation. She lived much of her later life at Schio, carrying out the ordinary work of her community and speaking about her experiences when asked.",
]
patronage = ["Invoked by Catholics working against human trafficking"]

