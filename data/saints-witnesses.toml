[[saints]]
id = "agatha-of-sicily"
name = "Saint Agatha of Sicily"
aliases = ["Agatha of Catania", "Sant’Agata", "Agatha of Palermo"]
years = "Died c. 251"
vocation = "Virgin and martyr"
place = "Catania, Sicily, Italy"
summary = "A Sicilian martyr honored in Catania and remembered in the Roman Canon."
biography = [
  "Agatha is remembered as a Christian martyr of Sicily, and Catania has been a center of her veneration since antiquity. Tradition places her death around 251, during the persecution under Emperor Decius. Secure contemporary details about her family, her trial, and the precise circumstances of her death are scarce.",
  "The narratives of her passion present Agatha as a young woman committed to Christ who refuses the demands of a Roman official. They recount imprisonment and serious injuries. These later accounts shaped the images by which readers and worshippers recognize her, and they should be read as part of the history of her devotion.",
  "Agatha is named among the martyrs in the Roman Canon. Catania venerates her as a protector, and local tradition associates her with appeals for help during volcanic danger. Devotion also came to connect her with people suffering from diseases of the breast. The Roman Rite celebrates her memorial on February 5.",
]

