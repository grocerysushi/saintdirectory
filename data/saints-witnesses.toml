[[saints]]
id = "stephen-the-first-martyr"
name = "Saint Stephen the First Martyr"
aliases = ["Stephen Protomartyr", "Stephen of Jerusalem", "Stephen the Deacon"]
years = "Died c. 35"
vocation = "Early Christian minister and martyr"
place = "Jerusalem"
summary = "The Acts of the Apostles recounts Stephen’s service and his death as the first named Christian martyr."
biography = [
  "Stephen appears in the Acts of the Apostles when the young Church in Jerusalem faces an argument about food. Greek-speaking believers complained that their widows were being neglected in the daily distribution. The apostles asked the assembly to choose seven people to oversee the work. Stephen was among those selected, and the apostles prayed and laid hands on the seven. The episode gives a place in the Church’s earliest history to the practical problem of caring for people fairly.",
  "Acts also presents Stephen as a public witness. His opponents disputed with him and brought him before the council, where witnesses accused him of speaking against the Temple and the law. He answered with a speech following the story of Israel from Abraham through Moses to the prophets. His argument culminates in an accusation that his hearers have resisted the Holy Spirit.",
  "The account says Stephen looked toward heaven and spoke of seeing Jesus at God’s right hand. The crowd drove him outside the city and stoned him. Stephen prayed for those killing him. Acts calls attention to Saul, who was present and approved of the execution. Saul would later become the Christian missionary Paul.",
  "Luke’s narrative places the death at the beginning of a wider persecution in Jerusalem. Believers scattered into Judea and Samaria, taking their preaching with them. Christian tradition remembers Stephen as the first martyr named in the Church’s story and as a model for those charged with service.",
]

