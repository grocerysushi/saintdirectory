[[saints]]
id = "vincent-of-saragossa"
name = "Saint Vincent of Saragossa"
aliases = ["Vincent of Zaragoza", "Vincent of Zaragossa", "Vincent of Valencia", "Vicente Mártir"]
years = "Died c. 304"
vocation = "Deacon and martyr"
place = "Zaragoza and Valencia, Spain"
summary = "A Spanish deacon venerated as a martyr in Valencia from early Christian times."
biography = [
  "Vincent served as a deacon in Zaragoza and is venerated as a martyr in Valencia. Late antique writers preserve evidence of his reputation. The poet Prudentius celebrated him in verse, and Augustine preached about his martyrdom. Such works show that his memory traveled beyond the city where he died.",
  "In the traditional account, Vincent was arrested with his bishop, Valerius, during the persecution under Diocletian. The bishop was sent away, and Vincent remained in custody. The accounts portray him resisting demands to hand over sacred books and refusing to abandon his faith. The narratives of his trials were written after his death and give more detail than can be firmly established.",
  "His burial at Valencia became a focus of local devotion. Later stories offered different explanations for how his body reached its resting place, and Christian art used images from his passion to identify him. The General Roman Calendar assigns his commemoration to January 22. The U.S. proper calendar lists it on January 23.",
]

[[saints.sources]]
title = "Franciscan Media — Saint Vincent of Zaragossa"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-vincent-of-zaragossa"

[[saints.sources]]
title = "USCCB — Proper Calendar for the Dioceses of the United States of America"
url = "https://www.usccb.org/prayer-and-worship/liturgical-year-and-calendar/proper-calendar"

[[saints]]
id = "valentine-of-rome"
name = "Saint Valentine of Rome"
aliases = ["Valentinus of Rome", "Valentine the Martyr", "San Valentino"]
years = "Traditionally third century"
vocation = "Martyr, traditionally a priest"
place = "Rome, Italy"
summary = "A martyr remembered on February 14 whose historical identity is difficult to distinguish from other saints named Valentine."
biography = [
  "Valentine of Rome is traditionally remembered as a priest and martyr associated with the Via Flaminia. Another devotion honors a bishop of Terni named Valentine. Early evidence is too thin to settle whether these traditions concern different people or whether a single martyr’s cult developed more than one account. Dates and details given in later stories should be treated accordingly.",
  "Accounts of the Roman priest often place him in the third century and connect him with persecution under a Roman emperor. Stories of his helping Christians, healing the daughter of a man responsible for keeping him under guard, or arranging secret marriages vary across versions. They attest to changing ways in which Christians and later popular culture imagined his life.",
  "The association between February 14 and the exchange of tokens of affection developed long after the period usually assigned to Valentine. Late medieval writers helped give the day a connection with courtship, and later customs extended it to letters, cards, and gifts. The existence of those traditions leaves the historical identity of the ancient martyr open.",
]
patronage = ["Traditionally associated with lovers"]

[[saints.sources]]
title = "Encyclopaedia Britannica — Saint Valentine"
url = "https://www.britannica.com/biography/Saint-Valentine"

[[saints.sources]]
title = "Vatican News — Saint Valentine, martyr on the Via Flaminia"
url = "https://www.vaticannews.va/en/saints/02/14/st--valentin--martyr-on-the--via-flaminia.html"

[[saints]]
id = "john-fisher"
name = "Saint John Fisher"
aliases = ["Cardinal John Fisher", "John Fisher of Rochester"]
years = "1469–1535"
vocation = "Bishop, cardinal, and martyr"
place = "Rochester and London, England"
summary = "A scholar and bishop executed after refusing to recognize Henry VIII as supreme head of the Church in England."
biography = [
  "John Fisher studied at Cambridge, where he became a priest, teacher, and eventually chancellor of the university. He worked with Lady Margaret Beaufort, the mother of Henry VII, to advance education and helped carry out her plans for colleges at Cambridge. Fisher’s interest in learning extended to preaching and to the formation of clergy. He became bishop of Rochester in 1504 and served there for three decades.",
  "Fisher took part in the theological controversies of the early Reformation, writing in defense of Catholic teaching. His public role also brought him into Henry VIII’s dispute over the validity of the king’s marriage to Catherine of Aragon. Fisher defended the marriage. He later opposed the king’s claim to supremacy over the Church in England.",
  "In 1534 Fisher and Thomas More refused the oath demanded under the succession legislation and were confined in the Tower of London. While Fisher was in prison, Pope Paul III made him a cardinal. Henry’s government proceeded against him for treason over his denial of the king’s ecclesiastical supremacy. He was executed on Tower Hill on June 22, 1535, several weeks before More.",
  "The Catholic Church canonized Fisher and More together in 1935. Their stories intersect at the Tower, although their careers were different. Fisher’s defense of what he understood as the freedom of the Church came after years spent as a teacher, preacher, and diocesan bishop.",
]

[[saints.sources]]
title = "Franciscan Media — Saint John Fisher"
url = "https://www.franciscanmedia.org/saint-of-the-day/saint-john-fisher"

[[saints.sources]]
title = "Encyclopaedia Britannica — Saint John Fisher"
