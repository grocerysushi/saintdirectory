[[saints]]
id = "antoine-daniel"
name = "Saint Antoine Daniel"
aliases = ["Anthony Daniel", "Antoine Daniel, SJ", "Father Antoine Daniel", "Anȣennen"]
years = "1601–1648"
vocation = "Jesuit priest, teacher, and martyr"
place = "Dieppe, Quebec, and Wendat country"
summary = "A Jesuit teacher who taught Christian prayers in Wendat and served at the mission of Saint-Joseph II."
biography = [
  "Antoine Daniel was born at Dieppe in 1601. He had begun studying law when he entered the Society of Jesus at Rouen in 1621. He taught younger pupils and studied theology in France. In 1632 he went to Cape Breton, where his brother Charles was in command of a French settlement.",
  "Daniel reached Quebec the following year and traveled into Wendat country with the mission in 1634. He learned the Wendat language and taught children to sing the Lord’s Prayer and the Creed in it. This work led the Jesuits to put him in charge of a school at Quebec for Wendat boys. The project lasted about two years, and Daniel returned to the Wendat communities.",
  "On July 4, 1648, a Haudenosaunee war party attacked Teanaostaiaë, the village where the Jesuits served at Saint-Joseph II. The mission’s account says Daniel had been saying Mass. He encouraged those present, baptized people seeking baptism, and urged others to escape. He was killed during the attack.",
  "Daniel’s career connected teaching in France with the very different work of learning and teaching in Wendat country. The name Anȣennen appears in the historical record as the name Wendat people gave him. Pius XI canonized Daniel with seven other North American Martyrs on June 29, 1930.",
]

[[saints.sources]]
title = "Dictionary of Canadian Biography — Antoine Daniel"
url = "https://www.biographi.ca/en/bio/daniel_antoine_1E.html"

[[saints.sources]]
