<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}Explore sourced Catholic saint biographies and the U.S. Roman Rite calendar.{% endblock %}">
  <title>{% block title %}Saint Directory{% endblock %}</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Saint Directory</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="/#saints"{% block saints_current %}{% endblock %}>Saints</a>
        <a href="/calendar"{% block calendar_current %}{% endblock %}>Calendar</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Saint Directory</span>
      <a href="/calendar">U.S. Roman Rite calendar</a>
    </div>
  </footer>
</body>
</html>
