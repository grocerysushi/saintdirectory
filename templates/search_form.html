<form class="search-form" action="/search" method="get" role="search">
  <label class="sr-only" for="saint-search">Search for a saint</label>
  <div class="search-controls">
    <input id="saint-search" name="q" type="search" value="{{ query }}" placeholder="Try “Thérèse” or “martyr”" maxlength="120">
    <button type="submit">Search</button>
  </div>
</form>
